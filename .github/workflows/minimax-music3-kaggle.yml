name: MiniMax Music 3 — Kaggle Free GPU

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Unique Music Engine job id"
        required: true
        type: string
      prompt:
        description: "Music generation prompt"
        required: false
        default: ""
        type: string
      lyrics:
        description: "Lyrics"
        required: false
        default: ""
        type: string
      duration:
        description: "Duration in seconds"
        required: false
        default: "30"
        type: string
      bpm:
        description: "BPM or auto"
        required: false
        default: "auto"
        type: string
      key:
        description: "Key or auto"
        required: false
        default: "auto"
        type: string
      mode:
        description: "Mode or auto"
        required: false
        default: "auto"
        type: string
      vocal_language:
        description: "Vocal language"
        required: false
        default: "en"
        type: string
      vocal_direction:
        description: "Vocal direction"
        required: false
        default: ""
        type: string
      force_instrumental:
        description: "Instrumental only"
        required: false
        default: "false"
        type: string
      output_put_url:
        description: "Short-lived signed Vercel Blob PUT URL"
        required: true
        type: string
      status_put_url:
        description: "Short-lived signed Vercel Blob status PUT URL"
        required: false
        default: ""
        type: string

run-name: "Music Engine ${{ inputs.job_id || 'workflow-test' }}"

jobs:
  run-minimax-music3:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      JOB_ID: ${{ inputs.job_id || format('manual-{0}', github.run_id) }}
      OUTPUT_PUT_URL: ${{ inputs.output_put_url }}
      STATUS_PUT_URL: ${{ inputs.status_put_url || '' }}
      REQUEST_PROMPT: ${{ inputs.prompt }}
      REQUEST_LYRICS: ${{ inputs.lyrics }}
      REQUEST_DURATION: ${{ inputs.duration || '30' }}
      REQUEST_BPM: ${{ inputs.bpm || 'auto' }}
      REQUEST_KEY: ${{ inputs.key || 'auto' }}
      REQUEST_MODE: ${{ inputs.mode || 'auto' }}
      REQUEST_VOCAL_LANGUAGE: ${{ inputs.vocal_language || 'en' }}
      REQUEST_VOCAL_DIRECTION: ${{ inputs.vocal_direction }}
      REQUEST_FORCE_INSTRUMENTAL: ${{ inputs.force_instrumental || 'false' }}

    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate runner
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/kaggle/minimax_music3_batch.py
          echo "MiniMax runner syntax: PASS"

      - name: Validate credentials and request
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN}" || { echo "Missing KAGGLE_API_TOKEN"; exit 1; }
          test -n "${KAGGLE_USERNAME}" || { echo "Missing KAGGLE_USERNAME"; exit 1; }
          test -n "${OUTPUT_PUT_URL}" || { echo "Missing signed Blob output URL"; exit 1; }
          echo "Kaggle credentials present."
          echo "Job: ${JOB_ID}"

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade kaggle
          kaggle --version

      - name: Prepare unique Kaggle kernel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .kaggle-music3-kernel
          mkdir -p .kaggle-music3-kernel
          cp scripts/kaggle/minimax_music3_batch.py .kaggle-music3-kernel/
          python - <<'PY'
          import json, os
          request = {
              "job_id": os.environ["JOB_ID"],
              "prompt": os.environ.get("REQUEST_PROMPT", ""),
              "lyrics": os.environ.get("REQUEST_LYRICS", ""),
              "duration": os.environ.get("REQUEST_DURATION", "30"),
              "bpm": os.environ.get("REQUEST_BPM", "auto"),
              "key": os.environ.get("REQUEST_KEY", "auto"),
              "mode": os.environ.get("REQUEST_MODE", "auto"),
              "vocalLanguage": os.environ.get("REQUEST_VOCAL_LANGUAGE", "en"),
              "vocalDirection": os.environ.get("REQUEST_VOCAL_DIRECTION", ""),
              "forceInstrumental": os.environ.get("REQUEST_FORCE_INSTRUMENTAL", "false").lower() == "true"
          }
          with open(".kaggle-music3-kernel/music_request.json", "w", encoding="utf-8") as f:
              json.dump(request, f, ensure_ascii=False)
          PY
          python - <<'PY'
          import json, os
          from pathlib import Path
          source = Path(".kaggle-music3-kernel/minimax_music3_batch.py")
          request = {
              "job_id": os.environ["JOB_ID"],
              "prompt": os.environ.get("REQUEST_PROMPT", ""),
              "lyrics": os.environ.get("REQUEST_LYRICS", ""),
              "duration": os.environ.get("REQUEST_DURATION", "30"),
              "bpm": os.environ.get("REQUEST_BPM", "auto"),
              "key": os.environ.get("REQUEST_KEY", "auto"),
              "mode": os.environ.get("REQUEST_MODE", "auto"),
              "vocalLanguage": os.environ.get("REQUEST_VOCAL_LANGUAGE", "en"),
              "vocalDirection": os.environ.get("REQUEST_VOCAL_DIRECTION", ""),
              "forceInstrumental": os.environ.get("REQUEST_FORCE_INSTRUMENTAL", "false").lower() == "true"
          }
          embedded = "EMBEDDED_REQUEST = " + repr(request) + "\n"
          source.write_text(embedded + source.read_text(encoding="utf-8"), encoding="utf-8")
          print("Embedded Music Studio request into Kaggle script.")
          job=os.environ["JOB_ID"].lower().replace("_","-")
          slug=("bikeztagram-mx3-"+job)[:48].rstrip("-")
          meta={
              "id": f"{os.environ['KAGGLE_USERNAME']}/{slug}",
              "title": slug,
              "code_file": "minimax_music3_batch.py",
              "language": "python",
              "kernel_type": "script",
              "is_private": "true",
              "enable_gpu": "true",
              "enable_internet": "true",
              "machine_shape": "NvidiaTeslaT4"
          }
          with open(".kaggle-music3-kernel/kernel-metadata.json","w",encoding="utf-8") as f:
              json.dump(meta,f,indent=2)
          with open(".kaggle-music3-kernel/kernel-ref.txt","w",encoding="utf-8") as f:
              f.write(meta["id"])
          print("Kaggle kernel:", meta["id"])
          PY

      - name: Push and start Kaggle GPU job
        shell: bash
        run: |
          set -euo pipefail
          KERNEL="$(cat .kaggle-music3-kernel/kernel-ref.txt)"
          kaggle kernels push -p .kaggle-music3-kernel --accelerator NvidiaTeslaT4 --timeout 5400
          echo "Kaggle job submitted: ${KERNEL}"

      - name: Monitor Kaggle job
        shell: bash
        run: |
          set -euo pipefail
          KERNEL="$(cat .kaggle-music3-kernel/kernel-ref.txt)"
          for i in $(seq 1 720); do
            STATUS="$(kaggle kernels status "${KERNEL}" 2>&1 || true)"
            echo "CHECK $i/720 — $STATUS"
            if echo "$STATUS" | grep -Eiq 'COMPLETE|SUCCESS|ERROR|FAILED|CANCEL'; then
              if echo "$STATUS" | grep -Eiq 'ERROR|FAILED|CANCEL'; then
                echo "Kaggle job failed."
                kaggle kernels logs "${KERNEL}" 2>&1 | tee kaggle-failure.log | tail -n 500 || true
                exit 1
              fi
              break
            fi
            if [ "$i" -eq 720 ]; then
              echo "Kaggle job did not finish within the workflow monitoring window."
              exit 1
            fi
            sleep 30
          done

      - name: Download generated WAV
        shell: bash
        run: |
          set -euo pipefail
          KERNEL="$(cat .kaggle-music3-kernel/kernel-ref.txt)"
          mkdir -p kaggle-output
          kaggle kernels output "${KERNEL}" -p kaggle-output -o --file-pattern '.*\.wav'
          find kaggle-output -type f -name '*.wav' -print
          test -n "$(find kaggle-output -type f -name '*.wav' -print -quit)" || {
            echo "No WAV output was produced."
            kaggle kernels logs "${KERNEL}" 2>&1 | tail -n 500 || true
            exit 1
          }

      - name: Upload WAV directly to Vercel Blob
        shell: bash
        run: |
          set -euo pipefail
          WAV="$(find kaggle-output -type f -name '*.wav' -print -quit)"
          echo "Uploading generated WAV to the signed Vercel Blob URL."
          UPLOAD_RESPONSE="$(curl --fail-with-body --retry 3 --retry-delay 2 \
            -X PUT \
            -H "Content-Type: audio/wav" \
            --data-binary "@${WAV}" \
            "${OUTPUT_PUT_URL}")"
          echo "Blob upload response received."
          echo "${UPLOAD_RESPONSE}" | python -c 'import json,sys; d=json.load(sys.stdin); print("BLOB_PATHNAME="+str(d.get("pathname",""))); print("BLOB_SIZE="+str(d.get("size",""))); print("BLOB_UPLOAD_URL_PRESENT="+str(bool(d.get("url"))))'
          echo "WAV upload: PASS"

      - name: Verify WAV is retrievable through Music Engine
        shell: bash
        run: |
          set -euo pipefail
          VERIFY_URL="https://bikeztagram-ai-build-v2.vercel.app/api/music-engine?jobId=${JOB_ID}"
          echo "Verifying server-side Blob retrieval: ${VERIFY_URL}"
          for attempt in $(seq 1 10); do
            RESPONSE="$(curl --silent --show-error --fail "${VERIFY_URL}" || true)"
            echo "VERIFY ${attempt}/10 — ${RESPONSE}"
            if echo "${RESPONSE}" | grep -q '"status":"COMPLETED"'; then
              echo "Blob retrieval: PASS"
              exit 0
            fi
            sleep 2
          done
          echo "Blob upload completed but Music Engine could not retrieve the WAV."
          exit 1

      - name: Report cold worker failure to Music Engine
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          test -n "${STATUS_PUT_URL}" || {
            echo "No status PUT URL was supplied; failure remains visible in GitHub Actions."
            exit 0
          }
          DETAILS="Cold MiniMax Music 3 Kaggle worker failed."
          if [ -f kaggle-failure.log ]; then
            DETAILS="$(tail -n 120 kaggle-failure.log | tr '\n' ' ' | cut -c1-7000)"
          fi
          export FAILURE_DETAILS="$DETAILS"
          python - <<'PY'
          import json, os, subprocess, time
          payload = {
              "jobId": os.environ["JOB_ID"],
              "status": "FAILED",
              "progress": 100,
              "phase": "Generation failed — MiniMax/Kaggle cold worker",
              "progressEstimated": False,
              "error": "Cold MiniMax Music 3 GPU render failed.",
              "details": os.environ.get("FAILURE_DETAILS", "")[:7000],
              "updatedAt": int(time.time() * 1000),
          }
          with open("/tmp/music-failure.json", "w", encoding="utf-8") as f:
              json.dump(payload, f)
          subprocess.run([
              "curl", "--fail-with-body", "--retry", "3", "--retry-delay", "2",
              "-X", "PUT", "-H", "Content-Type: application/json",
              "--data-binary", "@/tmp/music-failure.json",
              os.environ["STATUS_PUT_URL"]
          ], check=True)
          PY

      - name: Delete temporary Kaggle kernel
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .kaggle-music3-kernel/kernel-ref.txt ]; then
            KERNEL="$(cat .kaggle-music3-kernel/kernel-ref.txt)"
            kaggle kernels delete "${KERNEL}" -y || true
          fi
