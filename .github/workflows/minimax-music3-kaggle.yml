name: MiniMax Music 3 — Kaggle T4x2

on:
  workflow_dispatch:

jobs:
  run-minimax-music3:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KERNEL_SLUG: bikeztagram-minimax-music-3-t4x2

    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Validate submitted Python runner
        shell: bash
        run: |
          set -euo pipefail
          echo "=== PYTHON SYNTAX PREFLIGHT ==="
          python -m py_compile scripts/kaggle/minimax_music3_batch.py
          echo "Python runner syntax: PASS"

      - name: Validate Kaggle credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN}" || { echo "Missing GitHub secret KAGGLE_API_TOKEN"; exit 1; }
          test -n "${KAGGLE_USERNAME}" || { echo "Missing GitHub secret KAGGLE_USERNAME"; exit 1; }
          echo "Kaggle credentials present for configured user."
          echo "Kaggle kernel: https://www.kaggle.com/code/${KAGGLE_USERNAME}/${KERNEL_SLUG}"

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade kaggle
          kaggle --version

      - name: Prepare Kaggle kernel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .kaggle-music3-kernel
          mkdir -p .kaggle-music3-kernel
          cp scripts/kaggle/minimax_music3_batch.py .kaggle-music3-kernel/
          cat > .kaggle-music3-kernel/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/${KERNEL_SLUG}",
            "title": "Bikeztagram MiniMax Music 3 T4x2",
            "code_file": "minimax_music3_batch.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": "true",
            "enable_gpu": "true",
            "enable_internet": "true",
            "machine_shape": "NvidiaTeslaT4"
          }
          EOF
          cat .kaggle-music3-kernel/kernel-metadata.json

      - name: Push and start Kaggle GPU job
        shell: bash
        run: |
          set -euo pipefail
          echo "=== SUBMITTING KAGGLE GPU JOB ==="
          kaggle kernels push -p .kaggle-music3-kernel --accelerator NvidiaTeslaT4 --timeout 5400
          echo "=== KAGGLE JOB SUBMITTED ==="
          echo "Kaggle kernel: https://www.kaggle.com/code/${KAGGLE_USERNAME}/${KERNEL_SLUG}"

      - name: Monitor Kaggle job with live diagnostics
        shell: bash
        run: |
          set -euo pipefail
          MAX_CHECKS=120
          for i in $(seq 1 "$MAX_CHECKS"); do
            echo ""
            echo "============================================================"
            echo "KAGGLE MONITOR CHECK $i/$MAX_CHECKS — $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "============================================================"

            STATUS="$(kaggle kernels status "${KAGGLE_USERNAME}/${KERNEL_SLUG}" 2>&1 || true)"
            echo "STATUS:"
            echo "$STATUS"

            echo ""
            echo "RECENT KAGGLE LOGS:"
            kaggle kernels logs "${KAGGLE_USERNAME}/${KERNEL_SLUG}" 2>&1 | tail -n 160 || true

            if echo "$STATUS" | grep -Eiq 'COMPLETE|SUCCESS|ERROR|FAILED|CANCEL'; then
              echo ""
              echo "=== KAGGLE TERMINAL STATE ==="
              echo "$STATUS"
              break
            fi

            if [ "$i" -eq "$MAX_CHECKS" ]; then
              echo "Kaggle job did not reach a terminal state within 60 minutes."
              exit 1
            fi
            sleep 30
          done

      - name: Download Kaggle output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kaggle-output
          echo "=== DOWNLOADING WAV OUTPUT ==="
          kaggle kernels output "${KAGGLE_USERNAME}/${KERNEL_SLUG}" -p kaggle-output -o --file-pattern '.*\.wav' || true
          find kaggle-output -maxdepth 2 -type f -print
          if ! find kaggle-output -type f -name '*.wav' -print -quit | grep -q .; then
            echo "No WAV output was produced."
            echo "=== FINAL KAGGLE LOGS ==="
            kaggle kernels logs "${KAGGLE_USERNAME}/${KERNEL_SLUG}" 2>&1 | tail -n 500 || true
            exit 1
          fi

      - name: Upload WAV as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: minimax-music3-test-wav
          path: kaggle-output/*.wav
          if-no-files-found: error
