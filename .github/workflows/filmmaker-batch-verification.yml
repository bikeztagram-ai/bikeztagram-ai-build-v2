name: Bikeztagram Filmmaker Batch Verification

on:
  push:
    branches: [dev/ai-filmmaker-batch-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout batch branch
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Build production bundle
        run: npm run build
      - name: Verify protected audio/render contract
        run: npm run verify:batch47
      - name: Verify integrated audio director release
        run: npm run verify:batch48
      - name: Verify director selection and story coverage
        run: npm run verify:batch49
      - name: Verify API resilience and protected Blob boundary
        run: npm run verify:batch50
      - name: Verify Gemini director model failover
        run: npm run verify:batch51
      - name: Verify Stage 2 direction preservation
        run: npm run verify:batch52
      - name: Verify transient API retry runtime
        run: npm run verify:batch53
      - name: Verify Gemini 404 failover and timestamp safety
        run: npm run verify:batch54
