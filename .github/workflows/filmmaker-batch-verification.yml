name: Bikeztagram Filmmaker Batch Verification

on:
  push:
    branches: [dev/ai-filmmaker-batch-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout batch branch
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build production bundle
        run: npm run build
      - name: Verify protected audio/render contract
        run: npm run verify:batch47
      - name: Verify integrated audio director release
        run: npm run verify:batch48
