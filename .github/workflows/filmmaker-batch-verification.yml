name: Bikeztagram Filmmaker Batch Verification

on:
  push:
    branches: [dev/ai-filmmaker-batch-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout batch branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Build production bundle
        run: npm run build
      - name: Run consolidated release-candidate verification
        run: node scripts/verify-release-candidate.mjs
