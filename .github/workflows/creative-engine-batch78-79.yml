name: Bikeztagram Creative Engine Batches 78-80
on:
  push:
    branches:
      - development/from-e2e-working-baseline
  pull_request:
    branches:
      - baseline/e2e-blob-gemini-working-2026-08-23
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  creative-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build
      - name: Verify generated scene engine
        run: npm run verify:batch78
      - name: Verify complete-film orchestrator
        run: npm run verify:batch79
      - name: Verify Creative Director API
        run: npm run verify:batch80
      - name: Verify real media production bridge
        run: node scripts/verify-production-bridge.mjs
      - name: Verify app production integration
        run: node scripts/verify-production-integration.mjs
      - name: Verify render guard and soundtrack V3
        run: node scripts/verify-batch93-render-guard.mjs
