name: Bikeztagram Music Video Director V2
on:
  push:
    branches: [parallel/batch-26-creative-audio-analysis-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/verify-music-video-director-v2.mjs
