name: Autonomous Builder Batch

on:
  workflow_dispatch:
    inputs:
      run_duration:
        description: 'How long should AutoBot work this run?'
        required: true
        default: '60m'
        type: choice
        options:
          - '15m'
          - '30m'
          - '1h'
          - '2h'
          - '3h'
          - '4h'
          - '5h'
          - '6h'

concurrency:
  group: autonomous-builder-queue
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  run-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BUILDER_BASE_BRANCH: main
      BUILDER_MAX_MINUTES: '60'
      BUILDER_MAX_UNITS: '20'
      BUILDER_PROTECTED_PATHS: .github/workflows/,builder/runner/,builder/quality/,config/autonomous-builder-queue.json,scripts/prepare-autonomous-batch.mjs
      BUILDER_VERIFY_COMMANDS: npm run build,npm run verify:batch76,npm run verify:pro-song

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure requested run duration
        id: runtime
        env:
          REQUESTED_DURATION: ${{ inputs.run_duration }}
        run: |
          set -euo pipefail
          case "$REQUESTED_DURATION" in
            15m) MINUTES=15 ;;
            30m) MINUTES=30 ;;
            1h) MINUTES=60 ;;
            2h) MINUTES=120 ;;
            3h) MINUTES=180 ;;
            4h) MINUTES=240 ;;
            5h) MINUTES=300 ;;
            6h) MINUTES=360 ;;
            *) echo "Unsupported run duration: $REQUESTED_DURATION"; exit 1 ;;
          esac
          echo "minutes=$MINUTES" >> "$GITHUB_OUTPUT"
          echo "BUILDER_MAX_MINUTES=$MINUTES" >> "$GITHUB_ENV"
          {
            echo '## 🤖 Autonomous Builder'
            echo "- **Requested runtime:** $REQUESTED_DURATION"
            echo "- **Execution budget:** $MINUTES minutes"
            echo '- **Mode:** Gemini-free deterministic builder'
            echo '- **Merge:** never automatic'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Select next queued objective
        run: node scripts/prepare-autonomous-batch.mjs

      - name: Report selected objective
        if: always()
        run: |
          {
            echo ''
            echo '### Current work'
            if [ "${BUILDER_NO_WORK:-false}" = 'true' ]; then
              echo '- **Status:** 💤 IDLE'
              echo "- **Reason:** ${BUILDER_NO_WORK_REASON:-none}"
            else
              echo '- **Status:** 🟢 RUNNING'
              echo "- **Batch:** ${BUILDER_BATCH_ID:-unknown}"
              echo "- **Branch:** ${BUILDER_WORKING_BRANCH:-unknown}"
              echo "- **Objective:** ${BUILDER_OBJECTIVE:-unknown}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate builder
        if: env.BUILDER_NO_WORK != 'true'
        run: |
          set -euo pipefail
          node --check builder/runner/deterministic-executor.mjs
          node --check scripts/prepare-autonomous-batch.mjs

      - name: Run long-duration deterministic builder
        if: env.BUILDER_NO_WORK != 'true'
        run: |
          set -euo pipefail
          echo "AutoBot runtime budget: ${BUILDER_MAX_MINUTES} minutes"
          node builder/runner/deterministic-executor.mjs

      - name: Publish live run state
        if: always() && env.BUILDER_NO_WORK != 'true'
        run: |
          state='builder/working/deterministic-autobot.json'
          {
            echo ''
            echo '### 📊 Latest checkpoint'
            if [ -f "$state" ]; then
              jq '{status,objectiveId,currentTask,completed,lastVerifiedTask,blockedTask,error,updatedAt}' "$state"
            else
              echo 'Checkpoint not found.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare review evidence
        if: always() && env.BUILDER_NO_WORK != 'true'
        run: |
          set -euo pipefail
          mkdir -p builder/reviews/${BUILDER_BATCH_ID:-unknown}
          state='builder/working/deterministic-autobot.json'
          manifest="builder/reviews/${BUILDER_BATCH_ID:-unknown}/manifest.md"
          {
            echo "# AutoBot review package"
            echo
            echo "- Batch: ${BUILDER_BATCH_ID:-unknown}"
            echo "- Objective: ${BUILDER_OBJECTIVE:-unknown}"
            echo "- Requested runtime: ${{ inputs.run_duration }}"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '## Checkpoint'
            if [ -f "$state" ]; then
              echo '```json'
              jq . "$state"
              echo '```'
            else
              echo 'No checkpoint was produced.'
            fi
            echo
            echo '## Changed files'
            git diff --name-status origin/main...HEAD || true
          } > "$manifest"

      - name: Upload run state and review evidence
        if: always() && env.BUILDER_NO_WORK != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: autobot-run-${{ github.run_number }}-${{ env.BUILDER_BATCH_ID }}
          path: |
            builder/working/deterministic-autobot.json
            builder/reviews/${{ env.BUILDER_BATCH_ID }}/manifest.md
          if-no-files-found: warn

      - name: Report final state
        if: always()
        run: |
          {
            echo ''
            echo '## 🧾 Final state'
            echo "- **Workflow:** ${{ job.status }}"
            echo "- **Requested runtime:** ${{ inputs.run_duration }}"
            echo "- **Batch:** ${BUILDER_BATCH_ID:-none}"
            echo "- **Branch:** ${BUILDER_WORKING_BRANCH:-none}"
            echo '- **Automatic merge:** ❌ Never'
            echo '- **Automatic production deployment:** ❌ Never'
          } >> "$GITHUB_STEP_SUMMARY"
