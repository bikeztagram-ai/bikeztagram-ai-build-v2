name: Autonomous Builder Batch

on:
  workflow_dispatch:
    inputs:
      batch_id:
        description: Batch identifier
        required: true
        default: batch-82
      objective:
        description: Objective for this batch
        required: true
        default: >-
          Advance Bikeztagram AI directly toward the finished end-game product, not a temporary or minimum-compliance implementation. First inspect the existing application and all relevant prior contracts, especially musicProvider, director, renderer, App, media-analysis, Blob upload/read, Gemini/director failover, Lyria/music generation, beat-sync, captions, social export, and the existing verification scripts. Preserve all working behaviour and improve it in place; do not rebuild working systems unnecessarily. Treat the finished product quality bar as production-grade cinematic AI video direction plus genuinely exciting original music: the AI director must interpret each natural-language creative prompt as a complete production specification and turn available media into a coherent story with intelligent shot selection, pacing, framing/cropping, motion, zoom/pan, speed changes, transitions, colour treatment, text, soundtrack choice, beat/energy synchronisation, and a strong ending. The music system must move toward professional, memorable, copyright-safe original soundtrack generation/selection with strong hooks, musical structure, builds, drops/reveals, emotional energy, beat metadata, timing, mixing/audibility, and video-aware synchronisation rather than generic background audio. Improve existing implementations where they are weak, integrate independent improvements in parallel where safe, and make every change compatible with the eventual end-state architecture so it does not need to be thrown away and rebuilt later. Use the check-fix-check-continue loop: implement real improvements, run all relevant verification/build checks, diagnose and fix failures, rerun checks, and continue within the bounded pass until the batch is genuinely complete. Do not merely add tests or report gaps; make production-code improvements where the repository and objective support them. Do not modify .github/workflows/** or autonomous-runner infrastructure in this product batch. Do not automatically merge to main, deploy production, or provision paid infrastructure.
      working_branch:
        description: Isolated branch to write to
        required: true
        default: autonomous-builder/batch-82

permissions:
  contents: write

jobs:
  run-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_3M95heKqbtDeI1h2dDKBWBtS
      VERCEL_PROJECT_ID: prj_75Uw3YoRkT5XOjXnSaVTnM2wHXte
      GITHUB_TOKEN: ${{ secrets.BUILDER_GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BUILDER_REPO_URL: https://github.com/bikeztagram-ai/bikeztagram-ai-build-v2.git
      BUILDER_BATCH_ID: ${{ inputs.batch_id }}
      BUILDER_WORKING_BRANCH: ${{ inputs.working_branch }}
      BUILDER_BASE_BRANCH: main
      BUILDER_MAX_MINUTES: "45"
      BUILDER_GEMINI_MODEL: gemini-3.5-flash-lite
      BUILDER_OBJECTIVE: ${{ inputs.objective }}
      BUILDER_ACCEPTANCE: Runner configuration is explicit and bounded.;No automatic merge to main.;Build and relevant verification commands are required before review.;Do not modify .github/workflows/** during product batches.;Preserve working contracts and improve existing implementation toward the end-game product quality bar.;Make real production-code improvements rather than only adding tests or documentation.;Run check-fix-check-continue verification across the relevant existing contracts.
      BUILDER_VERIFY_COMMANDS: npm run build,npm run verify:batch76,npm run verify:pro-song
    steps:
      - name: Checkout runner
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Validate runner secrets
        run: |
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN is missing"; exit 1; }
          test -n "$VERCEL_TEAM_ID" || { echo "VERCEL_TEAM_ID is missing"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "VERCEL_PROJECT_ID is missing"; exit 1; }
          test -n "$GITHUB_TOKEN" || { echo "BUILDER_GITHUB_TOKEN is missing"; exit 1; }
          test -n "$GEMINI_API_KEY" || { echo "GEMINI_API_KEY is missing"; exit 1; }

      - name: Install runner
        working-directory: builder/runner
        run: npm install --no-audit --no-fund

      - name: Run one bounded batch
        working-directory: .
        run: node builder/runner/index.mjs

      - name: Upload runner report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-builder-${{ inputs.batch_id }}
          path: builder/reports/${{ inputs.batch_id }}.json
          if-no-files-found: ignore
