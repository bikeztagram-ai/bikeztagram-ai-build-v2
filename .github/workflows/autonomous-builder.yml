name: Autonomous Builder Batch

on:
  workflow_dispatch:
    inputs:
      run_duration:
        description: 'How long should AutoBot work this run?'
        required: true
        default: '1h'
        type: choice
        options: ['15m','30m','1h','2h','3h','4h','5h','6h','7h','8h','9h','10h','11h','12h']
      segment:
        description: 'Resume segment (1 or 2; use next segment after a 6h ceiling)'
        required: true
        default: '1'
        type: choice
        options: ['1','2']

concurrency:
  group: autonomous-builder-queue
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  run-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BUILDER_BASE_BRANCH: main
      BUILDER_MAX_UNITS: '100'
      BUILDER_PROTECTED_PATHS: .github/workflows/,builder/runner/,builder/quality/,builder/monitor/,builder/review/,config/autonomous-builder-queue.json,scripts/prepare-autonomous-batch.mjs
      LOCAL_AI_MODEL: qwen2.5-coder:3b
      OLLAMA_HOST: http://127.0.0.1:11434

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure requested run duration
        env:
          REQUESTED_DURATION: ${{ inputs.run_duration }}
          REQUESTED_SEGMENT: ${{ inputs.segment }}
        run: |
          set -euo pipefail
          node builder/runner/run-duration.mjs "$REQUESTED_DURATION" > /tmp/duration.json
          cat /tmp/duration.json
          minutes=$(sed -n 's/^AUTOBOT_SEGMENT_MINUTES=//p' /tmp/duration.json)
          segments=$(sed -n 's/^AUTOBOT_SEGMENTS=//p' /tmp/duration.json)
          segment=$(sed -n 's/^AUTOBOT_SEGMENT=//p' /tmp/duration.json)
          if [ "$segment" -gt "$segments" ]; then echo "Segment $segment is invalid for $REQUESTED_DURATION"; exit 1; fi
          echo "BUILDER_MAX_MINUTES=$minutes" >> "$GITHUB_ENV"
          echo "BUILDER_SEGMENTS=$segments" >> "$GITHUB_ENV"
          echo "BUILDER_SEGMENT=$segment" >> "$GITHUB_ENV"
          {
            echo '## 🤖 Autonomous Builder'
            echo "- **Requested runtime:** $REQUESTED_DURATION"
            echo "- **Segment:** $segment/$segments"
            echo "- **Execution budget:** $minutes minutes"
            echo '- **Mode:** deterministic + local Ollama product engineer'
            echo '- **AI provider:** local Ollama only; no Gemini/OpenAI dependency'
            echo '- **Merge:** never automatic'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Select next queued objective
        run: node scripts/prepare-autonomous-batch.mjs

      - name: Install and start local Ollama
        if: env.BUILDER_NO_WORK != 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS "$OLLAMA_HOST/api/tags" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS "$OLLAMA_HOST/api/tags" >/dev/null
          ollama pull "$LOCAL_AI_MODEL"
          echo 'LOCAL_AI_READY=1' >> "$GITHUB_ENV"
          echo "Local model ready: $LOCAL_AI_MODEL" >> "$GITHUB_STEP_SUMMARY"

      - name: Switch to durable builder branch
        if: env.BUILDER_NO_WORK != 'true'
        run: |
          set -euo pipefail
          branch="$BUILDER_WORKING_BRANCH"
          git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch" || true
          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            git checkout -B "$branch" "origin/$branch"
          else
            git checkout -B "$branch" "origin/$BUILDER_BASE_BRANCH"
          fi
          git status --short --branch

      - name: Validate selected task workers
        if: env.BUILDER_NO_WORK != 'true'
        run: node builder/runner/task-preflight.mjs

      - name: Validate builder contract
        if: env.BUILDER_NO_WORK != 'true'
        run: |
          set -euo pipefail
          node builder/quality/preflight.mjs
          node --check builder/runner/deterministic-executor.mjs
          node --check builder/runner/run-duration.mjs
          node --check builder/runner/task-preflight.mjs
          node --check builder/runner/long-run-executor.mjs
          node --check builder/runner/feature-brain.mjs
          node --check builder/runner/local-brain.mjs
          node --check builder/runner/self-repair.mjs
          node --check builder/quality/merge-readiness.mjs
          node --check scripts/prepare-autonomous-batch.mjs
          node --check builder/brain/builder-metrics.mjs
          node --check builder/brain/self-improvement-loop.mjs
          node --check builder/brain/self-improvement-experiment.mjs

      - name: Run sustained autonomous builder
        if: env.BUILDER_NO_WORK != 'true'
        run: |
          set -euo pipefail
          node builder/runner/long-run-executor.mjs

      - name: Analyse builder performance
        if: always() && env.BUILDER_NO_WORK != 'true'
        run: node builder/brain/builder-metrics.mjs

      - name: Analyse self-improvement opportunities
        if: always() && env.BUILDER_NO_WORK != 'true'
        run: |
          node builder/brain/self-improvement-loop.mjs
          node builder/brain/self-improvement-experiment.mjs

      - name: Publish checkpoint summary
        if: always() && env.BUILDER_NO_WORK != 'true'
        run: |
          state='builder/working/deterministic-autobot.json'
          {
            echo ''
            echo '### 📊 Latest checkpoint'
            if [ -f "$state" ]; then jq '{status,objectiveId,currentTask,completed,lastVerifiedTask,blockedTask,error,updatedAt}' "$state"; else echo 'Checkpoint not found.'; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run merge-readiness gate
        if: always() && env.BUILDER_NO_WORK != 'true'
        run: node builder/quality/merge-readiness.mjs

      - name: Commit and publish verified work
        if: success() && env.BUILDER_NO_WORK != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No repository changes to publish.'
            exit 0
          fi
          git config user.name 'Bikeztagram AutoBot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "builder: checkpoint ${BUILDER_BATCH_ID}"
          git push --set-upstream origin "$BUILDER_WORKING_BRANCH"
          gh pr create --base "$BUILDER_BASE_BRANCH" --head "$BUILDER_WORKING_BRANCH" --draft --title "AutoBot: ${BUILDER_BATCH_ID}" --body "Autonomous Builder checkpoint for ${BUILDER_BATCH_ID}. Quality gates and evidence are required before human review and merge."

      - name: Upload run state and review evidence
        if: always() && env.BUILDER_NO_WORK != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: autobot-run-${{ github.run_number }}-${{ env.BUILDER_BATCH_ID }}-segment-${{ inputs.segment }}
          path: |
            builder/working/deterministic-autobot.json
            builder/working/deterministic-autobot-evidence.json
            builder/working/feature-brain-state.json
            builder/reviews/merge-readiness.json
            builder/reviews/builder-metrics.json
            builder/reviews/self-improvement-proposal.json
            builder/reviews/self-improvement-experiment.json
          if-no-files-found: warn

      - name: Continue multi-segment run
        if: success() && env.BUILDER_NO_WORK != 'true' && env.BUILDER_SEGMENT < env.BUILDER_SEGMENTS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          next=$((BUILDER_SEGMENT + 1))
          gh workflow run autonomous-builder.yml --ref main -f run_duration='${{ inputs.run_duration }}' -f segment="$next"
          echo "Queued continuation segment $next/$BUILDER_SEGMENTS."

      - name: Report final state
        if: always()
        run: |
          {
            echo ''
            echo '## 🧾 Final state'
            echo "- **Workflow:** ${{ job.status }}"
            echo "- **Requested runtime:** ${{ inputs.run_duration }}"
            echo "- **Segment:** ${{ inputs.segment }}"
            echo "- **Batch:** ${BUILDER_BATCH_ID:-none}"
            echo "- **Branch:** ${BUILDER_WORKING_BRANCH:-none}"
            echo '- **Automatic merge:** ❌ Never'
            echo '- **Automatic production deployment:** ❌ Never'
          } >> "$GITHUB_STEP_SUMMARY"
