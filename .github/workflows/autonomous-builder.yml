name: Autonomous Builder Batch

on:
  workflow_dispatch:

concurrency:
  group: autonomous-builder-queue
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  run-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_3M95heKqbtDeI1h2dDKBWBtS
      VERCEL_PROJECT_ID: prj_75Uw3YoRkT5XOjXnSaVTnM2wHXte
      GITHUB_TOKEN: ${{ secrets.BUILDER_GITHUB_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BUILDER_REPO_URL: https://github.com/bikeztagram-ai/bikeztagram-ai-build-v2.git
      BUILDER_BASE_BRANCH: main
      BUILDER_MAX_MINUTES: "45"
      BUILDER_MAX_PASSES: "8"
      BUILDER_CODEX_CLI_VERSION: "0.148.0"
      BUILDER_AGENT_PROVIDER: openai-codex
      BUILDER_AGENT_MODEL: gpt-5.6-terra
      BUILDER_AGENT_CMD: '["sh","-lc","CODEX_API_KEY=\"$OPENAI_API_KEY\" exec npx --yes @openai/codex@0.148.0 exec --ephemeral --sandbox workspace-write --config sandbox_workspace_write.network_access=true \"$@\"","_"]'
      BUILDER_PROTECTED_PATHS: .github/workflows/,builder/runner/,builder/quality/,config/autonomous-builder-queue.json,scripts/prepare-autonomous-batch.mjs
      BUILDER_ACCEPTANCE: Runner configuration is explicit and bounded.;No automatic merge to main.;Build and relevant verification commands are required before review;The batch objective is loaded from the durable queue.;Do not modify .github/workflows/** or autonomous-runner infrastructure during product batches.;Preserve working contracts and improve existing implementation toward the end-game product quality bar.;Make substantive production-code improvements rather than only adding tests or documentation.;Run check-fix-check-continue verification across relevant existing contracts.;Read builder/quality/lessons.md and apply its durable lessons to the current batch.;Do not treat green tests as sufficient when the objective requires observable end-to-end behaviour.
      BUILDER_VERIFY_COMMANDS: npm run build,npm run verify:batch76,npm run verify:pro-song
    steps:
      - name: Checkout runner
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Select next queued batch
        working-directory: .
        run: node scripts/prepare-autonomous-batch.mjs

      - name: Show selected batch
        run: |
          echo "Selected batch: $BUILDER_BATCH_ID"
          echo "Working branch: $BUILDER_WORKING_BRANCH"
          echo "Resume existing builder work: $BUILDER_RESUME_EXISTING"
          echo "Objective loaded from durable queue:"
          printf '%s\n' "$BUILDER_OBJECTIVE"

      - name: Validate runner secrets
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN is missing"; exit 1; }
          test -n "$VERCEL_TEAM_ID" || { echo "VERCEL_TEAM_ID is missing"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "VERCEL_PROJECT_ID is missing"; exit 1; }
          test -n "$GITHUB_TOKEN" || { echo "BUILDER_GITHUB_TOKEN is missing"; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is missing for the Codex builder"; exit 1; }

      - name: Preflight OpenAI API authentication
        run: |
          set -euo pipefail
          http_code=$(curl -sS -o /tmp/openai-models.json -w '%{http_code}' \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            https://api.openai.com/v1/models)
          if [ "$http_code" != "200" ]; then
            echo "OpenAI API authentication preflight failed with HTTP $http_code."
            echo "The Codex worker will not be started until the API key is accepted."
            exit 1
          fi
          echo "OpenAI API authentication preflight: PASS"

      - name: Install runner
        working-directory: builder/runner
        run: npm install --no-audit --no-fund

      - name: Validate runner syntax
        run: |
          node --check builder/runner/task-driven.mjs
          node --check scripts/prepare-autonomous-batch.mjs

      - name: Preflight Codex execution adapter
        working-directory: .
        run: |
          npx --yes "@openai/codex@${BUILDER_CODEX_CLI_VERSION}" --version
          npx --yes "@openai/codex@${BUILDER_CODEX_CLI_VERSION}" exec --help >/dev/null

      - name: Run task-driven bounded batch
        working-directory: .
        env:
          GIT_SSL_NO_VERIFY: "1"
        run: node builder/runner/task-driven.mjs

      - name: Prepare builder branch for quality review
        working-directory: .
        run: |
          set -euo pipefail
          git fetch origin main "$BUILDER_WORKING_BRANCH"
          git checkout -B "$BUILDER_WORKING_BRANCH" "origin/$BUILDER_WORKING_BRANCH"

      - name: Deterministic production quality gate
        working-directory: .
        run: |
          set -euo pipefail
          echo "Checking committed builder diff against origin/main..."
          git diff --check "origin/main...HEAD"
          echo "Running production verification commands..."
          npm run build
          npm run verify:batch76
          npm run verify:pro-song
          echo "Deterministic production quality gate: PASS"

      - name: Create or confirm review PR
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing_pr=$(gh pr view "$BUILDER_WORKING_BRANCH" --repo "$GITHUB_REPOSITORY" --json number --jq '.number' 2>/dev/null || true)
          if [ -n "$existing_pr" ]; then
            echo "Review PR #$existing_pr already exists for $BUILDER_WORKING_BRANCH."
            exit 0
          fi
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BUILDER_WORKING_BRANCH" \
            --draft \
            --title "Autonomous Builder: $BUILDER_BATCH_ID" \
            --body "## Autonomous builder batch $BUILDER_BATCH_ID\n\nThis draft PR was created automatically after the bounded OpenAI Codex worker completed and the deterministic production quality gate passed.\n\n**Objective:**\n$BUILDER_OBJECTIVE\n\nOpenAI Codex is the primary engineering worker. GitHub Actions verification is the authoritative quality gate. No automatic merge or production deployment is performed. Review the generated changes and checks before merging."

      - name: Upload runner report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-builder-${{ env.BUILDER_BATCH_ID }}
          path: builder/reports/${{ env.BUILDER_BATCH_ID }}.json
          if-no-files-found: ignore

      - name: Upload checkpoint if present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-builder-checkpoint-${{ env.BUILDER_BATCH_ID }}
          path: builder/working/${{ env.BUILDER_BATCH_ID }}.md
          if-no-files-found: ignore
