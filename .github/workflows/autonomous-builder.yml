name: Autonomous Builder Batch

on:
  workflow_dispatch:
    inputs:
      batch_id:
        description: Batch identifier
        required: true
        default: batch-81
      objective:
        description: Objective for this batch
        required: true
        default: >-
          Advance Bikeztagram AI toward its end-game product by building the music/audio subsystem as a real production capability, not a mock. Inspect the existing musicProvider, director, renderer, App, and related code first. Implement the largest coherent safe batch covering an original/copyright-safe music source/generation abstraction, soundtrack selection, timeline-aware timing, beat/energy metadata, fades/ducking, integration with the director edit plan and final render pipeline, deterministic fallback when generation is unavailable, and appropriate UI/status handling and verification. Preserve the working signed Blob upload/read contract, Gemini/director pipeline, browser renderer, existing video generation, PWA behaviour, and production safety. Do not modify .github/workflows/** or autonomous-runner infrastructure in this product batch. No automatic merge or production deploy. Build and run all relevant verification checks before review.
      working_branch:
        description: Isolated branch to write to
        required: true
        default: autonomous-builder/batch-81

permissions:
  contents: write

jobs:
  run-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_3M95heKqbtDeI1h2dDKBWBtS
      VERCEL_PROJECT_ID: prj_75Uw3YoRkT5XOjXnSaVTnM2wHXte
      GITHUB_TOKEN: ${{ secrets.BUILDER_GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BUILDER_REPO_URL: https://github.com/bikeztagram-ai/bikeztagram-ai-build-v2.git
      BUILDER_BATCH_ID: ${{ inputs.batch_id }}
      BUILDER_WORKING_BRANCH: ${{ inputs.working_branch }}
      BUILDER_BASE_BRANCH: main
      BUILDER_MAX_MINUTES: "45"
      BUILDER_GEMINI_MODEL: gemini-3.5-flash-lite
      BUILDER_OBJECTIVE: ${{ inputs.objective }}
      BUILDER_ACCEPTANCE: Runner configuration is explicit and bounded.;No automatic merge to main.;Build and relevant verification commands are required before review.;Do not modify .github/workflows/** during product batches.
      BUILDER_VERIFY_COMMANDS: npm run build,npm run verify:batch76
    steps:
      - name: Checkout runner
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Validate runner secrets
        run: |
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN is missing"; exit 1; }
          test -n "$VERCEL_TEAM_ID" || { echo "VERCEL_TEAM_ID is missing"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "VERCEL_PROJECT_ID is missing"; exit 1; }
          test -n "$GITHUB_TOKEN" || { echo "BUILDER_GITHUB_TOKEN is missing"; exit 1; }
          test -n "$GEMINI_API_KEY" || { echo "GEMINI_API_KEY is missing"; exit 1; }

      - name: Install runner
        working-directory: builder/runner
        run: npm install --no-audit --no-fund

      - name: Run one bounded batch
        working-directory: .
        run: node builder/runner/index.mjs

      - name: Upload runner report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-builder-${{ inputs.batch_id }}
          path: builder/reports/${{ inputs.batch_id }}.json
          if-no-files-found: ignore
