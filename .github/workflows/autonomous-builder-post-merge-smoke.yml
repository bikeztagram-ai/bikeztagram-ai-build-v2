name: 🛡️ AutoBot Fleet 15m Test

# Single manual entry point for the first real fleet shakedown.
# This launcher deliberately invokes the PROVEN Builder workflow because
# its failure artifacts are wired to the controlled Repair → QA → Reviewer
# recovery workflow. Protected integration remains manual.

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: autobot-fleet-15m-test
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify fleet activation gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/contents/builder/brain/autobot-fleet.json?ref=main"
          registry="$(gh api "$api" --jq .content | base64 --decode)"
          node -e '
            const r=JSON.parse(process.argv[1]);
            if(r.status!=="fifteen-minute-live-test" || r.enabled!==true || r.coordination?.mode!=="active" || r.activationGate?.testDuration!=="15m" || r.activationGate?.protectedIntegration!==false) {
              console.error("Fleet 15m activation gate is not in the exact expected live-test state.");
              process.exit(1);
            }
            console.log("Fleet 15m activation gate PASS: live test enabled, protected integration disabled.");
          ' "$registry"

      - name: Refuse duplicate Builder or recovery runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          builder=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow 'autonomous-builder-v2-fast.yml' --status in_progress --json databaseId --jq 'length')
          builder_q=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow 'autonomous-builder-v2-fast.yml' --status queued --json databaseId --jq 'length')
          recovery=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow 'autobot-fleet-recovery.yml' --status in_progress --json databaseId --jq 'length')
          recovery_q=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow 'autobot-fleet-recovery.yml' --status queued --json databaseId --jq 'length')
          if [ "$builder" -gt 0 ] || [ "$builder_q" -gt 0 ] || [ "$recovery" -gt 0 ] || [ "$recovery_q" -gt 0 ]; then
            echo 'An active Builder or fleet recovery run already exists; refusing duplicate fleet test.'
            exit 1
          fi

      - name: Dispatch exactly 15-minute PROVEN Builder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run autonomous-builder-v2-fast.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f duration='15m' \
            -f max_units='1000' \
            -f local_model='qwen2.5-coder:7b'
          echo 'Dispatched the PROVEN Builder with a hard 15-minute fleet-test budget.'
