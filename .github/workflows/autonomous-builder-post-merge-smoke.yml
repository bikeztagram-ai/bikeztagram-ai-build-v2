name: AutoBot Manual Smoke

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Bounded AutoBot smoke duration'
        required: false
        default: '15m'
        type: choice
        options: ['15m','30m']
      max_units:
        description: 'Safety ceiling on verified implementation units'
        required: false
        default: '1000'
        type: string
      local_model:
        description: 'Open-source local coding model'
        required: false
        default: 'qwen2.5-coder:7b'
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: autobot-manual-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch canonical bounded AutoBot run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow autonomous-builder-v2-fast.yml --status in_progress --json databaseId --jq 'length')
          queued=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow autonomous-builder-v2-fast.yml --status queued --json databaseId --jq 'length')
          if [ "$active" -gt 0 ] || [ "$queued" -gt 0 ]; then
            echo 'Canonical AutoBot already has a queued/running run; refusing duplicate dispatch.'
            exit 1
          fi
          gh workflow run autonomous-builder-v2-fast.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f duration="${{ inputs.duration }}" \
            -f max_units="${{ inputs.max_units }}" \
            -f local_model="${{ inputs.local_model }}"
          echo "Dispatched explicit ${{ inputs.duration }} canonical AutoBot smoke using ${{ inputs.local_model }}."
