name: 🛡️ AutoBot Fleet Controlled Test

# Single manual entry point for controlled real-fleet shakedowns.
# This launcher invokes the PROVEN Builder because its failure artifacts are
# wired to the controlled Repair → QA → Reviewer recovery workflow.
# Protected integration remains manual and disabled.

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Controlled fleet-test duration'
        required: true
        default: '30m'
        type: choice
        options: ['15m','30m']

permissions:
  actions: write
  contents: read

concurrency:
  group: autobot-fleet-controlled-test
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify fleet activation gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/contents/builder/brain/autobot-fleet.json?ref=main"
          registry="$(gh api "$api" --jq .content | base64 --decode)"
          node -e '
            const r=JSON.parse(process.argv[1]);
            const requested=process.argv[2];
            if(r.enabled!==true || r.coordination?.mode!=="active" || r.activationGate?.protectedIntegration!==false || !Array.isArray(r.activationGate?.allowedTestDurations) || !r.activationGate.allowedTestDurations.includes(requested)) {
              console.error(`Fleet controlled-test gate rejected ${requested}.`);
              process.exit(1);
            }
            console.log(`Fleet controlled-test gate PASS: ${requested} authorized, protected integration disabled.`);
          ' "$registry" '${{ inputs.duration }}'

      - name: Refuse duplicate Builder or recovery runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          builder=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow 'autonomous-builder-v2-fast.yml' --status in_progress --json databaseId --jq 'length')
          builder_q=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow 'autonomous-builder-v2-fast.yml' --status queued --json databaseId --jq 'length')
          recovery=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow 'autobot-fleet-recovery.yml' --status in_progress --json databaseId --jq 'length')
          recovery_q=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow 'autobot-fleet-recovery.yml' --status queued --json databaseId --jq 'length')
          if [ "$builder" -gt 0 ] || [ "$builder_q" -gt 0 ] || [ "$recovery" -gt 0 ] || [ "$recovery_q" -gt 0 ]; then
            echo 'An active Builder or fleet recovery run already exists; refusing duplicate fleet test.'
            exit 1
          fi

      - name: Dispatch authorized PROVEN Builder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run autonomous-builder-v2-fast.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f duration='${{ inputs.duration }}' \
            -f max_units='1000' \
            -f local_model='qwen2.5-coder:7b'
          echo "Dispatched the PROVEN Builder with the authorized ${{ inputs.duration }} controlled fleet-test budget."
