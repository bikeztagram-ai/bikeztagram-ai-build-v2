name: 🚀 AUTOBOT FLEET — RUN THIS

# Stable user-facing launcher. The proven fleet is called as a reusable workflow,
# avoiding a second API dispatch/registration dependency.

on:
  workflow_dispatch:
    inputs:
      duration:
        description: Controlled parallel AutoBot budget
        required: true
        default: 15m
        type: choice
        options: ['15m','30m','1h','2h','3h','4h','5h','6h']
      local_model:
        description: Proven local coding model
        required: false
        default: qwen2.5-coder:7b
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  fleet:
    name: 🚀 Run proven two-worker AutoBot fleet
    uses: ./.github/workflows/bikeztagram-proven-autobot-fleet.yml
    with:
      duration: ${{ inputs.duration }}
      local_model: ${{ inputs.local_model }}
