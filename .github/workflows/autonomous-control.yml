name: Bikeztagram Autonomous Control Plane

on:
  push:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      actions:
        description: 'Number of guarded improvements to attempt'
        required: false
        default: '1'
        type: string

concurrency:
  group: bikeztagram-autonomous-control
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  deployments: read

jobs:
  autonomous-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEV_BRANCH: ai-director-two-stage
      MAX_ACTIONS: ${{ inputs.actions || '1' }}
      VERCEL_STABLE_URL: https://bikeztagram-ai-build-v2-3hkw.vercel.app
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v6
        with:
          ref: ai-director-two-stage
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify autonomous secrets are available
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY" || { echo 'Missing GEMINI_API_KEY repository secret.'; exit 1; }
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET" || { echo 'Missing VERCEL_AUTOMATION_BYPASS_SECRET repository secret.'; exit 1; }
          echo 'Required autonomous secrets are configured.'

      - name: Install dependencies
        run: npm install

      - name: Prepare deterministic test fixture
        run: |
          set -euo pipefail
          mkdir -p tests/fixtures
          curl -L --fail --retry 3 --retry-delay 2 \
            -o tests/fixtures/sample-5mb.mp4 \
            https://cdn.truefilesize.com/mp4/sample-5mb.mp4
          file tests/fixtures/sample-5mb.mp4

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Discover latest Vercel preview for tested commit
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checked_sha=$(git rev-parse HEAD)
          echo "Testing development commit $checked_sha"
          for attempt in $(seq 1 6); do
            deployments=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments?sha=${checked_sha}&per_page=20")
            deployment_id=$(echo "$deployments" | jq -r 'map(select(.environment != null and (.environment | test("preview|Preview")))) | sort_by(.created_at) | last | .id // empty')
            if [ -n "$deployment_id" ]; then
              statuses=$(curl -fsSL \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses")
              state=$(echo "$statuses" | jq -r '.[0].state // empty')
              url=$(echo "$statuses" | jq -r '.[0].environment_url // empty')
              echo "Deployment $deployment_id state=$state url=$url"
              if [ "$state" = "success" ] && [ -n "$url" ]; then
                echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
                echo "test_url=$url" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
                echo "Vercel deployment failed; using stable project URL for diagnostics."
                break
              fi
            fi
            sleep 5
          done
          echo "No usable GitHub deployment record for $checked_sha; using stable Vercel project URL: $VERCEL_STABLE_URL"
          echo "deployment_id=" >> "$GITHUB_OUTPUT"
          echo "test_url=$VERCEL_STABLE_URL" >> "$GITHUB_OUTPUT"

      - name: Run real deployed render QA
        id: smoke
        continue-on-error: true
        env:
          TEST_URL: ${{ steps.deployment.outputs.test_url }}
          TEST_VIDEO: tests/fixtures/sample-5mb.mp4
          TEST_TIMEOUT_MS: 900000
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node tests/autonomous-smoke.mjs

      - name: Upload render failure evidence
        if: steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-render-evidence
          path: autotest-failure.png
          if-no-files-found: ignore

      - name: Run one guarded AI engineering improvement
        id: improver
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ai-director-two-stage
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          MAX_AUTO_ITERATIONS: 1
          AUTO_ITERATION: 0
          AUTO_REMAINING_ACTIONS: ${{ env.MAX_ACTIONS }}
        run: node scripts/autonomous-improver.mjs

      - name: Write cycle evidence ledger
        if: always()
        run: |
          set -euo pipefail
          mkdir -p autonomous-ledger
          cat > autonomous-ledger/cycle-${GITHUB_RUN_ID}.json <<EOF
          {
            "runId": "${GITHUB_RUN_ID}",
            "trigger": "${GITHUB_EVENT_NAME}",
            "testedBranch": "${DEV_BRANCH}",
            "testedCommit": "$(git rev-parse HEAD)",
            "deploymentId": "${{ steps.deployment.outputs.deployment_id }}",
            "deploymentUrl": "${{ steps.deployment.outputs.test_url }}",
            "renderQa": "${{ steps.smoke.outcome }}",
            "improvement": "${{ steps.improver.outcome }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload cycle evidence ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-cycle-ledger-${{ github.run_id }}
          path: autonomous-ledger/cycle-${{ github.run_id }}.json
          retention-days: 30

      - name: Report cycle outcome
        if: always()
        run: |
          echo "Autonomous control-plane cycle complete."
          echo "Render QA: ${{ steps.smoke.outcome }}"
          echo "AI improvement: ${{ steps.improver.outcome }}"
          echo "The next scheduled cycle will re-evaluate the latest development commit."
