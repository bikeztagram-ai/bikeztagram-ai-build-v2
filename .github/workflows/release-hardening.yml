name: Bikeztagram Release Hardening

on:
  push:
    branches: [dev/release-hardening-pass]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build
      - name: Release hardening gate
        run: npm run verify:release-hardening
