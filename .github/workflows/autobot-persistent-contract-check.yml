name: AutoBot Isolated Specialist Contract Check

on:
  pull_request:
    paths:
      - '.github/workflows/autobot-parallel-specialists.yml'
      - 'builder/runner/autobot-specialist-builder.mjs'
      - 'builder/runner/autobot-specialist-recovery.mjs'
      - 'builder/runner/autobot-endurance-candidate-check.mjs'
      - 'builder/runner/autobot-specialist-handoff.mjs'
      - 'builder/runner/autobot-parallel-planner.mjs'
      - 'builder/runner/autobot-fleet-recovery.mjs'
      - 'builder/runner/autobot-failure-queue.mjs'
      - 'builder/runner/autobot-repair.mjs'
      - 'builder/runner/autobot-qa.mjs'
      - 'builder/runner/autobot-reviewer.mjs'
      - 'builder/runner/autobot-rnd.mjs'
      - 'scripts/autobot/verify-autobot-product-change-quality.mjs'
      - 'scripts/autobot/verify-autobot-rnd.mjs'
      - 'builder/runner/autobot-independent-fan-in.mjs'
      - 'builder/runner/autobot-specialist-deterministic-fallback.mjs'
      - 'builder/runner/autobot-independent-specialist-lane.mjs'
      - 'builder/brain/autobot-fleet.json'
      - 'builder/brain/autobot-independent-worker-contract.json'
      - 'builder/runner/autobot-evolution-engineer.mjs'
      - 'scripts/autobot/verify-independent-worker-contract.mjs'
      - 'scripts/autobot/verify-autobot-parallel-fleet.mjs'
      - 'scripts/autobot/verify-autobot-fleet-foundation.mjs'
      - 'scripts/autobot/verify-autobot-evolution-engineer.mjs'
      - 'package.json'
  push:
    branches:
      - 'autobot/persistent-cycle-engine'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --no-package-lock
      - name: Parse AutoBot JavaScript
        run: |
          set -euo pipefail
          for f in             builder/runner/autobot-specialist-builder.mjs             builder/runner/autobot-specialist-recovery.mjs             builder/runner/autobot-endurance-candidate-check.mjs             builder/runner/autobot-specialist-handoff.mjs             builder/runner/autobot-parallel-planner.mjs             builder/runner/autobot-fleet-recovery.mjs             builder/runner/autobot-failure-queue.mjs             builder/runner/autobot-repair.mjs             builder/runner/autobot-qa.mjs             builder/runner/autobot-reviewer.mjs             builder/runner/autobot-rnd.mjs             scripts/autobot/verify-autobot-product-change-quality.mjs             scripts/autobot/verify-autobot-rnd.mjs             builder/runner/autobot-independent-fan-in.mjs             builder/runner/autobot-specialist-deterministic-fallback.mjs             builder/runner/autobot-independent-specialist-lane.mjs             builder/runner/autobot-evolution-engineer.mjs             scripts/autobot/verify-independent-worker-contract.mjs             scripts/autobot/verify-autobot-parallel-fleet.mjs             scripts/autobot/verify-autobot-fleet-foundation.mjs             scripts/autobot/verify-autobot-evolution-engineer.mjs; do
            node --check "$f"
          done
      - name: Run deep R&D audit
        run: npm run verify:autobot-rnd
      - name: Run isolated worker contract audit
        run: npm run verify:autobot-independent-workers
      - name: Run ten-lane fleet audit
        run: node scripts/autobot/verify-autobot-parallel-fleet.mjs
      - name: Run fleet foundation audit
        run: npm run verify:autobot-fleet-foundation
      - name: Run Evolution Engineer audit
        run: npm run verify:autobot-evolution-engineer
