name: Bikeztagram Universal Generation V1
on:
  push:
    branches: [parallel/batch-37-universal-generation-schema]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/verify-universal-generation-schema-v1.mjs
