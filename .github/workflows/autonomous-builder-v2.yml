name: Autonomous Builder V2 (Local Brain)

on:
  workflow_dispatch:
    inputs:
      max_units:
        description: 'Safety ceiling on verified implementation units; duration remains the primary work budget'
        required: false
        default: '1000'
        type: string
      duration:
        description: 'Shared work time budget: 15m, 30m, or 1h-12h'
        required: false
        default: '1h'
        type: choice
        options: ['15m','30m','1h','2h','3h','4h','5h','6h','7h','8h','9h','10h','11h','12h']
      local_model:
        description: 'Open-source local coding model (no paid API)'
        required: false
        default: 'qwen2.5-coder:3b'
        type: string

concurrency:
  group: autonomous-builder-v2-local
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  BUILDER_MAX_UNITS: ${{ inputs.max_units }}
  REQUESTED_DURATION: ${{ inputs.duration }}
  LOCAL_AI_MODEL: ${{ inputs.local_model }}
  BUILDER_BASE_BRANCH: main

jobs:
  segment-1:
    runs-on: ubuntu-latest
    timeout-minutes: 370
    outputs:
      branch: ${{ steps.publish.outputs.branch }}
      requested_minutes: ${{ steps.budget.outputs.requested_minutes }}
      remaining_minutes: ${{ steps.budget.outputs.remaining_minutes }}
      segments: ${{ steps.budget.outputs.segments }}
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify checkout revision
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          echo "Workflow SHA: $GITHUB_SHA"
          echo "Checked out SHA: $actual"
          test "$actual" = "$GITHUB_SHA"
          grep -q "completedObjectives" builder/runner/long-run-executor.mjs
          grep -q "totalUnits+=verifiedThisRun.length" builder/runner/long-run-executor.mjs
          grep -q "verifiedThisRun.length===0" builder/runner/long-run-executor.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Cache local AI model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: bikeztagram-local-ai-${{ runner.os }}-${{ inputs.local_model }}
      - name: Start local AI brain
        env:
          LOCAL_AI_MODEL: ${{ inputs.local_model }}
        run: bash scripts/autobot/install-local-brain.sh
      - name: Resolve shared time budget
        id: budget
        run: |
          case "$REQUESTED_DURATION" in
            15m) requested=15;; 30m) requested=30;;
            1h) requested=60;; 2h) requested=120;; 3h) requested=180;;
            4h) requested=240;; 5h) requested=300;; 6h) requested=360;;
            7h) requested=420;; 8h) requested=480;; 9h) requested=540;;
            10h) requested=600;; 11h) requested=660;; 12h) requested=720;;
            *) echo "Unsupported duration: $REQUESTED_DURATION"; exit 1;;
          esac
          segments=$(( (requested + 359) / 360 ))
          first=$(( requested < 360 ? requested : 360 ))
          remaining=$(( requested > 360 ? requested - 360 : 0 ))
          echo "requested_minutes=$requested" >> "$GITHUB_OUTPUT"
          echo "remaining_minutes=$remaining" >> "$GITHUB_OUTPUT"
          echo "segments=$segments" >> "$GITHUB_OUTPUT"
          echo "BUILDER_MAX_MINUTES=$first" >> "$GITHUB_ENV"
          echo "BUILDER_SEGMENT=1" >> "$GITHUB_ENV"
          echo "BUILDER_SEGMENTS=$segments" >> "$GITHUB_ENV"
          node builder/runner/run-duration.mjs
          node builder/runner/segment-plan.mjs
      - name: Validate autonomous builder
        run: |
          node --check builder/runner/deterministic-executor.mjs
          node --check builder/runner/long-run-executor.mjs
          node --check builder/runner/local-brain.mjs
          node scripts/autobot/verify-deterministic-executor.mjs
          node builder/quality/autobot-ready.mjs
      - name: Run sustained deterministic builder and local AI brain
        run: node builder/runner/long-run-executor.mjs
      - name: Production verification
        if: success()
        run: |
          npm run build
          npm run verify:project-memory
      - name: Persist continuation state
        if: always()
        run: node builder/runner/segment-state.mjs
      - name: Publish segment 1 checkpoint
        id: publish
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="autonomous-builder-v2/${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git config user.name 'Bikeztagram Autonomous Builder V2'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: autonomous builder local brain segment 1 checkpoint' || true
          git push --set-upstream origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

  segment-2:
    needs: segment-1
    if: needs.segment-1.outputs.segments >= 2
    runs-on: ubuntu-latest
    timeout-minutes: 370
    env:
      BUILDER_MAX_MINUTES: ${{ needs.segment-1.outputs.remaining_minutes }}
      BUILDER_MAX_UNITS: ${{ inputs.max_units }}
      BUILDER_SEGMENT: 2
      BUILDER_SEGMENTS: ${{ needs.segment-1.outputs.segments }}
      LOCAL_AI_MODEL: ${{ inputs.local_model }}
    steps:
      - name: Checkout segment 1 branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.segment-1.outputs.branch }}
          fetch-depth: 0
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Cache local AI model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: bikeztagram-local-ai-${{ runner.os }}-${{ inputs.local_model }}
      - name: Start local AI brain
        env:
          LOCAL_AI_MODEL: ${{ inputs.local_model }}
        run: bash scripts/autobot/install-local-brain.sh
      - name: Validate autonomous builder
        run: |
          node --check builder/runner/deterministic-executor.mjs
          node --check builder/runner/long-run-executor.mjs
          node --check builder/runner/local-brain.mjs
          node scripts/autobot/verify-deterministic-executor.mjs
          node builder/quality/autobot-ready.mjs
      - name: Resume sustained deterministic builder and local AI brain
        run: node builder/runner/long-run-executor.mjs
      - name: Production verification
        if: success()
        run: |
          npm run build
          npm run verify:project-memory
      - name: Persist final continuation state
        if: always()
        run: node builder/runner/segment-state.mjs
      - name: Publish final segment and review PR
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'Bikeztagram Autonomous Builder V2'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: autonomous builder local brain final segment' || true
          git push
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "${{ needs.segment-1.outputs.branch }}" --draft --title 'Autonomous Builder V2 local brain progress' --body 'Autonomous product build using a local open-source coding model. No Gemini or OpenAI API is used. Review checkpoint and verification required before merging. No automatic merge or production deployment.' || true

  review-single-segment:
    needs: segment-1
    if: needs.segment-1.outputs.segments == '1'
    runs-on: ubuntu-latest
    steps:
      - name: Create review PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "${{ needs.segment-1.outputs.branch }}" --draft --title 'Autonomous Builder V2 local brain progress' --body 'Autonomous product build using a local open-source coding model. No Gemini or OpenAI API is used. Review checkpoint and verification required before merging. No automatic merge or production deployment.' || true
