name: Autonomous Builder V2 (Gemini-free)

on:
  workflow_dispatch:
    inputs:
      max_units:
        description: 'Maximum verified implementation units for this run'
        required: false
        default: '20'
        type: string
      duration:
        description: 'Run duration: 15m, 30m, or 1h-12h'
        required: false
        default: '4h'
        type: choice
        options: ['15m','30m','1h','2h','3h','4h','5h','6h','7h','8h','9h','10h','11h','12h']

concurrency:
  group: autonomous-builder-v2
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  BUILDER_MAX_UNITS: ${{ inputs.max_units }}
  REQUESTED_DURATION: ${{ inputs.duration }}
  BUILDER_BASE_BRANCH: main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 370
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Resolve run budget
        id: budget
        run: |
          node builder/runner/run-duration.mjs
          node builder/runner/segment-plan.mjs
          echo "segment=${AUTOBOT_SEGMENT:-1}" >> "$GITHUB_OUTPUT"
          echo "segments=${AUTOBOT_SEGMENTS:-1}" >> "$GITHUB_OUTPUT"

      - name: Validate deterministic builder
        run: |
          node --check builder/runner/deterministic-executor.mjs
          node scripts/autobot/verify-deterministic-executor.mjs
          node builder/quality/autobot-ready.mjs

      - name: Run deterministic builder
        run: node builder/runner/deterministic-executor.mjs

      - name: Production verification
        if: success()
        run: |
          npm run build
          npm run verify:project-memory

      - name: Persist continuation state
        if: always()
        env:
          BUILDER_SEGMENT: ${{ steps.budget.outputs.segment }}
          BUILDER_SEGMENTS: ${{ steps.budget.outputs.segments }}
        run: node builder/runner/segment-state.mjs

      - name: Publish verified work for human review
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No publishable changes.'
            exit 0
          fi
          branch="autonomous-builder-v2/${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git config user.name 'Bikeztagram Autonomous Builder V2'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: autonomous builder v2 progress'
          git push --set-upstream origin "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --draft --title 'Autonomous Builder V2 progress' --body 'Gemini-free deterministic builder run. Review checkpoint, evidence and verification before merging. No automatic merge or production deployment.'
