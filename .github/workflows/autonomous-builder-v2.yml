name: Autonomous Builder V2 (Gemini-free)

on:
  workflow_dispatch:
    inputs:
      max_units:
        description: 'Maximum verified implementation units for this run'
        required: false
        default: '20'
        type: string
      max_minutes:
        description: 'Requested run duration in minutes (15-720)'
        required: false
        default: '240'
        type: string

concurrency:
  group: autonomous-builder-v2
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 370
    env:
      BUILDER_MAX_UNITS: ${{ inputs.max_units }}
      BUILDER_MAX_MINUTES: ${{ inputs.max_minutes }}
      REQUESTED_MINUTES: ${{ inputs.max_minutes }}
      BUILDER_BASE_BRANCH: main
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Validate duration and deterministic builder
        run: |
          node builder/runner/run-duration.mjs
          node builder/runner/segment-plan.mjs
          node --check builder/runner/deterministic-executor.mjs
          node scripts/autobot/verify-deterministic-executor.mjs
          node builder/quality/autobot-ready.mjs

      - name: Run long-lived deterministic builder
        run: node builder/runner/deterministic-executor.mjs

      - name: Production verification
        if: success()
        run: |
          npm run build
          npm run verify:project-memory

      - name: Persist segment state and show checkpoint
        if: always()
        run: |
          node builder/runner/segment-state.mjs
          if [ -f builder/working/deterministic-autobot.json ]; then cat builder/working/deterministic-autobot.json; fi
          if [ -f builder/working/segment-state.json ]; then cat builder/working/segment-state.json; fi

      - name: Create review PR when changes exist
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No working-tree changes; builder produced no publishable changes.'
            exit 0
          fi
          branch="autonomous-builder-v2/${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git config user.name 'Bikeztagram Autonomous Builder V2'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: autonomous builder v2 progress'
          git push --set-upstream origin "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --draft --title 'Autonomous Builder V2 progress' --body 'Gemini-free deterministic builder run. Review checkpoint, evidence and verification before merging. No automatic merge or production deployment.'
