name: Autonomous Builder V2 Fast Brain v2

on:
  workflow_dispatch:
    inputs:
      max_units:
        description: 'Safety ceiling on verified deterministic units'
        required: false
        default: '1000'
        type: string
      duration:
        description: 'Shared work time budget'
        required: false
        default: '15m'
        type: choice
        options: ['15m','30m','1h','2h','3h','4h','5h','6h']
      local_model:
        description: 'Local coding model'
        required: false
        default: 'qwen3:4b-instruct-2507-q4_K_M'
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bikeztagram-autonomous-builder-v2-fast-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fast-brain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install
        run: npm ci

      - name: Cache local AI model
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-qwen3-4b-instruct-2507-${{ runner.os }}

      - name: Install local AI brain
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 2; done
          ollama pull "${{ inputs.local_model || 'qwen3:4b-instruct-2507-q4_K_M' }}"

      - name: Start performance proxy
        run: |
          node builder/runner/performance-proxy.mjs >/tmp/performance-proxy.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11435/health >/dev/null && break; sleep 1; done
        env:
          OLLAMA_HOST: http://127.0.0.1:11435
          AUTOBOT_MAX_ATTEMPTS: '1'
          AUTOBOT_MAX_EDITS: '2'
          AUTOBOT_MAX_TURNS: '1'
          AUTOBOT_CONTEXT_TOKENS: '8192'
          AUTOBOT_MAX_OUTPUT_TOKENS: '420'
          AUTOBOT_THINK: 'false'
          AUTOBOT_FEATURE_TIMEOUT_SECONDS: '180'

      - name: Resolve duration
        id: duration
        run: echo "value=${{ inputs.duration || '15m' }}" >> "$GITHUB_OUTPUT"

      - name: Validate autonomous builder
        run: |
          node --check builder/runner/repository-aware-fast-executor.mjs
          node --check builder/runner/repository-aware-fast-brain.mjs
          node --check builder/runner/repository-aware-executor.mjs
          node --check builder/runner/performance-proxy.mjs
          npm run verify:autobot-safety-contract
          npm run verify:autobot-safety-contract-v2
          npm run verify:autobot-safety-contract-v3
          npm run verify:autobot-continuous-loop
          npm run verify:autobot-feature-edit-protocol
          npm run verify:autobot-objective-dependencies
          npm run verify:autobot-feature-brain-resilience
          npm run verify:autobot-ready

      - name: Run repository-aware sustained builder
        run: node builder/runner/repository-aware-fast-executor.mjs
        env:
          AUTOBOT_MAX_UNITS: '${{ inputs.max_units || '1000' }}'
          AUTOBOT_DURATION: '${{ steps.duration.outputs.value }}'
          AUTOBOT_LOCAL_MODEL: '${{ inputs.local_model || 'qwen3:4b-instruct-2507-q4_K_M' }}'
          AUTOBOT_MAX_EDITS: '2'
          AUTOBOT_MAX_TURNS: '1'
          AUTOBOT_MAX_ATTEMPTS: '1'
          AUTOBOT_FEATURE_PASSES: '1'
          AUTOBOT_FEATURE_TIMEOUT_SECONDS: '180'
          OLLAMA_HOST: http://127.0.0.1:11435

      - name: Production verification
        run: |
          npm run verify:autobot-production-gate
          npm run verify:project-memory
          npm run verify:autobot-continuous-loop
          npm run verify:autobot-dependencies

      - name: Require a real product-source change
        run: |
          if ! git diff --quiet -- src public; then
            echo 'Verified real product-source change present.'
          else
            echo 'No real product-source change produced by this run.'
            exit 1
          fi

      - name: Persist continuation state
        if: always()
        run: node builder/monitor/persist-continuation-state.mjs || true

      - name: Publish checkpoint
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          SOURCE_SHA="$(git rev-parse HEAD)"
          git fetch origin main --no-tags
          git checkout --detach origin/main
          git checkout "$SOURCE_SHA" -- src public package.json package-lock.json vite.config.js vercel.json 2>/dev/null || true
          git checkout origin/main -- .github/workflows
          git reset -- builder/working || true
          rm -rf builder/working
          git add -A
          git commit -m "chore(autobot): publish verified product checkpoint" || true
          BRANCH="autonomous-builder-v2-fast/${GITHUB_RUN_ID}"
          git push origin HEAD:"$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "Autonomous Builder V2 Fast Brain checkpoint #${GITHUB_RUN_NUMBER}" --body "Automated verified product checkpoint from the Qwen Fast Brain v2 run." --draft || true

      - name: Post Cache local AI model
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ollama
          key: ollama-qwen3-4b-instruct-2507-${{ runner.os }}-${{ github.run_id }}

      - name: Post Checkout exact workflow revision
        if: always()
        run: git status --short || true

      - name: Complete
        if: always()
        run: echo "Autonomous Builder V2 Fast Brain v2 complete."
