name: FORGE — MiniMax Music E2E Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/forge-minimax-e2e-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Start real production MiniMax generation
        id: start
        shell: bash
        run: |
          set -euo pipefail
          PROMPT='Create a polished upbeat electronic dance-pop song called "Ride Into The Night". Theme: freedom, night riding, escaping the city, open roads, neon lights, cold night air, adrenaline and feeling alive. Use a powerful four-on-the-floor beat, driving bass, bright synths, atmospheric pads and a huge memorable chorus. Natural sung lead vocal with backing harmonies. Make it a genuine finished song, not background soundtrack. Lyrics should directly mention the motorcycle, twisting the throttle, chasing the horizon, neon lights, cold night air, freedom and refusing to slow down.'
          BODY="$(python -c 'import json,sys; print(json.dumps({"prompt":sys.argv[1],"lyrics":"","duration":30,"vocalLanguage":"en","forceInstrumental":False,"bpm":"auto","key":"auto","mode":"auto"}))' "$PROMPT")"
          for attempt in $(seq 1 20); do
            RESPONSE="$(curl --silent --show-error --request POST --header 'Content-Type: application/json' --data "$BODY" https://bikeztagram-ai-build-v2.vercel.app/api/music-engine || true)"
            echo "START $attempt/20 — $RESPONSE"
            if echo "$RESPONSE" | grep -q '"jobId"'; then
              JOB_ID="$(echo "$RESPONSE" | python -c 'import json,sys; print(json.load(sys.stdin)["jobId"])')"
              echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "Could not start production Music Engine."
          exit 1

      - name: Poll until audio is actually retrievable
        shell: bash
        env:
          JOB_ID: ${{ steps.start.outputs.job_id }}
        run: |
          set -euo pipefail
          URL="https://bikeztagram-ai-build-v2.vercel.app/api/music-engine?jobId=${JOB_ID}"
          for attempt in $(seq 1 540); do
            RESPONSE="$(curl --silent --show-error "$URL" || true)"
            echo "POLL $attempt/540 — $RESPONSE"
            if echo "$RESPONSE" | grep -q '"status":"COMPLETED"'; then
              AUDIO_URL="$(echo "$RESPONSE" | python -c 'import json,sys; print(json.load(sys.stdin).get("audioUrl",""))')"
              test -n "$AUDIO_URL"
              curl --silent --show-error --fail --output /tmp/final.wav "$AUDIO_URL"
              test -s /tmp/final.wav
              echo "E2E AUDIO RETRIEVAL PASS — $(stat -c%s /tmp/final.wav) bytes"
              exit 0
            fi
            if echo "$RESPONSE" | grep -q '"status":"FAILED"'; then echo "Production Music Engine reported FAILED."; exit 1; fi
            sleep 10
          done
          echo "Timed out waiting for real audio."
          exit 1
