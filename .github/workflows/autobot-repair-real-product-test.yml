name: 🧪 BIKEZTAGRAM AUTOBOT — REAL PRODUCT REPAIR PROOF

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-product-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repair pipeline branch
        uses: actions/checkout@v5
        with:
          ref: autobot/repair-pipeline-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install repository dependencies and Aider
        run: |
          npm install --no-audit --no-fund --no-package-lock
          python -m pip install --disable-pip-version-check --no-input aider-chat

      - name: Install Ollama
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: Start local coding model
        shell: bash
        env:
          MODEL: qwen2.5-coder:7b
        run: |
          set -euo pipefail
          nohup ollama serve >/tmp/autobot-ollama.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 2
          done
          ollama pull "$MODEL"
          ollama run "$MODEL" 'Reply with exactly READY.' | tee /tmp/autobot-model-ready.txt
          grep -q READY /tmp/autobot-model-ready.txt

      - name: Establish deliberate Builder product candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Bikeztagram AutoBot Repair Proof'
          git config user.email 'autobot-repair-proof@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          p = Path('src/aiEditPlanner.js')
          text = p.read_text()
          good = 'function clamp(value,min,max){return Math.max(min,Math.min(max,value));}'
          bad = 'function clamp(value,min,max){return Math.max(min,Math.max(max,value));}'
          if good not in text:
              raise SystemExit('Expected protected baseline clamp implementation was not found')
          p.write_text(text.replace(good, bad, 1))
          PY
          git diff --check
          git diff -- src/aiEditPlanner.js
          git add src/aiEditPlanner.js
          git commit -m 'test(autobot): create deliberate product candidate defect'
          echo "AUTOBOT_TEST_BASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Record real product failure in durable queue
        shell: bash
        run: |
          set -euo pipefail
          node builder/runner/autobot-failure-queue.mjs append '{"source":"builder-candidate-repair-proof","stage":"product-verification","error":"aiEditPlanner clamp regression: upper-bound clamping is incorrect","expected":"clamp(value,min,max) returns a value no greater than max","actual":"implementation uses Math.max(max,value), so values above max are not clamped","files":["src/aiEditPlanner.js"],"evidence":["deliberate product candidate regression created in isolated workflow checkout"],"attempted":["Builder candidate captured as a committed product change for this controlled proof"],"retryable":true,"repairHint":"Restore the clamp helper so values are constrained to the inclusive min/max range. Do not alter unrelated product logic."}' | tee builder/working/repair-proof-failure.json
          test -s builder/working/autobot-failure-queue.jsonl

      - name: Run the actual Repair Bot
        shell: bash
        env:
          AUTOBOT_AIDER_MODEL: ollama_chat/qwen2.5-coder:7b
          AUTOBOT_REPAIR_TIMEOUT_MS: '1200000'
        run: |
          set -euo pipefail
          node builder/runner/autobot-repair.mjs repair | tee builder/working/repair-proof-result.json

      - name: Confirm Repair Bot produced a real repair commit
        shell: bash
        run: |
          set -euo pipefail
          test -s builder/working/repair-proof-result.json
          node - <<'NODE'
          const fs=require('fs');
          const result=JSON.parse(fs.readFileSync('builder/working/repair-proof-result.json','utf8'));
          if(result.ok!==true || !result.commit || !result.baseCommit) throw new Error('Repair Bot did not return a focused repair commit');
          console.log(JSON.stringify(result,null,2));
          NODE
          grep -q '"status":"repaired"' builder/working/autobot-failure-queue.jsonl

      - name: Run independent QA Bot
        shell: bash
        env:
          AUTOBOT_QA_TIMEOUT_MS: '1200000'
        run: |
          set -euo pipefail
          node builder/runner/autobot-qa.mjs qa | tee builder/working/repair-proof-qa.json

      - name: Prove repaired product behaviour
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const text=fs.readFileSync('src/aiEditPlanner.js','utf8');
          const good='function clamp(value,min,max){return Math.max(min,Math.min(max,value));}';
          if(!text.includes(good)) throw new Error('The repaired product file does not contain the expected clamp implementation');
          console.log('REAL PRODUCT REPAIR PROOF: clamp implementation restored.');
          NODE
          grep -q '"status":"verified"' builder/working/autobot-failure-queue.jsonl

      - name: Upload repair proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autobot-real-product-repair-proof-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            builder/working/autobot-failure-queue.jsonl
            builder/working/repair-proof-failure.json
            builder/working/repair-proof-result.json
            builder/working/repair-proof-qa.json
            /tmp/autobot-ollama.log
            /tmp/autobot-model-ready.txt
