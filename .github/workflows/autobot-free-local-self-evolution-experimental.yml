name: AutoBot Free Local Self-Evolution (Experimental)

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Maximum evolution window'
        required: true
        default: '15m'
        type: choice
        options: ['15m', '30m', '1h']
      target:
        description: 'Self-improvement target'
        required: true
        default: 'builder/runner/aider-feature-brain.mjs'
        type: choice
        options:
          - builder/runner/aider-feature-brain.mjs
          - builder/runner/ollama-performance-proxy.mjs
          - builder/runner/self-improvement-planner.mjs

permissions:
  contents: read

jobs:
  free-local-evolution:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout exact experiment ref
        uses: actions/checkout@v4
        with:
          ref: experiment/autobot-free-evolution
          fetch-depth: 0

      - name: Verify experiment identity and lock
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="c37572844430a322bce0bc038c714069d9a77392"
          echo "ref=experiment/autobot-free-evolution"
          echo "sha=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('builder/runner/autobot-evolution-policy.json','utf8')); if(p.mode!=='self-evolution-only') throw new Error('unexpected mode: '+p.mode); if(p.productWorkLocked!==true) throw new Error('productWorkLocked is not true'); if(!Array.isArray(p.hardRules)||!p.hardRules.includes('never auto-commit')) throw new Error('missing no-auto-commit hard rule'); if(!Array.isArray(p.hardRules)||!p.hardRules.includes('never modify Bikeztagram product code while self-evolution-only mode is active')) throw new Error('missing product-lock hard rule'); console.log(JSON.stringify({mode:p.mode,productWorkLocked:p.productWorkLocked,hardRules:p.hardRules.length}));"
          test -f builder/runner/free-local-self-evolution.mjs
          test -z "$(git status --porcelain)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies without changing repository state
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Verify dependency install did not dirty the checkout
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then echo "$status"; echo 'Dependency installation changed the checkout.'; exit 1; fi

      - name: Validate baseline before model work
        run: |
          npm run verify:autobot-self-improvement-boundary
          npm run build

      - name: Cache llama.cpp
        uses: actions/cache@v4
        with:
          path: ~/.cache/bikeztagram-llama
          key: bikeztagram-llama-b10917-ubuntu-x64

      - name: Install llama.cpp CPU binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/bikeztagram-llama
          if [ ! -x ~/.cache/bikeztagram-llama/llama-cli ]; then
            curl -L --fail --retry 3 https://github.com/ggml-org/llama.cpp/releases/download/b10917/llama-b10917-bin-ubuntu-x64.tar.gz -o /tmp/llama.tar.gz
            tar -xzf /tmp/llama.tar.gz -C ~/.cache/bikeztagram-llama --strip-components=1
          fi
          test -x ~/.cache/bikeztagram-llama/llama-cli
          ~/.cache/bikeztagram-llama/llama-cli --version

      - name: Cache local Qwen2.5 Coder 3B model
        uses: actions/cache@v4
        with:
          path: ~/.cache/bikeztagram-qwen25-coder-3b
          key: bikeztagram-qwen25-coder-3b-q4km-v1

      - name: Download local Qwen2.5 Coder 3B model if needed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/bikeztagram-qwen25-coder-3b
          MODEL="$HOME/.cache/bikeztagram-qwen25-coder-3b/qwen2.5-coder-3b-instruct-q4_k_m.gguf"
          if [ ! -s "$MODEL" ]; then
            curl -L --fail --retry 3 'https://huggingface.co/Qwen/Qwen2.5-Coder-3B-Instruct-GGUF/resolve/main/qwen2.5-coder-3b-instruct-q4_k_m.gguf?download=true' -o "$MODEL"
          fi
          test -s "$MODEL"
          test "$(head -c 4 "$MODEL")" = "GGUF"
          size=$(stat -c '%s' "$MODEL")
          test "$size" -gt 1800000000
          echo "model_bytes=$size"
          sha256sum "$MODEL"

      - name: Smoke-test local model before evolution
        shell: bash
        env:
          LLAMA_CLI: /home/runner/.cache/bikeztagram-llama/llama-cli
          LOCAL_QWEN_MODEL: /home/runner/.cache/bikeztagram-qwen25-coder-3b/qwen2.5-coder-3b-instruct-q4_k_m.gguf
        run: |
          set -euo pipefail
          echo '--- runner memory ---'
          free -h
          echo '--- runner cpu ---'
          nproc
          "$LLAMA_CLI" --version
          echo '--- model smoke ---'
          if OUTPUT="$(timeout --kill-after=15s 120s "$LLAMA_CLI" -m "$LOCAL_QWEN_MODEL" -c 512 -n 8 -t 4 -ngl 0 --simple-io --no-display-prompt -p 'Return exactly READY and nothing else.' 2>/tmp/autobot-model-smoke.err)"; then
            :
          else
            status=$?
            cat /tmp/autobot-model-smoke.err >&2 || true
            echo "Local model smoke test failed (status=$status)."
            exit 1
          fi
          cat /tmp/autobot-model-smoke.err >&2 || true
          printf '%s\n' "$OUTPUT"
          printf '%s' "$OUTPUT" | grep -q 'READY'

      - name: Verify checkout is still clean before model edit
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then echo "$status"; echo 'Pre-edit checkout is dirty.'; exit 1; fi

      - name: Run one bounded free self-evolution attempt
        shell: bash
        env:
          AUTOBOT_FEATURE_FOCUS: self-improvement-only
          AUTOBOT_SELF_EVOLUTION_REF: experiment/autobot-free-evolution
          AUTOBOT_LOCAL_TARGET: ${{ inputs.target }}
          LLAMA_CLI: /home/runner/.cache/bikeztagram-llama/llama-cli
          LOCAL_QWEN_MODEL: /home/runner/.cache/bikeztagram-qwen25-coder-3b/qwen2.5-coder-3b-instruct-q4_k_m.gguf
          LOCAL_QWEN_CONTEXT: 4096
          LOCAL_QWEN_OUTPUT: 700
          LOCAL_QWEN_THREADS: 4
          LOCAL_QWEN_TIMEOUT_MS: 480000
        run: |
          set -euo pipefail
          case '${{ inputs.duration }}' in
            15m) WINDOW=14m ;;
            30m) WINDOW=29m ;;
            1h) WINDOW=59m ;;
            *) echo 'Invalid duration'; exit 1 ;;
          esac
          timeout --kill-after=30s "$WINDOW" node builder/runner/free-local-self-evolution.mjs

      - name: Verify accepted candidate and capture evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo '--- worktree ---'
          git status --short
          echo '--- diff stat ---'
          git diff --stat
          echo '--- changed files ---'
          git diff --name-only
          changed="$(git diff --name-only)"
          if [ -n "$changed" ]; then
            while IFS= read -r file; do
              case "$file" in
                builder/runner/aider-feature-brain.mjs|builder/runner/ollama-performance-proxy.mjs|builder/runner/self-improvement-planner.mjs) ;;
                *) echo "Unexpected file changed: $file"; exit 1 ;;
              esac
            done <<< "$changed"
          fi
          if [ -f builder/working/free-local-self-evolution-result.json ]; then
            node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('builder/working/free-local-self-evolution-result.json','utf8')); if(p.verified!==true||p.provider!=='local-only'||p.hostedApiRequired!==false) throw new Error('accepted result failed local-only verification'); if(!Array.isArray(p.changedPaths)||p.changedPaths.length<1) throw new Error('accepted result has no changedPaths'); console.log(JSON.stringify(p,null,2));"
          else
            echo 'No accepted-candidate result was produced; preserving the model-run failure as the job failure.'
          fi
          mkdir -p builder/working/free-local-evolution-evidence
          git diff -- builder/runner/aider-feature-brain.mjs builder/runner/ollama-performance-proxy.mjs builder/runner/self-improvement-planner.mjs > builder/working/free-local-evolution-evidence/candidate.patch || true
          git status --porcelain=v1 > builder/working/free-local-evolution-evidence/status.txt || true
          git rev-parse HEAD > builder/working/free-local-evolution-evidence/execution-sha.txt
          if [ -f builder/working/free-local-self-evolution-result.json ]; then cp builder/working/free-local-self-evolution-result.json builder/working/free-local-evolution-evidence/result.json; fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autobot-free-local-evolution-${{ github.run_id }}
          path: builder/working/free-local-evolution-evidence
          if-no-files-found: warn
