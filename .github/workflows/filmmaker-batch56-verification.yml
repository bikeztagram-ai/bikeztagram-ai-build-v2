name: Bikeztagram Batch 56 Verification

on:
  push:
    branches: [dev/ai-filmmaker-batch-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout development batch
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Build production bundle
        run: npm run build
      - name: Verify music API resilience
        run: node scripts/verify-batch56-music-api-resilience.mjs
