name: Bikeztagram Model Benchmark V1
on:
  push:
    branches: [parallel/batch-31-model-benchmark-harness]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/verify-model-benchmark-v1.mjs
