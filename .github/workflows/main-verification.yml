name: Bikeztagram Main Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build production bundle
        run: npm run build
      - name: Verify beat-aware production integration
        run: npm run verify:batch23
      - name: Verify original music generation bridge
        run: npm run verify:batch24
      - name: Verify autonomous quality loop
        run: npm run verify:batch25
      - name: Verify real audio analysis
        run: npm run verify:batch26
      - name: Verify Lyria song modes
        run: npm run verify:batch27
      - name: Verify renderer audio mux and beat sync
        run: npm run verify:batch28
      - name: Verify render quality loop
        run: npm run verify:batch29
      - name: Verify universal image intake
        run: npm run verify:batch30
      - name: Verify mixed-media source library
        run: npm run verify:batch31
      - name: Verify automatic soundtrack attachment
        run: npm run verify:batch32
