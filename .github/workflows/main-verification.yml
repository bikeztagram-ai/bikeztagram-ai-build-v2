name: Bikeztagram Main Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout proposed revision
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build production bundle
        run: npm run build
      - name: Verify Fast Brain architecture contract
        run: node scripts/autobot/verify-fast-brain-release-contract.mjs
      - name: Verify Fast Brain deterministic agent harness
        run: node scripts/autobot/verify-fast-brain-agent-harness.mjs
      - name: Audit all active verification batches
        run: node scripts/verify-main-suite.mjs
