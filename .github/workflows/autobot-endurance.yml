name: 🧠 AutoBot — cumulative endurance
on:
  workflow_dispatch:
    inputs:
      cycles: {description: Sequential development cycles, required: true, default: '1', type: choice, options: ['1','2','3']}
      duration: {description: Builder budget for each cycle, required: true, default: 15m, type: choice, options: ['15m','30m','1h','4h','5h']}
      local_model: {description: Local coding model, required: false, default: qwen2.5-coder:7b, type: string}
permissions: {contents: write, pull-requests: write, actions: read}
concurrency: {group: autobot-cumulative-endurance, cancel-in-progress: false}
jobs:
  cycle1:
    uses: bikeztagram-ai/bikeztagram-ai-build-v2/.github/workflows/autobot-endurance-cycle.yml@e979821e583bff179aa742e2700f92461fa258d8
    with:
      base_ref: main
      duration: ${{ inputs.duration }}
      cycle_number: '1'
      local_model: ${{ inputs.local_model }}
    secrets: inherit
  cycle2:
    needs: cycle1
    if: ${{ inputs.cycles != '1' && needs.cycle1.result == 'success' }}
    uses: bikeztagram-ai/bikeztagram-ai-build-v2/.github/workflows/autobot-endurance-cycle.yml@e979821e583bff179aa742e2700f92461fa258d8
    with:
      base_ref: ${{ needs.cycle1.outputs.cumulative_ref }}
      duration: ${{ inputs.duration }}
      cycle_number: '2'
      local_model: ${{ inputs.local_model }}
    secrets: inherit
  cycle3:
    needs: cycle2
    if: ${{ inputs.cycles == '3' && needs.cycle2.result == 'success' }}
    uses: bikeztagram-ai/bikeztagram-ai-build-v2/.github/workflows/autobot-endurance-cycle.yml@e979821e583bff179aa742e2700f92461fa258d8
    with:
      base_ref: ${{ needs.cycle2.outputs.cumulative_ref }}
      duration: ${{ inputs.duration }}
      cycle_number: '3'
      local_model: ${{ inputs.local_model }}
    secrets: inherit
