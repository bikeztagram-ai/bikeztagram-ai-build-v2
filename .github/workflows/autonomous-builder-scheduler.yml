name: 🤖 AutoBot Control Center

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: autobot-control-center
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check for active canonical AutoBot runs
        id: active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fast="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow autonomous-builder-v2-fast.yml --limit 20 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')"
          echo "active=$fast" >> "$GITHUB_OUTPUT"
          echo "Active canonical AutoBot runs: $fast"

      - name: Preflight canonical fast brain on main
        if: steps.active.outputs.active == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/contents"
          get() { gh api "$api/$1?ref=main" --jq .content | base64 --decode; }
          workflow="$(get '.github/workflows/autonomous-builder-v2-fast.yml')"
          executor="$(get 'builder/runner/repository-aware-executor.mjs')"
          feature="$(get 'builder/runner/repository-aware-feature-brain.mjs')"
          safety="$(get 'scripts/autobot/verify-autobot-safety-contract-v3.mjs')"
          resilience="$(get 'scripts/autobot/verify-feature-brain-resilience.mjs')"
          package="$(get 'package.json')"
          printf '%s\n' "$workflow" | grep -q 'cancel-in-progress: false'
          printf '%s\n' "$workflow" | grep -q 'qwen3:4b-instruct-2507-q4_K_M'
          printf '%s\n' "$workflow" | grep -q 'AUTOBOT_FEATURE_MAX_EDITS: 3'
          printf '%s\n' "$workflow" | grep -q 'repository-aware-executor.mjs'
          printf '%s\n' "$workflow" | grep -q 'verify-autobot-safety-contract-v3.mjs'
          printf '%s\n' "$executor" | grep -q 'repository-aware-feature-brain.mjs'
          printf '%s\n' "$feature" | grep -q 'repository-aware-agent-v7'
          printf '%s\n' "$feature" | grep -q 'objectiveFiles'
          printf '%s\n' "$safety" | grep -q 'objectiveContext'
          printf '%s\n' "$resilience" | grep -q 'per-attempt snapshot'
          printf '%s\n' "$package" | grep -q 'verify:autobot-production-gate'
          echo 'Canonical AutoBot main-branch preflight PASS.'

      - name: Dispatch a fresh canonical builder run
        if: steps.active.outputs.active == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run autonomous-builder-v2-fast.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f max_units='1000' \
            -f duration='15m' \
            -f local_model='qwen3:4b-instruct-2507-q4_K_M'
          echo 'Canonical AutoBot heartbeat dispatched a fresh 15-minute Qwen3 run.'

      - name: Record heartbeat result
        run: |
          {
            echo '# 🤖 AutoBot V2 heartbeat'
            echo
            if [[ '${{ steps.active.outputs.active }}' == '0' ]]; then
              echo 'A fresh canonical 15-minute Qwen3 run was dispatched after main-branch preflight.'
            else
              echo 'A canonical AutoBot run was already queued/running; no duplicate was dispatched.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
