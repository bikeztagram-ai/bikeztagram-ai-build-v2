name: 🤖 AutoBot Control Center

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: autobot-control-center
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check for active AutoBot runs
        id: active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fast="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow autonomous-builder-v2-fast.yml --limit 20 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')"
          legacy="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow autonomous-builder-v2.yml --limit 20 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')"
          continuation="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow autonomous-builder-continuation.yml --limit 20 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')"
          active=$((fast + legacy + continuation))
          echo "active=$active" >> "$GITHUB_OUTPUT"
          echo "Active AutoBot runs: $active (fast=$fast legacy=$legacy continuation=$continuation)"

      - name: Preflight hardened AutoBot safety contract on main
        if: steps.active.outputs.active == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/contents"
          get() { gh api "$api/$1?ref=main" --jq .content | base64 --decode; }
          workflow="$(get '.github/workflows/autonomous-builder-v2-fast.yml')"
          sustained="$(get 'builder/runner/long-run-executor.mjs')"
          feature="$(get 'builder/runner/feature-brain.mjs')"
          safety="$(get 'scripts/autobot/verify-autobot-safety-contract.mjs')"
          resilience="$(get 'scripts/autobot/verify-feature-brain-resilience.mjs')"
          package="$(get 'package.json')"
          printf '%s\n' "$workflow" | grep -q 'cancel-in-progress: false'
          printf '%s\n' "$workflow" | grep -q 'qwen2.5-coder:7b'
          printf '%s\n' "$workflow" | grep -q 'AUTOBOT_FEATURE_MAX_EDITS: 2'
          printf '%s\n' "$workflow" | grep -q 'verify-feature-brain-resilience.mjs'
          printf '%s\n' "$sustained" | grep -q 'feature-brain-started'
          printf '%s\n' "$sustained" | grep -q 'deterministic-recoverable-failure'
          printf '%s\n' "$feature" | grep -q 'restoreAttemptFiles'
          printf '%s\n' "$feature" | grep -q 'progress\[obj.id\]'
          printf '%s\n' "$safety" | grep -q 'snapshotFiles'
          printf '%s\n' "$resilience" | grep -q 'per-attempt snapshot'
          printf '%s\n' "$package" | grep -q 'verify:autobot-production-gate'
          echo 'Hardened AutoBot main-branch preflight PASS.'

      - name: Dispatch a fresh hardened builder run
        if: steps.active.outputs.active == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run autonomous-builder-v2-fast.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f max_units='1000' \
            -f duration='6h' \
            -f local_model='qwen2.5-coder:7b'
          echo 'Hardened AutoBot fast-brain heartbeat dispatched a fresh 6-hour run.'

      - name: Record heartbeat result
        run: |
          {
            echo '# 🤖 AutoBot V2 heartbeat'
            echo
            if [[ '${{ steps.active.outputs.active }}' == '0' ]]; then
              echo 'A fresh hardened fast-brain run was dispatched after main-branch preflight.'
            else
              echo 'An AutoBot run was already queued/running; no duplicate was dispatched.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
