name: 🤖 AutoBot Control Center

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: autobot-control-center
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check for active AutoBot V2 run
        id: active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow autonomous-builder-v2.yml --limit 20 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')"
          echo "active=$active" >> "$GITHUB_OUTPUT"
          echo "Active AutoBot V2 runs: $active"

      - name: Dispatch a fresh sustained builder run
        if: steps.active.outputs.active == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run autonomous-builder-v2.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f max_units='1000' \
            -f duration='6h' \
            -f local_model='qwen2.5-coder:7b'
          echo 'AutoBot V2 heartbeat dispatched a fresh sustained run.'

      - name: Record heartbeat result
        run: |
          {
            echo '# 🤖 AutoBot V2 heartbeat'
            echo
            if [[ '${{ steps.active.outputs.active }}' == '0' ]]; then
              echo 'A fresh sustained AutoBot V2 run was dispatched.'
            else
              echo 'An AutoBot V2 run was already queued/running; no duplicate was dispatched.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
