name: 🤖 AutoBot Control Center

on:
  workflow_dispatch:

# The queue is now driven by the manual Autonomous Builder Batch workflow.
# This retired control-center workflow intentionally has no cron, push, or
# workflow_run trigger and does not dispatch builders.

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm retired scheduler
        run: |
          {
            echo "# 🤖 AutoBot Control Center"
            echo
            echo "## Scheduler retired"
            echo "The heartbeat/self-dispatch scheduler is no longer used."
            echo "Use **Autonomous Builder Batch → Run workflow** to process the durable queue sequentially."
            echo "The builder workflow defaults to 5 batches per manual run and can be set to 10."
          } >> "$GITHUB_STEP_SUMMARY"
