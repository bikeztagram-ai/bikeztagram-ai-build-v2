name: Bikeztagram Signed Blob Upload Verification

on:
  push:
    branches: [fix/blob-presigned-browser-upload]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build production bundle
        run: npm run build
      - name: Verify signed Blob upload contract
        run: npm run verify:blob-upload
