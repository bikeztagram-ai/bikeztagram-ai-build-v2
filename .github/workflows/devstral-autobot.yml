name: 🚀 DEVSTRAL AUTOBOT — RUN THIS

on:
  workflow_dispatch:
    inputs:
      max_units:
        description: 'Safety ceiling on verified deterministic units'
        required: false
        default: '1000'
        type: string
      duration:
        description: 'Shared work time budget'
        required: false
        default: '15m'
        type: choice
        options: ['15m','30m','1h','2h','3h','4h','5h','6h']

run-name: Devstral AutoBot — ${{ inputs.duration }} — ${{ github.actor }}

concurrency:
  group: devstral-autobot
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  BUILDER_MAX_UNITS: ${{ inputs.max_units }}
  REQUESTED_DURATION: ${{ inputs.duration }}
  LOCAL_AI_MODEL: devstral:24b
  BUILDER_BASE_BRANCH: main
  DEVSTRAL_SOURCE_BRANCH: devstral-agent-v1

jobs:
  devstral-autobot:
    runs-on: ubuntu-latest
    timeout-minutes: 370
    steps:
      - name: Checkout Devstral source branch
        uses: actions/checkout@v5
        with:
          ref: devstral-agent-v1
          fetch-depth: 0

      - name: Verify Devstral source revision
        shell: bash
        run: |
          set -euo pipefail
          expected="$(git ls-remote origin refs/heads/devstral-agent-v1 | cut -f1)"
          actual="$(git rev-parse HEAD)"
          echo "[autobot] expected Devstral branch SHA: $expected"
          echo "[autobot] checked-out SHA:              $actual"
          test -n "$expected"
          test "$actual" = "$expected"
          echo "[autobot] exact Devstral source revision: PASS"

      - name: Verify Devstral experimental architecture
        run: node scripts/autobot/verify-fast-brain-devstral-contract.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Cache local Devstral model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: bikeztagram-local-ai-${{ runner.os }}-devstral-24b

      - name: Start local AI brain — Devstral 24B
        env:
          LOCAL_AI_MODEL: devstral:24b
        run: bash scripts/autobot/install-local-brain.sh

      - name: Start Devstral performance proxy
        run: |
          set -euo pipefail
          nohup node builder/runner/ollama-performance-proxy.mjs >/tmp/bikeztagram-ollama-proxy.log 2>&1 &
          proxy_ready=false
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11435/health >/dev/null 2>&1; then
              proxy_ready=true
              break
            fi
            sleep 1
          done
          if [ "$proxy_ready" != true ]; then
            echo 'Performance proxy failed to start.'
            cat /tmp/bikeztagram-ollama-proxy.log || true
            exit 1
          fi
          echo 'OLLAMA_HOST=http://127.0.0.1:11435' >> "$GITHUB_ENV"
          echo 'LOCAL_AI_FEATURE_TIMEOUT_SECONDS=300' >> "$GITHUB_ENV"
          echo 'AUTOBOT_FEATURE_MAX_ATTEMPTS=1' >> "$GITHUB_ENV"
          echo 'AUTOBOT_FEATURE_MAX_EDITS=3' >> "$GITHUB_ENV"
          echo 'AUTOBOT_AGENT_TURNS=10' >> "$GITHUB_ENV"
          echo 'LOCAL_AI_PROXY_NUM_CTX=8192' >> "$GITHUB_ENV"
          echo 'LOCAL_AI_PROXY_NUM_PREDICT=900' >> "$GITHUB_ENV"
          echo 'LOCAL_AI_PROXY_THINK=false' >> "$GITHUB_ENV"
          echo '[autobot] Devstral 24B performance proxy ready'

      - name: Resolve duration
        run: |
          case "$REQUESTED_DURATION" in
            15m) minutes=15;;
            30m) minutes=30;;
            1h) minutes=60;;
            2h) minutes=120;;
            3h) minutes=180;;
            4h) minutes=240;;
            5h) minutes=300;;
            6h) minutes=360;;
            *) echo "Unsupported duration: $REQUESTED_DURATION"; exit 1;;
          esac
          echo "BUILDER_MAX_MINUTES=$minutes" >> "$GITHUB_ENV"
          echo "BUILDER_SEGMENT=1" >> "$GITHUB_ENV"
          echo "[autobot] Devstral 24B Fast Brain budget: ${minutes}m"

      - name: Validate autonomous builder
        run: |
          node --check builder/runner/deterministic-executor.mjs
          node --check builder/runner/repository-aware-fast-executor.mjs
          node --check builder/runner/repository-aware-feature-brain.mjs
          node --check builder/runner/repository-aware-devstral-agent.mjs
          node --check builder/runner/ollama-performance-proxy.mjs
          node --check scripts/autobot/fast-brain-runtime-hardening.mjs
          node --check scripts/autobot/fast-brain-performance-hardening.mjs
          node --check scripts/autobot/verify-fast-brain-rollback.mjs
          node --check scripts/autobot/verify-fast-brain-devstral-contract.mjs
          node --check scripts/autobot/verify-fast-brain-agent-harness.mjs
          node scripts/autobot/verify-deterministic-executor.mjs
          node scripts/autobot/verify-autobot-safety-contract.mjs
          node scripts/autobot/verify-autobot-safety-contract-v2.mjs
          node scripts/autobot/verify-autobot-safety-contract-v3.mjs
          node scripts/autobot/verify-autobot-continuous-loop.mjs
          node scripts/autobot/verify-autobot-feature-edit-protocol.mjs
          node scripts/autobot/verify-feature-objective-dependencies.mjs
          node scripts/autobot/verify-feature-brain-resilience.mjs
          node scripts/autobot/verify-fast-brain-rollback.mjs
          node scripts/autobot/verify-fast-brain-agent-harness.mjs
          node builder/quality/autobot-ready.mjs

      - name: Run Devstral AutoBot
        run: node builder/runner/repository-aware-fast-executor.mjs

      - name: Require a real product-source change
        if: success()
        run: |
          set -euo pipefail
          git diff --name-only | grep -E '^(src|public)/' >/tmp/autobot-product-source-change.txt || {
            echo 'No real product-source change detected under src/ or public/.'
            exit 1
          }
          echo 'Require a real product-source change: PASS'
          cat /tmp/autobot-product-source-change.txt

      - name: Production verification
        if: success()
        run: |
          npm run verify:autobot-production-gate
          npm run verify:project-memory
          npm run verify:autobot-continuous-loop
          npm run verify:autobot-dependencies

      - name: Persist continuation state
        if: always()
        run: node builder/runner/segment-state.mjs

      - name: Publish checkpoint
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git add -A
          git reset -- .github/workflows builder/working
          git diff --cached --binary origin/main -- . ':(exclude).github/workflows' ':(exclude)builder/working' >/tmp/autobot-checkpoint.patch
          git reset --mixed
          git stash push --include-untracked -m 'autobot checkpoint working tree' >/tmp/autobot-stash.txt
          git switch --detach origin/main
          git apply --index /tmp/autobot-checkpoint.patch
          git restore --source=origin/main -- .github/workflows/
          rm -rf builder/working
          branch="autonomous-builder-v2-fast/${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git config user.name 'Bikeztagram Autonomous Builder V2'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: autonomous builder fast brain checkpoint'
          git push --set-upstream origin "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --draft --title 'Autonomous Builder V2 Devstral checkpoint' --body 'Experimental autonomous builder checkpoint using isolated local Devstral 24B. Review required before merge.' || true

      - name: Post Cache local Devstral model
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ollama/models
          key: bikeztagram-local-ai-${{ runner.os }}-devstral-24b

      - name: Complete job
        if: always()
        run: echo '🚀 DEVSTRAL AUTOBOT run complete.'
