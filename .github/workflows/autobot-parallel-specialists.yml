name: 🧩 AutoBot Persistent Specialists

on:
  workflow_dispatch:
    inputs:
      duration:
        description: Total AutoBot run budget (cycles continue inside this run)
        required: true
        default: 15m
        type: choice
        options: ['15m','30m','1h','4h','5h','5h30']
      local_model:
        description: Local discovery/coding model
        required: false
        default: qwen2.5-coder:7b
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autobot-persistent-specialists
  cancel-in-progress: false

env:
  LOCAL_AI_MODEL: ${{ inputs.local_model }}
  AUTOBOT_DISCOVERY_MODEL: qwen2.5-coder:3b
  AUTOBOT_DISCOVERY_TIMEOUT_MS: 180000
  AUTOBOT_PARALLEL_BOTS: director-builder,timeline-builder
  AUTOBOT_TOTAL_DURATION: ${{ inputs.duration }}
  AUTOBOT_CYCLE_MINUTES: ${{ inputs.duration == '15m' && '10' || inputs.duration == '30m' && '15' || '30' }}
  AUTOBOT_FINISH_GRACE_MINUTES: ${{ (inputs.duration == '1h' || inputs.duration == '4h' || inputs.duration == '5h' || inputs.duration == '5h30') && '15' || '0' }}
  AUTOBOT_CYCLE_SAFETY_MINUTES: '1'
  AUTOBOT_SPECIALIST_FALLBACK_MODEL: qwen2.5-coder:3b

jobs:
  persistent-autobot:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies once
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Install Aider engine once
        run: python -m pip install --disable-pip-version-check --no-input aider-chat

      - name: Start local AI brain once
        run: bash scripts/autobot/install-local-brain.sh
        env:
          LOCAL_AI_MODEL: ${{ env.LOCAL_AI_MODEL }}
          AUTOBOT_DISCOVERY_MODEL: ${{ env.AUTOBOT_DISCOVERY_MODEL }}
          AUTOBOT_SPECIALIST_FALLBACK_MODEL: ${{ env.AUTOBOT_SPECIALIST_FALLBACK_MODEL }}
          LOCAL_AI_PROXY_NUM_CTX: 4096
          LOCAL_AI_PROXY_NUM_PREDICT: 900
          OLLAMA_CONTEXT_LENGTH: 4096
          OLLAMA_NUM_PARALLEL: 1
          OLLAMA_MAX_QUEUE: 8
          OLLAMA_LOAD_TIMEOUT: 20m
          OLLAMA_KEEP_ALIVE: 6h

      - name: Start performance proxy once
        run: |
          nohup node builder/runner/ollama-performance-proxy.mjs >/tmp/bikeztagram-ollama-proxy.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11435/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:11435/health >/dev/null
          echo 'OLLAMA_HOST=http://127.0.0.1:11435' >> "$GITHUB_ENV"

      - name: Run deep AutoBot contract audit
        run: node scripts/autobot/verify-autobot-persistent-cycle.mjs

      - name: Verify planner model once
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 120 \
            http://127.0.0.1:11435/api/chat \
            -H 'Content-Type: application/json' \
            -d "{\"model\":\"${AUTOBOT_DISCOVERY_MODEL}\",\"stream\":false,\"messages\":[{\"role\":\"user\",\"content\":\"Reply with READY only.\"}],\"options\":{\"num_ctx\":2048,\"num_predict\":16}}" \
            >/tmp/bikeztagram-planner-smoke.json
          node -e "const x=require('/tmp/bikeztagram-planner-smoke.json'); if(!x.message?.content && !x.response) process.exit(1); console.log('[autobot] planner model smoke test passed')"

      - name: Anchor cumulative deadline
        run: echo "AUTOBOT_RUN_STARTED_EPOCH_MS=$(date +%s000)" >> "$GITHUB_ENV"

      - name: Run persistent AutoBot engine
        env:
          AUTOBOT_BASE_REF: main
          AUTOBOT_SKIP_NPM_INSTALL: 'true'
        run: node builder/runner/autobot-persistent-cycle-engine.mjs

      - name: Capture persistent runtime evidence
        if: always()
        run: |
          echo '--- persistent runtime state ---'
          cat builder/working/persistent-runtime-state.json 2>/dev/null || true
          echo '--- AutoBot live status ---'
          cat builder/working/autobot-live-status.log 2>/dev/null || true
          echo '--- Ollama processes ---'
          OLLAMA_HOST=127.0.0.1:11434 ollama ps || true
          echo '--- Ollama server log ---'
          if [ -f /tmp/bikeztagram-ollama.log ]; then tail -n 200 /tmp/bikeztagram-ollama.log; else echo 'Ollama is using an existing service; no local server log file was created.'; fi
          echo '--- performance proxy log ---'
          tail -n 200 /tmp/bikeztagram-ollama-proxy.log || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: autobot-persistent-runtime-${{ github.run_id }}
          path: |
            builder/working/persistent-runtime-state.json
            builder/working/autobot-live-status.log
            builder/working/autobot-final-handoff.json
            builder/working/persistent/**
          if-no-files-found: ignore
