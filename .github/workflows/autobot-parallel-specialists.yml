          LOCAL_AI_PROXY_NUM_CTX: 4096
          LOCAL_AI_PROXY_NUM_PREDICT: 900
          OLLAMA_CONTEXT_LENGTH: 4096
          OLLAMA_NUM_PARALLEL: 1
          OLLAMA_MAX_QUEUE: 4
          OLLAMA_LOAD_TIMEOUT: 20m
          OLLAMA_KEEP_ALIVE: 90m

      - name: Run Scene specialist
        id: execute
        env:
          AUTOBOT_SPECIALIST_BOT_ID: scene-builder
          AUTOBOT_SPECIALIST_OBJECTIVE: "Experimental Scene lane: improve duration-bounded scene shot continuity in src/universalCreativeSceneEngine.js with one minimal, production-safe change. Preserve existing APIs and contracts. Acceptance:
- scene shot count remains bounded and scales with duration
- only the owned file is changed
- syntax, build and product-quality verification pass
- leave a candidate when valid."
          AUTOBOT_SPECIALIST_BUILDER_ENABLED: 'true'
          AUTOBOT_EXPERIMENTAL_WORKER: 'true'
          AUTOBOT_BASE_REF: ${{ github.sha }}
          AUTOBOT_AIDER_MODEL: ${{ env.LOCAL_AI_MODEL }}
          AUTOBOT_SPECIALIST_PRODUCT_QUALITY_CHECK: npm run verify:autobot-product-change-quality
          AUTOBOT_SPECIALIST_FALLBACK_MODEL: ${{ env.AUTOBOT_SPECIALIST_FALLBACK_MODEL }}
          AUTOBOT_SPECIALIST_FALLBACK_MINUTES: '4'
          AUTOBOT_FINISH_GRACE_MINUTES: '0'
          AUTOBOT_SKIP_NPM_INSTALL: 'true'
          BUILDER_MAX_MINUTES: ${{ inputs.duration == '15m' && '15' || inputs.duration == '30m' && '30' || inputs.duration == '1h' && '60' || inputs.duration == '4h' && '60' || '60' }}
          AUTOBOT_COORDINATION_ID: persistent-${{ github.run_id }}
        run: node builder/runner/autobot-specialist-builder.mjs

      - name: Publish Scene candidate branch
