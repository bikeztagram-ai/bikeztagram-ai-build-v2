name: 🧩 AutoBot Parallel Specialists
on:
  workflow_dispatch:
    inputs:
      duration:
        description: Total AutoBot run budget (cycles continue automatically)
        required: true
        default: 15m
        type: choice
        options: ['15m','30m','1h','4h','5h']
      local_model:
        description: Local discovery/coding model
        required: false
        default: qwen2.5-coder:7b
        type: string
  repository_dispatch:
    types: [autobot-cycle]
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: autobot-parallel-specialists
  cancel-in-progress: false
env:
  LOCAL_AI_MODEL: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.local_model || inputs.local_model }}
  AUTOBOT_DISCOVERY_MODEL: qwen2.5-coder:3b
  AUTOBOT_DISCOVERY_TIMEOUT_MS: 180000
  AUTOBOT_PARALLEL_BOTS: director-builder,timeline-builder
  AUTOBOT_BASE_REF: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.base_ref || 'main' }}
  AUTOBOT_TOTAL_DURATION: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.total_duration || inputs.duration }}
  AUTOBOT_RUN_DEADLINE_EPOCH_MS: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.run_deadline_epoch_ms || '' }}
  AUTOBOT_RUN_STARTED_AT: ${{ github.run_started_at }}
  AUTOBOT_CYCLE_NUMBER: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.cycle_number || '1' }}
  AUTOBOT_CYCLE_MINUTES: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.cycle_minutes || ((github.event_name == 'repository_dispatch' && github.event.client_payload.total_duration || inputs.duration) == '15m' && '15' || (github.event_name == 'repository_dispatch' && github.event.client_payload.total_duration || inputs.duration) == '30m' && '15' || '30') }}
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.AUTOBOT_BASE_REF }}
          fetch-depth: 0
      - run: npm install --no-audit --no-fund --no-package-lock
      - name: Verify parallel activation gate
        run: node scripts/autobot/verify-autobot-parallel-fleet.mjs --gate-only
      - name: Install Aider engine
        run: python -m pip install --disable-pip-version-check --no-input aider-chat
      - name: Start local AI brain
        run: bash scripts/autobot/install-local-brain.sh
      - name: Start performance proxy
        run: |
          nohup node builder/runner/ollama-performance-proxy.mjs >/tmp/bikeztagram-ollama-proxy.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:11435/health >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:11435/health >/dev/null
          echo 'OLLAMA_HOST=http://127.0.0.1:11435' >> "$GITHUB_ENV"
      - name: Verify planner model through proxy
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 120 \
            http://127.0.0.1:11435/api/chat \
            -H 'Content-Type: application/json' \
            -d "{\"model\":\"${AUTOBOT_DISCOVERY_MODEL}\",\"stream\":false,\"messages\":[{\"role\":\"user\",\"content\":\"Reply with READY only.\"}],\"options\":{\"num_ctx\":2048,\"num_predict\":16}}" \
            >/tmp/bikeztagram-planner-smoke.json
          node -e "const x=require('/tmp/bikeztagram-planner-smoke.json'); if(!x.message?.content && !x.response) process.exit(1); console.log('[autobot] planner model smoke test passed')"
      - name: Discover independent work packages
        run: node builder/runner/autobot-parallel-planner.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: autobot-parallel-plan-${{ github.run_id }}
          path: builder/working/autobot-parallel-plan.json
  specialists:
    needs: plan
    if: ${{ needs.plan.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        bot: [director-builder, timeline-builder]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.AUTOBOT_BASE_REF }}
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: autobot-parallel-plan-${{ github.run_id }}
          path: builder/working
      - name: Read assigned objective
        id: assignment
        env:
          BOT: ${{ matrix.bot }}
        run: |
          node - <<'NODE'
          const fs=require('fs'); const plan=JSON.parse(fs.readFileSync('builder/working/autobot-parallel-plan.json','utf8')); const item=plan.workers.find(x=>x.botId===process.env.BOT); if(!item) throw new Error(`No plan for ${process.env.BOT}`); fs.appendFileSync(process.env.GITHUB_OUTPUT,`objective<<EOF\n${item.title}\n${item.whyNow}\nAcceptance:\n${item.acceptance.join('; ')}\nEOF\n`);
          NODE
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: python -m pip install --disable-pip-version-check --no-input aider-chat
      - run: bash scripts/autobot/install-local-brain.sh
        env:
          LOCAL_AI_MODEL: ${{ env.LOCAL_AI_MODEL }}
          AUTOBOT_DISCOVERY_MODEL: qwen2.5-coder:3b
          AUTOBOT_SPECIALIST_FALLBACK_MODEL: qwen2.5-coder:3b
          LOCAL_AI_PROXY_NUM_CTX: 4096
          LOCAL_AI_PROXY_NUM_PREDICT: 900
          OLLAMA_CONTEXT_LENGTH: 4096
          OLLAMA_NUM_PARALLEL: 1
          OLLAMA_MAX_QUEUE: 8
          OLLAMA_LOAD_TIMEOUT: 20m
          OLLAMA_KEEP_ALIVE: 30m
      - name: Start performance proxy
        run: |
          nohup node builder/runner/ollama-performance-proxy.mjs >/tmp/bikeztagram-ollama-proxy.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:11435/health >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:11435/health >/dev/null
          echo 'OLLAMA_HOST=http://127.0.0.1:11435' >> "$GITHUB_ENV"
      - name: Execute isolated specialist Builder
        id: execute
        env:
          AUTOBOT_SPECIALIST_BOT_ID: ${{ matrix.bot }}
          AUTOBOT_SPECIALIST_OBJECTIVE: ${{ steps.assignment.outputs.objective }}
          AUTOBOT_SPECIALIST_BUILDER_ENABLED: 'true'
          AUTOBOT_SPECIALIST_PRODUCT_QUALITY_CHECK: npm run verify:autobot-product-change-quality
          AUTOBOT_SPECIALIST_FEATURE_ENGINE: aider
          AUTOBOT_SPECIALIST_FALLBACK_MODEL: qwen2.5-coder:3b
          AUTOBOT_AIDER_CALL_TIMEOUT_MS: '150000'
          AUTOBOT_FINISH_GRACE_MINUTES: '0'
          BUILDER_MAX_MINUTES: ${{ env.AUTOBOT_CYCLE_MINUTES }}
          LOCAL_AI_PROXY_NUM_CTX: 4096
          LOCAL_AI_PROXY_NUM_PREDICT: 900
          OLLAMA_CONTEXT_LENGTH: 4096
          OLLAMA_NUM_PARALLEL: 1
          OLLAMA_MAX_QUEUE: 8
          OLLAMA_LOAD_TIMEOUT: 20m
          OLLAMA_KEEP_ALIVE: 30m
        run: node builder/runner/autobot-specialist-builder.mjs
      - name: Capture specialist outcome
        if: always()
        env:
          BOT: ${{ matrix.bot }}
          OBJECTIVE: ${{ steps.assignment.outputs.objective }}
          OUTCOME: ${{ steps.execute.outcome }}
        run: |
          set -euo pipefail
          mkdir -p builder/working
          if [ -f builder/working/autobot-specialist-outcome.json ]; then
            echo '[autobot] preserving structured outcome written by specialist runner'
            exit 0
          fi
          node - <<'NODE'
          const fs=require('node:fs');
          const registry=JSON.parse(fs.readFileSync('builder/brain/autobot-fleet.json','utf8'));
          const bot=registry.bots.find(x=>x.id===process.env.BOT);
          const outcome={schemaVersion:'autobot-specialist-outcome-v1',botId:process.env.BOT,objective:process.env.OBJECTIVE,status:process.env.OUTCOME==='success'?'success':'failure',repairable:false,category:process.env.OUTCOME==='success'?'completed':'unknown-failure',files:Array.isArray(bot?.ownsFiles)?bot.ownsFiles:[],baseCommit:null,patchPath:null,evidence:['GitHub Actions specialist execution logs'],error:process.env.OUTCOME==='success'?null:`Specialist Builder job ended with outcome: ${process.env.OUTCOME}`};
          fs.writeFileSync('builder/working/autobot-specialist-outcome.json',JSON.stringify(outcome,null,2)+'\n');
          NODE
      - name: Capture local AI diagnostics
        if: always()
        run: |
          echo '--- ollama ps ---'
          ollama ps || true
          echo '--- ollama server log ---'
          tail -n 160 /tmp/bikeztagram-ollama.log || true
          echo '--- performance proxy log ---'
          tail -n 160 /tmp/bikeztagram-ollama-proxy.log || true
      - name: Publish specialist candidate branch
        if: steps.execute.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          BOT: ${{ matrix.bot }}
        run: |
          set -euo pipefail
          branch="$(node -e "console.log(JSON.parse(require('fs').readFileSync('builder/working/autobot-specialist-handoff.json','utf8')).branch)")"
          candidate="$(node -e "console.log(JSON.parse(require('fs').readFileSync('builder/working/autobot-specialist-handoff.json','utf8')).candidateCommit)")"
          test -n "$branch" && test -n "$candidate"
          git push --set-upstream origin "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --draft --title "AutoBot ${BOT} candidate" --body "Parallel specialist candidate ${candidate}. Isolated scope and product-quality checks passed; downstream QA/Reviewer required before integration." || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: autobot-specialist-${{ matrix.bot }}-${{ github.run_id }}
          path: |
            builder/working/autobot-specialist-handoff.json
            builder/working/autobot-specialist-outcome.json
            builder/working/autobot-specialist-failure.patch
            builder/working/autobot-review.json
          if-no-files-found: ignore

  repair-specialists:
    needs: [plan, specialists]
    if: ${{ always() && needs.plan.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        bot: [director-builder, timeline-builder]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.AUTOBOT_BASE_REF }}
          fetch-depth: 0
      - name: Download specialist result
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: autobot-specialist-${{ matrix.bot }}-${{ github.run_id }}
          path: builder/working/specialist-results/${{ matrix.bot }}
      - name: Classify repair route
        id: classify
        env:
          BOT: ${{ matrix.bot }}
        run: |
          set -euo pipefail
          repairable=false
          if [ -f builder/working/specialist-results/${BOT}/autobot-specialist-outcome.json ]; then
            repairable="$(node -e "const x=require('./builder/working/specialist-results/${BOT}/autobot-specialist-outcome.json'); console.log(x.repairable===true && x.category==='product-change' && x.status==='failure' ? 'true':'false')")"
          fi
          echo "repairable=$repairable" >> "$GITHUB_OUTPUT"
      - name: Install Aider engine
        if: steps.classify.outputs.repairable == 'true'
        run: python -m pip install --disable-pip-version-check --no-input aider-chat
      - name: Start local AI brain
        if: steps.classify.outputs.repairable == 'true'
        run: bash scripts/autobot/install-local-brain.sh
        env:
          LOCAL_AI_MODEL: ${{ env.LOCAL_AI_MODEL }}
          LOCAL_AI_PROXY_NUM_CTX: 4096
          LOCAL_AI_PROXY_NUM_PREDICT: 900
          OLLAMA_CONTEXT_LENGTH: 4096
          OLLAMA_NUM_PARALLEL: 1
          OLLAMA_MAX_QUEUE: 8
          OLLAMA_LOAD_TIMEOUT: 20m
          OLLAMA_KEEP_ALIVE: 30m
      - name: Start performance proxy
        if: steps.classify.outputs.repairable == 'true'
        run: |
          nohup node builder/runner/ollama-performance-proxy.mjs >/tmp/bikeztagram-ollama-proxy.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:11435/health >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:11435/health >/dev/null
      - name: Repair specialist failure
        if: steps.classify.outputs.repairable == 'true'
        env:
          AUTOBOT_AIDER_MODEL: ${{ env.LOCAL_AI_MODEL }}
          OLLAMA_API_BASE: http://127.0.0.1:11435
          OLLAMA_HOST: http://127.0.0.1:11435
        run: node builder/runner/autobot-specialist-recovery.mjs builder/working/specialist-results/${{ matrix.bot }}
      - name: Record no-repair route
        if: steps.classify.outputs.repairable != 'true'
        run: |
          mkdir -p builder/working
          node - <<'NODE'
          const fs=require('node:fs');
          fs.writeFileSync('builder/working/autobot-specialist-recovery-outcome.json',JSON.stringify({status:'not-routed',reason:'No repairable product failure was classified for this specialist.'},null,2)+'\n');
          NODE
      - name: Ensure recovery outcome artifact input exists
        if: always()
        env:
          BOT: ${{ matrix.bot }}
          OUTCOME: ${{ steps.classify.outputs.repairable }}
          REPAIR_OUTCOME: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p builder/working
          if [ ! -f builder/working/autobot-specialist-recovery-outcome.json ]; then
            node -e "const fs=require('node:fs'); const repairable=process.env.OUTCOME==='true'; const status=repairable?'failure':'not-routed'; const reason=repairable ? 'Specialist recovery runner ended before publishing its outcome (job status: '+process.env.REPAIR_OUTCOME+').' : 'No repairable product failure was classified for this specialist.'; fs.writeFileSync('builder/working/autobot-specialist-recovery-outcome.json',JSON.stringify({schemaVersion:'autobot-specialist-recovery-outcome-v1',botId:process.env.BOT,status,reason},null,2)+'\\n');"
          fi
      - name: Capture recovery diagnostics
        if: always()
        run: |
          echo '--- ollama ps ---'
          ollama ps || true
          echo '--- ollama server log ---'
          tail -n 160 /tmp/bikeztagram-ollama.log || true
          echo '--- performance proxy log ---'
          tail -n 160 /tmp/bikeztagram-ollama-proxy.log || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: autobot-specialist-recovery-${{ matrix.bot }}-${{ github.run_id }}
          path: |
            builder/working/autobot-fleet-recovery.json
            builder/working/autobot-failure-queue.jsonl
            builder/working/autobot-review.json
            builder/working/autobot-verified-candidate.json
            builder/working/autobot-repair-candidate.patch
            builder/working/autobot-repair-base-commit.txt
            builder/working/autobot-repair-commit.txt
            builder/working/autobot-specialist-recovery-outcome.json
          if-no-files-found: ignore


  verify-candidates:
    needs: [specialists, repair-specialists]
    if: ${{ always() && needs.specialists.result == 'success' && needs.repair-specialists.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        bot: [director-builder, timeline-builder]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.AUTOBOT_BASE_REF }}
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: autobot-specialist-${{ matrix.bot }}-${{ github.run_id }}
          path: builder/working/specialist-results/${{ matrix.bot }}
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: autobot-specialist-recovery-${{ matrix.bot }}-${{ github.run_id }}
          path: builder/working/specialist-results/${{ matrix.bot }}/recovery
      - name: Verify candidate independently
        env:
          BOT: ${{ matrix.bot }}
          AUTOBOT_SPECIALIST_RESULTS_ROOT: builder/working/specialist-results
          AUTOBOT_CANDIDATE_CHECK_OUTPUT: builder/working/autobot-candidate-check.json
        run: node builder/runner/autobot-endurance-candidate-check.mjs "$BOT"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: autobot-specialist-candidate-check-${{ matrix.bot }}-${{ github.run_id }}
          path: |
            builder/working/autobot-candidate-check.json
            builder/working/autobot-candidate-review.json
          if-no-files-found: ignore


  carry-forward:
    needs: [verify-candidates]
    if: ${{ needs.verify-candidates.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      cumulative_ref: ${{ steps.publish.outputs.cumulative_ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.AUTOBOT_BASE_REF }}
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: autobot-specialist-candidate-check-director-builder-${{ github.run_id }}
          path: builder/working/checks/director-builder
      - uses: actions/download-artifact@v7
        with:
          name: autobot-specialist-candidate-check-timeline-builder-${{ github.run_id }}
          path: builder/working/checks/timeline-builder
      - name: Integrate only independently verified candidates
        run: |
          set -euo pipefail
          git config user.name 'Bikeztagram AutoBot Carry Forward'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="autobot/carry-forward/$GITHUB_RUN_ID"
          git checkout -b "$branch"
          for bot in director-builder timeline-builder; do
            f="builder/working/checks/$bot/autobot-candidate-check.json"
            node -e "const x=require('./$f'); if(x.status!=='pass'||x.integrationEligible!==true) throw new Error('Candidate not integration eligible: '+x.status)"
            candidate="$(node -e "console.log(require('./$f').candidateCommit)")"
            candidate_branch="$(node -e "console.log(require('./$f').branch)")"
            test -n "$candidate" && test -n "$candidate_branch"
            git fetch origin "+refs/heads/$candidate_branch:refs/remotes/origin/$candidate_branch"
            fetched="$(git rev-parse "refs/remotes/origin/$candidate_branch")"
            test "$fetched" = "$candidate"
            git merge --no-edit --no-ff "origin/$candidate_branch"
          done
          npm install --no-audit --no-fund --no-package-lock
          npm run build
          npm run verify:autobot-product-change-quality
          git diff --check
          git push --set-upstream origin "$branch"
      - id: publish
        run: echo "cumulative_ref=autobot/carry-forward/$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"

  continue-cycle:
    needs: [carry-forward]
    if: ${{ needs.carry-forward.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Continue cumulative AutoBot cycle
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ needs.carry-forward.outputs.cumulative_ref }}
          TOTAL_DURATION: ${{ env.AUTOBOT_TOTAL_DURATION }}
          DEADLINE: ${{ env.AUTOBOT_RUN_DEADLINE_EPOCH_MS }}
          RUN_STARTED_AT: ${{ env.AUTOBOT_RUN_STARTED_AT }}
          CYCLE_NUMBER: ${{ env.AUTOBOT_CYCLE_NUMBER }}
          CYCLE_MINUTES: ${{ env.AUTOBOT_CYCLE_MINUTES }}
          LOCAL_MODEL: ${{ env.LOCAL_AI_MODEL }}
        run: |
          set -euo pipefail
          now_ms="$(date +%s000)"
          total_minutes="$(case "$TOTAL_DURATION" in 15m) echo 15;; 30m) echo 30;; 1h) echo 60;; 4h) echo 240;; 5h) echo 300;; *) echo 0;; esac)"
          if [ "$total_minutes" -le 0 ]; then echo "[autobot] invalid total duration: $TOTAL_DURATION"; exit 1; fi
          if [ -z "$DEADLINE" ]; then
            run_started_at="$RUN_STARTED_AT"
            if [ -z "$run_started_at" ]; then run_started_at="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)"; fi
            start_ms="$(date -d "$run_started_at" +%s000)"
            deadline_ms="$((start_ms + total_minutes * 60 * 1000))"
          else
            deadline_ms="$DEADLINE"
          fi
          remaining_ms="$((deadline_ms - now_ms))"
          safety_ms="$((60 * 1000))"
          available_ms="$((remaining_ms - safety_ms))"
          next_cycle_minutes="$((available_ms / (60 * 1000)))"
          if [ "$next_cycle_minutes" -lt 1 ]; then echo "[autobot] cumulative deadline reached; no new cycle will start (remaining_ms=$remaining_ms)"; exit 0; fi
          if [ "$next_cycle_minutes" -gt "$CYCLE_MINUTES" ]; then next_cycle_minutes="$CYCLE_MINUTES"; fi
          next_cycle="$((CYCLE_NUMBER + 1))"
          export DEADLINE_FALLBACK="$deadline_ms" NEXT_CYCLE="$next_cycle" NEXT_CYCLE_MINUTES="$next_cycle_minutes"
          payload="$(node -e 'const p={event_type:"autobot-cycle",client_payload:{base_ref:process.env.BASE_REF,total_duration:process.env.TOTAL_DURATION,run_deadline_epoch_ms:process.env.DEADLINE||process.env.DEADLINE_FALLBACK,cycle_number:process.env.NEXT_CYCLE,cycle_minutes:process.env.NEXT_CYCLE_MINUTES,local_model:process.env.LOCAL_MODEL}}; console.log(JSON.stringify(p))')"
          curl --fail --silent --show-error -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2026-03-10" "https://api.github.com/repos/$GITHUB_REPOSITORY/dispatches" -d "$payload"
          echo "[autobot] dispatched cumulative cycle $next_cycle from $BASE_REF with deadline $deadline_ms"

  completed-work:
    needs: [plan, specialists, repair-specialists]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.AUTOBOT_BASE_REF }}
          fetch-depth: 0
      - name: Download Director specialist result
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: autobot-specialist-director-builder-${{ github.run_id }}
          path: builder/working/specialist-results/director-builder
      - name: Download Timeline specialist result
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: autobot-specialist-timeline-builder-${{ github.run_id }}
          path: builder/working/specialist-results/timeline-builder
      - name: Download Director recovery result
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: autobot-specialist-recovery-director-builder-${{ github.run_id }}
          path: builder/working/specialist-results/director-builder/recovery
      - name: Download Timeline recovery result
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: autobot-specialist-recovery-timeline-builder-${{ github.run_id }}
          path: builder/working/specialist-results/timeline-builder/recovery
      - name: Verify completed-work inbox contract
        run: node scripts/autobot/verify-autobot-completed-work.mjs
      - name: Build central completed-work manifest
        run: node builder/runner/autobot-completed-work.mjs
      - name: Publish central completed-work manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autobot-completed-work-${{ github.run_id }}
          path: builder/working/autobot-completed-work.json
          if-no-files-found: ignore
