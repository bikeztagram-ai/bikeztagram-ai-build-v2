          BUILDER_MAX_MINUTES: ${{ inputs.duration == '15m' && '15' || inputs.duration == '30m' && '30' || inputs.duration == '1h' && '60' || inputs.duration == '4h' && '60' || '60' }}
          AUTOBOT_COORDINATION_ID: persistent-${{ github.run_id }}
        run: node builder/runner/autobot-specialist-builder.mjs

      - name: Publish Music candidate branch
        if: steps.execute.outcome == 'success'
        run: |
          b="$(node -e "console.log(require('./builder/working/autobot-specialist-handoff.json').branch)")"
          git push --set-upstream origin "$b"

      - name: Upload Music worker evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autobot-persistent-experimental-music-${{ github.run_id }}
          path: |
