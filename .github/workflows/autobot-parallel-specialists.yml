name: 🧩 AutoBot Persistent Specialists

on:
  workflow_dispatch:
    inputs:
      duration:
        description: Total AutoBot run budget (cycles continue inside this run)
        required: true
        default: 15m
        type: choice
        options: ['15m','30m','1h','4h','5h','5h30']
      local_model:
        description: Local discovery/coding model
        required: false
        default: qwen2.5-coder:7b
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: autobot-persistent-specialists
  cancel-in-progress: false

env:
  LOCAL_AI_MODEL: ${{ inputs.local_model }}
  AUTOBOT_DISCOVERY_MODEL: qwen2.5-coder:3b
  AUTOBOT_DISCOVERY_TIMEOUT_MS: 180000
  AUTOBOT_PARALLEL_BOTS: director-builder,timeline-builder,music-builder,scene-builder,rhythm-builder,render-builder,media-intelligence-builder,caption-builder,intent-builder,continuity-builder
  AUTOBOT_TOTAL_DURATION: ${{ inputs.duration }}
  AUTOBOT_CYCLE_MINUTES: ${{ inputs.duration == '15m' && '10' || inputs.duration == '30m' && '15' || '30' }}
  AUTOBOT_FINISH_GRACE_MINUTES: ${{ (inputs.duration == '1h' || inputs.duration == '4h' || inputs.duration == '5h' || inputs.duration == '5h30') && '15' || '0' }}
  AUTOBOT_CYCLE_SAFETY_MINUTES: '1'
  # One persistent lane keeps this runtime alive while it cycles through verified objectives.
  AUTOBOT_LANE_CYCLE_MINUTES: '10'
  AUTOBOT_OPPORTUNITY_TIMEOUT_MS: '45000'
  AUTOBOT_LANE_MAX_NO_PROGRESS_CYCLES: '2'
  AUTOBOT_SPECIALIST_FALLBACK_MODEL: qwen2.5-coder:3b
  AUTOBOT_SPECIALIST_FALLBACK_MINUTES: '4'
  AUTOBOT_REPAIR_TIMEOUT_MS: '480000'
  AUTOBOT_MAX_NO_PROGRESS_CYCLES: '2'

jobs:
  # TEN INDEPENDENT PERSISTENT PRODUCTION LANES — each specialist owns one disjoint product file and one GitHub job/runner. The lane bootstraps Node/Python/Aider/Ollama once, then carries verified candidate SHAs through repeated Builder -> QA/Reviewer cycles without waiting for another specialist. The final fan-in is evidence/telemetry only and never gates another lane's productive work.
  # DIRECTOR — fully isolated production specialist. Its runner/worktree/Aider
  # stack is independent of every other specialist.
  experimental-director:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Record specialist job start
        run: echo "AUTOBOT_JOB_STARTED_AT_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Director lane dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Install Director lane Aider
        run: python -m pip install --disable-pip-version-check --no-input aider-chat
      - name: Start isolated Director AI brain
        run: bash scripts/autobot/install-local-brain.sh
        env:
          LOCAL_AI_MODEL: ${{ env.LOCAL_AI_MODEL }}
          AUTOBOT_DISCOVERY_MODEL: ${{ env.AUTOBOT_DISCOVERY_MODEL }}
          AUTOBOT_SPECIALIST_FALLBACK_MODEL: ${{ env.AUTOBOT_SPECIALIST_FALLBACK_MODEL }}
          LOCAL_AI_PROXY_NUM_CTX: 4096
          LOCAL_AI_PROXY_NUM_PREDICT: 900
          OLLAMA_CONTEXT_LENGTH: 4096
          OLLAMA_NUM_PARALLEL: 1
          OLLAMA_MAX_QUEUE: 4
          OLLAMA_LOAD_TIMEOUT: 20m
          OLLAMA_KEEP_ALIVE: 24h
      - name: Run Director specialist
        id: execute
        env:
          AUTOBOT_SPECIALIST_BOT_ID: director-builder
          AUTOBOT_SPECIALIST_EDIT_STRATEGY: whole-src-single
          AUTOBOT_SPECIALIST_OBJECTIVE: "Production Director lane: autonomously invent and implement new cinematic-directing capabilities that expand Bikeztagram's story construction, creative direction or shot selection. Preserve existing APIs and contracts. Acceptance:
- shot selection responds to creative intent while preserving evidence scoring and diversity
- only the owned file is changed
- syntax, build and product-quality verification pass
- leave a candidate when valid."
          AUTOBOT_SPECIALIST_BUILDER_ENABLED: 'true'
          AUTOBOT_EXPERIMENTAL_WORKER: 'false'
          AUTOBOT_BASE_REF: ${{ github.sha }}
          AUTOBOT_AIDER_MODEL: ${{ env.LOCAL_AI_MODEL }}
          AUTOBOT_SPECIALIST_PRODUCT_QUALITY_CHECK: npm run verify:autobot-product-change-quality
          AUTOBOT_SPECIALIST_FALLBACK_MODEL: ${{ env.AUTOBOT_SPECIALIST_FALLBACK_MODEL }}
          AUTOBOT_SPECIALIST_FALLBACK_MINUTES: '4'
          AUTOBOT_FINISH_GRACE_MINUTES: ${{ (inputs.duration == '1h' || inputs.duration == '4h' || inputs.duration == '5h' || inputs.duration == '5h30') && '15' || '0' }}
          AUTOBOT_SKIP_NPM_INSTALL: 'true'
          BUILDER_MAX_MINUTES: ${{ inputs.duration == '15m' && '15' || inputs.duration == '30m' && '30' || inputs.duration == '1h' && '60' || inputs.duration == '4h' && '240' || inputs.duration == '5h' && '300' || '330' }}
          AUTOBOT_COORDINATION_ID: persistent-${{ github.run_id }}
        run: node builder/runner/autobot-independent-specialist-lane.mjs
      - name: Validate Director final lane evidence
        if: steps.execute.outcome == 'success'
        run: |
          set -euo pipefail
          test -s builder/working/autobot-independent-specialist-lane.json
          test -s builder/working/autobot-specialist-handoff.json
          test -s builder/working/autobot-specialist-outcome.json
          test -s builder/working/specialist-results/director-builder/autobot-endurance-candidate-check.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const state=JSON.parse(fs.readFileSync('builder/working/autobot-independent-specialist-lane.json','utf8'));
          const outcome=JSON.parse(fs.readFileSync('builder/working/autobot-specialist-outcome.json','utf8'));
          const qa=JSON.parse(fs.readFileSync('builder/working/specialist-results/director-builder/autobot-endurance-candidate-check.json','utf8'));
          if(!Array.isArray(state.verifiedCandidates)||state.verifiedCandidates.length<1) throw new Error('persistent lane ended without a verified candidate');
          if(outcome.status!=='success'||qa.status!=='pass'||qa.integrationEligible!==true) throw new Error('final lane evidence is not an independently verified candidate');
          console.log(JSON.stringify({status:state.status,cycles:state.cycle,verifiedCandidates:state.verifiedCandidates.length,currentBase:state.currentBase,qaStatus:qa.status}));
          NODE

      - name: Upload Director worker evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: autobot-persistent-experimental-director-${{ github.run_id }}
          path: |
            builder/working/autobot-specialist-handoff.json
            builder/working/autobot-specialist-outcome.json
            builder/working/autobot-specialist-failure.patch
            builder/working/autobot-independent-specialist-lane.json
            builder/working/specialist-results/director-builder/autobot-endurance-candidate-check.json
            builder/working/specialist-results/director-builder/autobot-candidate-review-director-builder.json
          if-no-files-found: ignore

