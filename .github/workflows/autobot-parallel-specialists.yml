name: 🧩 AutoBot Persistent Specialists

on:
  workflow_dispatch:
    inputs:
      duration:
        description: Total AutoBot run budget (cycles continue inside this run)
        required: true
        default: 15m
        type: choice
        options: ['15m','30m','1h','4h','5h','5h30']
      local_model:
        description: Local discovery/coding model
        required: false
        default: qwen2.5-coder:7b
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: autobot-persistent-specialists
  cancel-in-progress: false

env:
  LOCAL_AI_MODEL: ${{ inputs.local_model }}
  AUTOBOT_DISCOVERY_MODEL: qwen2.5-coder:3b
  AUTOBOT_DISCOVERY_TIMEOUT_MS: 180000
  AUTOBOT_PARALLEL_BOTS: director-builder,timeline-builder
  AUTOBOT_TOTAL_DURATION: ${{ inputs.duration }}
  AUTOBOT_CYCLE_MINUTES: ${{ inputs.duration == '15m' && '10' || inputs.duration == '30m' && '15' || '30' }}
  AUTOBOT_FINISH_GRACE_MINUTES: ${{ (inputs.duration == '1h' || inputs.duration == '4h' || inputs.duration == '5h' || inputs.duration == '5h30') && '15' || '0' }}
  AUTOBOT_CYCLE_SAFETY_MINUTES: '1'
  AUTOBOT_SPECIALIST_FALLBACK_MODEL: qwen2.5-coder:3b
  AUTOBOT_SPECIALIST_FALLBACK_MINUTES: '4'
  AUTOBOT_REPAIR_TIMEOUT_MS: '480000'
  AUTOBOT_MAX_NO_PROGRESS_CYCLES: '2'

jobs:
  # PRODUCTION LANE — unchanged. The proven Director + Timeline engine owns
  # its own fan-out, recovery, QA and protected integration lifecycle.
  persistent-autobot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies once
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Install Aider engine once
        run: python -m pip install --disable-pip-version-check --no-input aider-chat

      - name: Start local AI brain once
        run: bash scripts/autobot/install-local-brain.sh
        env:
          LOCAL_AI_MODEL: ${{ env.LOCAL_AI_MODEL }}
          AUTOBOT_DISCOVERY_MODEL: ${{ env.AUTOBOT_DISCOVERY_MODEL }}
          AUTOBOT_SPECIALIST_FALLBACK_MODEL: ${{ env.AUTOBOT_SPECIALIST_FALLBACK_MODEL }}
          LOCAL_AI_PROXY_NUM_CTX: 4096
          LOCAL_AI_PROXY_NUM_PREDICT: 900
          OLLAMA_CONTEXT_LENGTH: 4096
          OLLAMA_NUM_PARALLEL: 1
          OLLAMA_MAX_QUEUE: 8
          OLLAMA_LOAD_TIMEOUT: 20m
          OLLAMA_KEEP_ALIVE: 6h

      - name: Start performance proxy once
        run: |
          nohup node builder/runner/ollama-performance-proxy.mjs >/tmp/bikeztagram-ollama-proxy.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11435/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:11435/health >/dev/null
          echo 'OLLAMA_HOST=http://127.0.0.1:11435' >> "$GITHUB_ENV"

      - name: Run deep AutoBot contract audit
        run: node scripts/autobot/verify-autobot-persistent-cycle.mjs

      - name: Run R&D contract audit
        run: npm run verify:autobot-rnd

      - name: Verify planner model once
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 120 \
            http://127.0.0.1:11435/api/chat \
            -H 'Content-Type: application/json' \
            -d "{\"model\":\"${AUTOBOT_DISCOVERY_MODEL}\",\"stream\":false,\"messages\":[{\"role\":\"user\",\"content\":\"Reply with READY only.\"}],\"options\":{\"num_ctx\":2048,\"num_predict\":16}}" \
            >/tmp/bikeztagram-planner-smoke.json
          node -e "const x=require('/tmp/bikeztagram-planner-smoke.json'); if(!x.message?.content && !x.response) process.exit(1); console.log('[autobot] planner model smoke test passed')"

      - name: Anchor cumulative deadline
        run: echo "AUTOBOT_RUN_STARTED_EPOCH_MS=$(date +%s000)" >> "$GITHUB_ENV"

      - name: Initialize AutoBot Mission Control
        run: |
          node builder/runner/autobot-live-dashboard.mjs
        env:
          AUTOBOT_DASHBOARD_STAGE: "SETUP COMPLETE"
          AUTOBOT_DASHBOARD_MESSAGE: "Dependencies, Aider, local AI brain, performance proxy, contract audits and planner smoke test are complete. The persistent two-worker engine is next; four isolated product specialists fan out alongside it."

      - name: Run persistent AutoBot engine
        env:
          AUTOBOT_BASE_REF: ${{ github.sha }}
          AUTOBOT_SKIP_NPM_INSTALL: 'true'
        run: node builder/runner/autobot-persistent-cycle-engine.mjs

      - name: Capture persistent runtime evidence
        if: always()
        run: |
          echo '--- persistent runtime state ---'
          cat builder/working/persistent-runtime-state.json 2>/dev/null || true
          echo '--- AutoBot live status ---'
          cat builder/working/autobot-live-status.log 2>/dev/null || true
          echo '--- Ollama processes ---'
          OLLAMA_HOST=127.0.0.1:11434 ollama ps || true
          echo '--- Ollama server log ---'
          if [ -f /tmp/bikeztagram-ollama.log ]; then tail -n 200 /tmp/bikeztagram-ollama.log; else echo 'Ollama is using an existing service; no local server log file was created.'; fi
          echo '--- performance proxy log ---'
          tail -n 200 /tmp/bikeztagram-ollama-proxy.log || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: autobot-persistent-runtime-${{ github.run_id }}
          path: |
            builder/working/persistent-runtime-state.json
            builder/working/autobot-live-status.log
            builder/working/autobot-final-handoff.json
            builder/working/autobot-rnd-brief.json
            builder/working/persistent/**
          if-no-files-found: ignore

  # EXPERIMENTAL FAN-OUT — these are separate GitHub jobs/runners. Each job
  # owns its own Aider process, local model server and worktree, so neither
  # experimental lane can share state with or block the production lane. Music,
  # Scene, Rhythm and Render each own one disjoint product file and one isolated
  # runner/worktree/Aider/local-AI stack.
  experimental-music:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Music lane dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Install Music lane Aider
        run: python -m pip install --disable-pip-version-check --no-input aider-chat

      - name: Start isolated Music AI brain
        run: bash scripts/autobot/install-local-brain.sh
        env:
          LOCAL_AI_MODEL: ${{ env.LOCAL_AI_MODEL }}
          AUTOBOT_DISCOVERY_MODEL: ${{ env.AUTOBOT_DISCOVERY_MODEL }}
          AUTOBOT_SPECIALIST_FALLBACK_MODEL: ${{ env.AUTOBOT_SPECIALIST_FALLBACK_MODEL }}
          LOCAL_AI_PROXY_NUM_CTX: 4096
          LOCAL_AI_PROXY_NUM_PREDICT: 900
          OLLAMA_CONTEXT_LENGTH: 4096
          OLLAMA_NUM_PARALLEL: 1
          OLLAMA_MAX_QUEUE: 4
          OLLAMA_LOAD_TIMEOUT: 20m
          OLLAMA_KEEP_ALIVE: 90m

      - name: Run Music specialist
        id: execute
        env:
          AUTOBOT_SPECIALIST_BOT_ID: music-builder
          AUTOBOT_SPECIALIST_OBJECTIVE: "Experimental Music lane: improve prompt-responsive music energy in src/musicDirector.js with one minimal, production-safe change. Preserve existing APIs and contracts. Acceptance:
- energy responds to driving/fast/action creative intent
- only the owned file is changed
- syntax, build and product-quality verification pass
- leave a candidate when valid."
          AUTOBOT_SPECIALIST_BUILDER_ENABLED: 'true'
          AUTOBOT_EXPERIMENTAL_WORKER: 'true'
          AUTOBOT_BASE_REF: ${{ github.sha }}
          AUTOBOT_AIDER_MODEL: ${{ env.LOCAL_AI_MODEL }}
          AUTOBOT_SPECIALIST_PRODUCT_QUALITY_CHECK: npm run verify:autobot-product-change-quality
          AUTOBOT_SPECIALIST_FALLBACK_MODEL: ${{ env.AUTOBOT_SPECIALIST_FALLBACK_MODEL }}
          AUTOBOT_SPECIALIST_FALLBACK_MINUTES: '4'
          AUTOBOT_FINISH_GRACE_MINUTES: '0'
          AUTOBOT_SKIP_NPM_INSTALL: 'true'
          BUILDER_MAX_MINUTES: ${{ inputs.duration == '15m' && '15' || inputs.duration == '30m' && '30' || inputs.duration == '1h' && '60' || inputs.duration == '4h' && '60' || '60' }}
          AUTOBOT_COORDINATION_ID: persistent-${{ github.run_id }}
        run: node builder/runner/autobot-specialist-builder.mjs

      - name: Publish Music candidate branch
        if: steps.execute.outcome == 'success'
        run: |
          b="$(node -e "console.log(require('./builder/working/autobot-specialist-handoff.json').branch)")"
          git push --set-upstream origin "$b"

      - name: Upload Music worker evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autobot-persistent-experimental-music-${{ github.run_id }}
          path: |
            builder/working/autobot-specialist-handoff.json
            builder/working/autobot-specialist-outcome.json
            builder/working/autobot-specialist-failure.patch
          if-no-files-found: ignore

  experimental-scene:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Scene lane dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Install Scene lane Aider
        run: python -m pip install --disable-pip-version-check --no-input aider-chat

      - name: Start isolated Scene AI brain
        run: bash scripts/autobot/install-local-brain.sh
        env:
          LOCAL_AI_MODEL: ${{ env.LOCAL_AI_MODEL }}
          AUTOBOT_DISCOVERY_MODEL: ${{ env.AUTOBOT_DISCOVERY_MODEL }}
          AUTOBOT_SPECIALIST_FALLBACK_MODEL: ${{ env.AUTOBOT_SPECIALIST_FALLBACK_MODEL }}
          LOCAL_AI_PROXY_NUM_CTX: 4096
          LOCAL_AI_PROXY_NUM_PREDICT: 900
          OLLAMA_CONTEXT_LENGTH: 4096
          OLLAMA_NUM_PARALLEL: 1
          OLLAMA_MAX_QUEUE: 4
          OLLAMA_LOAD_TIMEOUT: 20m
          OLLAMA_KEEP_ALIVE: 90m

      - name: Run Scene specialist
        id: execute
        env:
          AUTOBOT_SPECIALIST_BOT_ID: scene-builder
          AUTOBOT_SPECIALIST_OBJECTIVE: "Experimental Scene lane: improve duration-bounded scene shot continuity in src/universalCreativeSceneEngine.js with one minimal, production-safe change. Preserve existing APIs and contracts. Acceptance:
- scene shot count remains bounded and scales with duration
- only the owned file is changed
- syntax, build and product-quality verification pass
- leave a candidate when valid."
          AUTOBOT_SPECIALIST_BUILDER_ENABLED: 'true'
          AUTOBOT_EXPERIMENTAL_WORKER: 'true'
          AUTOBOT_BASE_REF: ${{ github.sha }}
          AUTOBOT_AIDER_MODEL: ${{ env.LOCAL_AI_MODEL }}
          AUTOBOT_SPECIALIST_PRODUCT_QUALITY_CHECK: npm run verify:autobot-product-change-quality
          AUTOBOT_SPECIALIST_FALLBACK_MODEL: ${{ env.AUTOBOT_SPECIALIST_FALLBACK_MODEL }}
          AUTOBOT_SPECIALIST_FALLBACK_MINUTES: '4'
          AUTOBOT_FINISH_GRACE_MINUTES: '0'
          AUTOBOT_SKIP_NPM_INSTALL: 'true'
          BUILDER_MAX_MINUTES: ${{ inputs.duration == '15m' && '15' || inputs.duration == '30m' && '30' || inputs.duration == '1h' && '60' || inputs.duration == '4h' && '60' || '60' }}
          AUTOBOT_COORDINATION_ID: persistent-${{ github.run_id }}
        run: node builder/runner/autobot-specialist-builder.mjs

      - name: Publish Scene candidate branch
        if: steps.execute.outcome == 'success'
        run: |
          b="$(node -e "console.log(require('./builder/working/autobot-specialist-handoff.json').branch)")"
          git push --set-upstream origin "$b"

      - name: Upload Scene worker evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autobot-persistent-experimental-scene-${{ github.run_id }}
          path: |
            builder/working/autobot-specialist-handoff.json
            builder/working/autobot-specialist-outcome.json
            builder/working/autobot-specialist-failure.patch
          if-no-files-found: ignore

  experimental-rhythm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rhythm lane dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Install Rhythm lane Aider
        run: python -m pip install --disable-pip-version-check --no-input aider-chat

      - name: Start isolated Rhythm AI brain
        run: bash scripts/autobot/install-local-brain.sh
        env:
          LOCAL_AI_MODEL: ${{ env.LOCAL_AI_MODEL }}
          AUTOBOT_DISCOVERY_MODEL: ${{ env.AUTOBOT_DISCOVERY_MODEL }}
          AUTOBOT_SPECIALIST_FALLBACK_MODEL: ${{ env.AUTOBOT_SPECIALIST_FALLBACK_MODEL }}
          LOCAL_AI_PROXY_NUM_CTX: 4096
          LOCAL_AI_PROXY_NUM_PREDICT: 900
          OLLAMA_CONTEXT_LENGTH: 4096
          OLLAMA_NUM_PARALLEL: 1
          OLLAMA_MAX_QUEUE: 4
          OLLAMA_LOAD_TIMEOUT: 20m
          OLLAMA_KEEP_ALIVE: 90m

      - name: Run Rhythm specialist
        id: execute
        env:
          AUTOBOT_SPECIALIST_BOT_ID: rhythm-builder
          AUTOBOT_SPECIALIST_OBJECTIVE: "Production Rhythm lane: improve beat-aware editorial pacing and duration distribution in src/editorialRhythm.js with one minimal, production-safe change. Preserve existing APIs and contracts. Acceptance:
- pacing responds to creative intent without exceeding duration bounds
- only the owned file is changed
- syntax, build and product-quality verification pass
- leave a candidate when valid."
          AUTOBOT_SPECIALIST_BUILDER_ENABLED: 'true'
          AUTOBOT_EXPERIMENTAL_WORKER: 'true'
          AUTOBOT_BASE_REF: ${{ github.sha }}
          AUTOBOT_AIDER_MODEL: ${{ env.LOCAL_AI_MODEL }}
          AUTOBOT_SPECIALIST_PRODUCT_QUALITY_CHECK: npm run verify:autobot-product-change-quality
          AUTOBOT_SPECIALIST_FALLBACK_MODEL: ${{ env.AUTOBOT_SPECIALIST_FALLBACK_MODEL }}
          AUTOBOT_SPECIALIST_FALLBACK_MINUTES: '4'
          AUTOBOT_FINISH_GRACE_MINUTES: '0'
          AUTOBOT_SKIP_NPM_INSTALL: 'true'
          BUILDER_MAX_MINUTES: ${{ inputs.duration == '15m' && '15' || inputs.duration == '30m' && '30' || inputs.duration == '1h' && '60' || inputs.duration == '4h' && '60' || '60' }}
          AUTOBOT_COORDINATION_ID: persistent-${{ github.run_id }}
        run: node builder/runner/autobot-specialist-builder.mjs

      - name: Publish Rhythm candidate branch
        if: steps.execute.outcome == 'success'
        run: |
          b="$(node -e "console.log(require('./builder/working/autobot-specialist-handoff.json').branch)")"
          git push --set-upstream origin "$b"

      - name: Upload Rhythm worker evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autobot-persistent-experimental-rhythm-${{ github.run_id }}
          path: |
            builder/working/autobot-specialist-handoff.json
            builder/working/autobot-specialist-outcome.json
            builder/working/autobot-specialist-failure.patch
          if-no-files-found: ignore

  experimental-render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Render lane dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Install Render lane Aider
        run: python -m pip install --disable-pip-version-check --no-input aider-chat

      - name: Start isolated Render AI brain
        run: bash scripts/autobot/install-local-brain.sh
        env:
          LOCAL_AI_MODEL: ${{ env.LOCAL_AI_MODEL }}
          AUTOBOT_DISCOVERY_MODEL: ${{ env.AUTOBOT_DISCOVERY_MODEL }}
          AUTOBOT_SPECIALIST_FALLBACK_MODEL: ${{ env.AUTOBOT_SPECIALIST_FALLBACK_MODEL }}
          LOCAL_AI_PROXY_NUM_CTX: 4096
          LOCAL_AI_PROXY_NUM_PREDICT: 900
          OLLAMA_CONTEXT_LENGTH: 4096
          OLLAMA_NUM_PARALLEL: 1
          OLLAMA_MAX_QUEUE: 4
          OLLAMA_LOAD_TIMEOUT: 20m
          OLLAMA_KEEP_ALIVE: 90m

      - name: Run Render specialist
        id: execute
        env:
          AUTOBOT_SPECIALIST_BOT_ID: render-builder
          AUTOBOT_SPECIALIST_OBJECTIVE: "Production Render lane: improve visible cinematic motion, transitions or finishing in src/cinematicRendererV3.js with one minimal, production-safe change. Preserve source decoding, recording and existing renderer APIs. Acceptance:
- the change improves a visible cinematic behavior without destabilizing render reliability
- only the owned file is changed
- syntax, build and product-quality verification pass
- leave a candidate when valid."
          AUTOBOT_SPECIALIST_BUILDER_ENABLED: 'true'
          AUTOBOT_EXPERIMENTAL_WORKER: 'true'
          AUTOBOT_BASE_REF: ${{ github.sha }}
          AUTOBOT_AIDER_MODEL: ${{ env.LOCAL_AI_MODEL }}
          AUTOBOT_SPECIALIST_PRODUCT_QUALITY_CHECK: npm run verify:autobot-product-change-quality
          AUTOBOT_SPECIALIST_FALLBACK_MODEL: ${{ env.AUTOBOT_SPECIALIST_FALLBACK_MODEL }}
          AUTOBOT_SPECIALIST_FALLBACK_MINUTES: '4'
          AUTOBOT_FINISH_GRACE_MINUTES: '0'
          AUTOBOT_SKIP_NPM_INSTALL: 'true'
          BUILDER_MAX_MINUTES: ${{ inputs.duration == '15m' && '15' || inputs.duration == '30m' && '30' || inputs.duration == '1h' && '60' || inputs.duration == '4h' && '60' || '60' }}
          AUTOBOT_COORDINATION_ID: persistent-${{ github.run_id }}
        run: node builder/runner/autobot-specialist-builder.mjs

      - name: Publish Render candidate branch
        if: steps.execute.outcome == 'success'
        run: |
          b="$(node -e "console.log(require('./builder/working/autobot-specialist-handoff.json').branch)")"
          git push --set-upstream origin "$b"

      - name: Upload Render worker evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autobot-persistent-experimental-render-${{ github.run_id }}
          path: |
            builder/working/autobot-specialist-handoff.json
            builder/working/autobot-specialist-outcome.json
            builder/working/autobot-specialist-failure.patch
          if-no-files-found: ignore

  # FAN-IN — records all four isolated specialist lanes into the same
  # coordination ledger. It never merges product code and never gates the
  # production persistent-autobot job.
  experimental-fan-in:
    needs: [experimental-music, experimental-scene, experimental-rhythm, experimental-render]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Music evidence
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: autobot-persistent-experimental-music-${{ github.run_id }}
          path: builder/working/experimental/music

      - name: Download Scene evidence
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: autobot-persistent-experimental-scene-${{ github.run_id }}
          path: builder/working/experimental/scene

      - name: Download Rhythm evidence
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: autobot-persistent-experimental-rhythm-${{ github.run_id }}
          path: builder/working/experimental/rhythm

      - name: Download Render evidence
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: autobot-persistent-experimental-render-${{ github.run_id }}
          path: builder/working/experimental/render

      - name: Build canonical fan-in ledger
        env:
          COORDINATION_ID: persistent-${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p builder/working/fan-in
          for bot in music scene rhythm render; do
            dir="builder/working/experimental/$bot"
            handoff="$(find "$dir" -name autobot-specialist-handoff.json -print -quit 2>/dev/null || true)"
            outcome="$(find "$dir" -name autobot-specialist-outcome.json -print -quit 2>/dev/null || true)"
            if [ -z "$handoff" ] && [ -z "$outcome" ]; then
              cat > "$dir/autobot-specialist-outcome.json" <<EOF
          {
            "botId": "${bot}-builder",
            "status": "failure",
            "category": "workflow-failure",
            "repairable": true,
            "coordinationId": "$COORDINATION_ID",
            "error": "No worker evidence artifact was produced."
          }
          EOF
              outcome="$dir/autobot-specialist-outcome.json"
            fi
            if [ -n "$handoff" ]; then
              node builder/runner/autobot-independent-fan-in.mjs \
                --coordination-id "$COORDINATION_ID" \
                --handoff "$handoff" \
                --outcome "$outcome" \
                --ledger builder/working/fan-in/autobot-fan-in-ledger.json
            else
              node builder/runner/autobot-independent-fan-in.mjs \
                --coordination-id "$COORDINATION_ID" \
                --outcome "$outcome" \
                --ledger builder/working/fan-in/autobot-fan-in-ledger.json
            fi
          done
          cat builder/working/fan-in/autobot-fan-in-ledger.json

      - name: Upload unified experimental fan-in evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autobot-persistent-experimental-fan-in-${{ github.run_id }}
          path: builder/working/fan-in/autobot-fan-in-ledger.json
          if-no-files-found: ignore
