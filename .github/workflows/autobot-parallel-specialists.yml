          AUTOBOT_EXPERIMENTAL_WORKER: 'false'
          AUTOBOT_BASE_REF: ${{ github.sha }}
          AUTOBOT_AIDER_MODEL: ${{ env.LOCAL_AI_MODEL }}
          AUTOBOT_SPECIALIST_PRODUCT_QUALITY_CHECK: npm run verify:autobot-product-change-quality
          AUTOBOT_SPECIALIST_FALLBACK_MODEL: ${{ env.AUTOBOT_SPECIALIST_FALLBACK_MODEL }}
          AUTOBOT_SPECIALIST_FALLBACK_MINUTES: '4'
          AUTOBOT_FINISH_GRACE_MINUTES: ${{ (inputs.duration == '1h' || inputs.duration == '4h' || inputs.duration == '5h' || inputs.duration == '5h30') && '15' || '0' }}
          AUTOBOT_SKIP_NPM_INSTALL: 'true'
          BUILDER_MAX_MINUTES: ${{ inputs.duration == '15m' && '15' || inputs.duration == '30m' && '30' || inputs.duration == '1h' && '60' || inputs.duration == '4h' && '240' || inputs.duration == '5h' && '300' || '330' }}
          AUTOBOT_COORDINATION_ID: persistent-${{ github.run_id }}
        run: node builder/runner/autobot-independent-specialist-lane.mjs
      - name: Validate Continuity final lane evidence
        if: steps.execute.outcome == 'success'
        run: |
          set -euo pipefail
          test -s builder/working/autobot-independent-specialist-lane.json
          test -s builder/working/autobot-specialist-handoff.json
          test -s builder/working/autobot-specialist-outcome.json
          test -s builder/working/specialist-results/continuity-builder/autobot-endurance-candidate-check.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const state=JSON.parse(fs.readFileSync('builder/working/autobot-independent-specialist-lane.json','utf8'));
          const outcome=JSON.parse(fs.readFileSync('builder/working/autobot-specialist-outcome.json','utf8'));
          const qa=JSON.parse(fs.readFileSync('builder/working/specialist-results/continuity-builder/autobot-endurance-candidate-check.json','utf8'));
          if(!Array.isArray(state.verifiedCandidates)||state.verifiedCandidates.length<1) throw new Error('persistent lane ended without a verified candidate');
          if(outcome.status!=='success'||qa.status!=='pass'||qa.integrationEligible!==true) throw new Error('final lane evidence is not an independently verified candidate');
          console.log(JSON.stringify({status:state.status,cycles:state.cycle,verifiedCandidates:state.verifiedCandidates.length,currentBase:state.currentBase,qaStatus:qa.status}));
          NODE

      - name: Upload Continuity worker evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: autobot-persistent-experimental-continuity-${{ github.run_id }}
          path: |
            builder/working/autobot-specialist-handoff.json
            builder/working/autobot-specialist-outcome.json
            builder/working/autobot-specialist-failure.patch
            builder/working/autobot-independent-specialist-lane.json
            builder/working/specialist-results/continuity-builder/autobot-endurance-candidate-check.json
            builder/working/specialist-results/continuity-builder/autobot-candidate-review-continuity-builder.json
          if-no-files-found: ignore

  # FAN-IN — records all ten isolated specialist lanes into the same
  # coordination ledger. It never merges product code and never gates the
  # production persistent-autobot job.

  experimental-fan-in:
    needs: [experimental-director, experimental-timeline, experimental-music, experimental-scene, experimental-rhythm, experimental-render, experimental-media-intelligence, experimental-caption, experimental-intent, experimental-continuity]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download Director evidence
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: autobot-persistent-experimental-director-${{ github.run_id }}
          path: builder/working/experimental/director

      - name: Download Timeline evidence
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: autobot-persistent-experimental-timeline-${{ github.run_id }}
          path: builder/working/experimental/timeline

      - name: Download Music evidence
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: autobot-persistent-experimental-music-${{ github.run_id }}
          path: builder/working/experimental/music

      - name: Download Scene evidence
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: autobot-persistent-experimental-scene-${{ github.run_id }}
          path: builder/working/experimental/scene

      - name: Download Rhythm evidence
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: autobot-persistent-experimental-rhythm-${{ github.run_id }}
          path: builder/working/experimental/rhythm

      - name: Download Media Intelligence evidence
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: autobot-persistent-experimental-media-intelligence-${{ github.run_id }}
          path: builder/working/experimental/media-intelligence

      - name: Download Caption evidence
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: autobot-persistent-experimental-caption-${{ github.run_id }}
          path: builder/working/experimental/caption

      - name: Download Render evidence
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: autobot-persistent-experimental-render-${{ github.run_id }}
          path: builder/working/experimental/render

      - name: Download Intent evidence
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: autobot-persistent-experimental-intent-${{ github.run_id }}
          path: builder/working/experimental/intent

      - name: Download Continuity evidence
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: autobot-persistent-experimental-continuity-${{ github.run_id }}
          path: builder/working/experimental/continuity

      - name: Build canonical fan-in ledger
        env:
          COORDINATION_ID: persistent-${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p builder/working/fan-in
          for bot in director timeline music scene rhythm render media-intelligence caption intent continuity; do
            dir="builder/working/experimental/$bot"
            handoff="$(find "$dir" -name autobot-specialist-handoff.json -print -quit 2>/dev/null || true)"
            outcome="$(find "$dir" -name autobot-specialist-outcome.json -print -quit 2>/dev/null || true)"
            if [ -z "$handoff" ] && [ -z "$outcome" ]; then
              cat > "$dir/autobot-specialist-outcome.json" <<EOF
          {
            "botId": "${bot}-builder",
            "status": "failure",
            "category": "workflow-failure",
            "repairable": true,
            "coordinationId": "$COORDINATION_ID",
            "error": "No worker evidence artifact was produced."
          }
          EOF
              outcome="$dir/autobot-specialist-outcome.json"
            fi
            if [ -n "$handoff" ]; then
              node builder/runner/autobot-independent-fan-in.mjs \
                --coordination-id "$COORDINATION_ID" \
                --handoff "$handoff" \
                --outcome "$outcome" \
                --ledger builder/working/fan-in/autobot-fan-in-ledger.json
            else
              node builder/runner/autobot-independent-fan-in.mjs \
                --coordination-id "$COORDINATION_ID" \
                --outcome "$outcome" \
                --ledger builder/working/fan-in/autobot-fan-in-ledger.json
            fi
          done
          cat builder/working/fan-in/autobot-fan-in-ledger.json

      - name: Build canonical candidate QA + Reviewer ledger
        if: always()
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const bots=['director','timeline','music','scene','rhythm','render','media-intelligence','caption','intent','continuity'];
          const root='builder/working/experimental';
          const workers=[];
          const findFile=(dir,name)=>{
            if(!fs.existsSync(dir)) return null;
            for(const entry of fs.readdirSync(dir,{withFileTypes:true})){
              const full=`${dir}/${entry.name}`;
              if(entry.isFile()&&entry.name===name) return full;
              if(entry.isDirectory()){const found=findFile(full,name);if(found)return found;}
            }
            return null;
          };
          for (const bot of bots) {
            const dir=`${root}/${bot}`;
            const read=(name)=>{const p=findFile(dir,name);try{return p?JSON.parse(fs.readFileSync(p,'utf8')):null;}catch(error){return {status:'invalid-evidence',error:String(error.message||error)};}};
            const handoff=read('autobot-specialist-handoff.json');
            const outcome=read('autobot-specialist-outcome.json');
            const candidateCheck=read('autobot-endurance-candidate-check.json');
            const review=read(`autobot-candidate-review-${bot}-builder.json`) || read(`autobot-candidate-review-${bot}.json`);
            workers.push({
              botId:handoff?.botId||outcome?.botId||`${bot}-builder`,
              candidateCommit:handoff?.candidateCommit||candidateCheck?.candidateCommit||null,
              candidateOrigin:handoff?.candidateOrigin||outcome?.candidateOrigin||null,
              aiderMaterialized:handoff?.aiderMaterialized===true||outcome?.aiderMaterialized===true,
              specialistStatus:handoff?.status||outcome?.status||'missing',
              qaStatus:candidateCheck?.status||'not-run',
              integrationEligible:candidateCheck?.integrationEligible===true,
              reviewerStatus:review?.status||'not-run',
              reviewFindings:Array.isArray(review?.findings)?review.findings:[],
              reviewEvidencePresent:Boolean(review),
              candidateCheckEvidencePresent:Boolean(candidateCheck)
            });
          }
          const ledger={schemaVersion:'autobot-candidate-review-ledger-v1',coordinationId:`persistent-${process.env.GITHUB_RUN_ID}`,generatedAt:new Date().toISOString(),workers};
          fs.writeFileSync('builder/working/fan-in/autobot-candidate-review-ledger.json',JSON.stringify(ledger,null,2)+'\n');
          console.log(JSON.stringify(ledger,null,2));
          NODE

      - name: Upload unified ten-specialist fan-in evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: autobot-persistent-experimental-fan-in-${{ github.run_id }}
          path: |
            builder/working/fan-in/autobot-fan-in-ledger.json
            builder/working/fan-in/autobot-candidate-review-ledger.json
          if-no-files-found: ignore
