name: 🚀 AutoBot Production + Forge Research Run

on:
  workflow_dispatch:
    inputs:
      duration:
        description: Production AutoBot duration
        required: true
        default: 5h30
        type: choice
        options: ['15m','30m','1h','4h','5h','5h30']
      local_model:
        description: Local model for both production and research
        required: false
        default: qwen2.5-coder:7b
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: autobot-production-research-launcher
  cancel-in-progress: false

jobs:
  production:
    name: 🏭 Original 10 — production workflow
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Dispatch original ten production specialists
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DURATION: ${{ inputs.duration }}
          MODEL: ${{ inputs.local_model }}
        run: |
          set -euo pipefail
          START_MS="$(date +%s%3N)"
          echo "LAUNCH_START_MS=$START_MS" >> "$GITHUB_ENV"
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/autobot-parallel-specialists.yml/dispatches" \
            -d "$(python - <<'PY'
          import json, os
          print(json.dumps({"ref":"main","inputs":{"duration":os.environ["DURATION"],"local_model":os.environ["MODEL"]}}))
          PY
          )"
          echo "Production workflow dispatch accepted."

      - name: Wait for original production workflow to start
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          LAUNCH_START_MS: ${{ env.LAUNCH_START_MS }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            RUN_JSON="$(curl --fail-with-body -sS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/workflows/autobot-parallel-specialists.yml/runs?event=workflow_dispatch&branch=main&per_page=10")"
            cat > /tmp/find-production-run.py <<'PY'
          import json,sys,datetime
          data=json.load(sys.stdin); start=int(sys.argv[1])
          for run in data.get("workflow_runs",[]):
              created=int(datetime.datetime.fromisoformat(run["created_at"].replace("Z","+00:00")).timestamp()*1000)
              if created >= start-15000:
                  print(run["id"]); break
          PY
            RUN_ID="$(printf '%s' "$RUN_JSON" | python /tmp/find-production-run.py "$LAUNCH_START_MS")"
            if [ -n "$RUN_ID" ]; then
              echo "PRODUCTION_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
              echo "Found production run $RUN_ID"
              exit 0
            fi
            sleep 5
          done
          echo "Production workflow did not appear after dispatch." >&2
          exit 1

      - name: Wait for original 10 to complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ env.PRODUCTION_RUN_ID }}
          DURATION: ${{ inputs.duration }}
        run: |
          set -euo pipefail
          case "$DURATION" in
            15m) MIN_SECONDS=900 ;;
            30m) MIN_SECONDS=1800 ;;
            1h) MIN_SECONDS=3600 ;;
            4h) MIN_SECONDS=14400 ;;
            5h) MIN_SECONDS=18000 ;;
            5h30) MIN_SECONDS=19800 ;;
            *) echo "Unknown duration $DURATION" >&2; exit 1 ;;
          esac
          while true; do
            RUN_JSON="$(curl --fail-with-body -sS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID")"
            cat > /tmp/check-production-run.py <<'PY'
          import json,sys,datetime
          run=json.load(sys.stdin); minimum=int(sys.argv[1])
          status=run.get("status"); conclusion=run.get("conclusion")
          created=datetime.datetime.fromisoformat(run["created_at"].replace("Z","+00:00"))
          updated=run.get("updated_at")
          if updated:
              elapsed=(datetime.datetime.fromisoformat(updated.replace("Z","+00:00"))-created).total_seconds()
          else:
              elapsed=(datetime.datetime.now(datetime.timezone.utc)-created).total_seconds()
          print(f"Production child: status={status} conclusion={conclusion} elapsed={elapsed:.0f}s")
          if status != "completed":
              sys.exit(10)
          if elapsed + 30 < minimum:
              print(f"ERROR: production child completed too early ({elapsed:.0f}s < {minimum}s)",file=sys.stderr)
              sys.exit(2)
          if conclusion != "success":
              print("ERROR: original production workflow did not succeed.",file=sys.stderr)
              sys.exit(3)
          sys.exit(0)
          PY
            set +e
            printf '%s' "$RUN_JSON" | python /tmp/check-production-run.py "$MIN_SECONDS"
            rc=$?
            set -e
            [ "$rc" -eq 0 ] && exit 0
            [ "$rc" -eq 10 ] && sleep 15 && continue
            exit "$rc"
          done

  research:
    name: 🔬 Research — ${{ matrix.strategy }}
    strategy:
      fail-fast: false
      matrix:
        strategy:
          - aider-direct
          - aider-diff
          - aider-udiff
          - aider-whole
          - aider-scoped
          - aider-architect
          - failure-replay
          - performance-lab
          - shadow-architecture
          - adversarial
          - fast-deep
          - challenger
          - dependency-plan
          - direct-ollama-json
          - openhands-sdk
          - deterministic-control
          - evolution-selected
    uses: ./.github/workflows/autobot-research-swarm.yml
    with:
      local_model: ${{ inputs.local_model }}
      strategy: ${{ matrix.strategy }}
