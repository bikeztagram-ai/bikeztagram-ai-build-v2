name: 🚀 AutoBot Production + Forge Research Run

on:
  workflow_dispatch:
    inputs:
      duration:
        description: Production AutoBot duration
        required: true
        default: 5h30
        type: choice
        options: ['15m','30m','1h','4h','5h','5h30']
      local_model:
        description: Local model for both production and research
        required: false
        default: qwen2.5-coder:7b
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: autobot-production-research-launcher
  cancel-in-progress: false

jobs:
  production:
    name: 🏭 Launch original 10 production specialists
    runs-on: ubuntu-latest
    steps:
      - name: Launch original ten production specialists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DURATION: ${{ inputs.duration }}
          MODEL: ${{ inputs.local_model }}
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/autobot-parallel-specialists.yml/dispatches" \
            -d "$(python - <<'PY'
          import json, os
          print(json.dumps({"ref":"main","inputs":{"duration":os.environ["DURATION"],"local_model":os.environ["MODEL"]}}))
          PY
          )"

  research:
    name: 🔬 Research — ${{ matrix.strategy }}
    strategy:
      fail-fast: false
      matrix:
        strategy:
          - aider-direct
          - aider-diff
          - aider-udiff
          - aider-whole
          - aider-scoped
          - aider-architect
          - failure-replay
          - performance-lab
          - shadow-architecture
          - adversarial
          - fast-deep
          - challenger
          - dependency-plan
          - direct-ollama-json
          - openhands-sdk
          - deterministic-control
          - evolution-selected
    uses: ./.github/workflows/autobot-research-swarm.yml
    with:
      local_model: ${{ inputs.local_model }}
      strategy: ${{ matrix.strategy }}
