name: 🚀 AutoBot Production + Forge Research Run

on:
  workflow_dispatch:
    inputs:
      duration:
        description: Production AutoBot duration
        required: true
        default: 5h30
        type: choice
        options: ['15m','30m','1h','4h','5h','5h30']
      local_model:
        description: Local model for both production and research
        required: false
        default: qwen2.5-coder:7b
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: autobot-production-research-launcher
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - name: Launch ten production specialists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DURATION: ${{ inputs.duration }}
          MODEL: ${{ inputs.local_model }}
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/autobot-parallel-specialists.yml/dispatches" \
            -d "$(python - <<'PY'
          import json, os
          print(json.dumps({"ref":"main","inputs":{"duration":os.environ["DURATION"],"local_model":os.environ["MODEL"]}}))
          PY
          )"

      - name: Launch Forge research swarm at the same time
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MODEL: ${{ inputs.local_model }}
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/autobot-research-swarm.yml/dispatches" \
            -d "$(python - <<'PY'
          import json, os
          print(json.dumps({"ref":"main","inputs":{"local_model":os.environ["MODEL"]}}))
          PY
          )"

      - name: Confirm both runs were dispatched
        run: |
          echo "Production: ten persistent specialists launched."
          echo "Research: Forge swarm launched independently."
          echo "Both were dispatched from the same launcher run; neither waits for the other."
