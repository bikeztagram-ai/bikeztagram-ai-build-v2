name: 🚀 AutoBot Production + Forge Research Run

on:
  workflow_dispatch:
    inputs:
      duration:
        description: Production AutoBot duration
        required: true
        default: 5h30
        type: choice
        options: ['15m','30m','1h','4h','5h','5h30']
      local_model:
        description: Local model for both production and research
        required: false
        default: qwen2.5-coder:7b
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: autobot-production-research-launcher
  cancel-in-progress: false

jobs:
  production-dispatch:
    name: 🏭 Dispatch + start original 10 production workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - name: Dispatch original ten production specialists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DURATION: ${{ inputs.duration }}
          MODEL: ${{ inputs.local_model }}
        run: |
          set -euo pipefail
          START_MS="$(date +%s%3N)"
          echo "START_MS=$START_MS" >> "$GITHUB_ENV"
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/autobot-parallel-specialists.yml/dispatches" \
            -d "$(python - <<'PY'
          import json, os
          print(json.dumps({"ref":"main","inputs":{"duration":os.environ["DURATION"],"local_model":os.environ["MODEL"]}}))
          PY
          )"
          echo "Production workflow dispatch accepted."

      - name: Find real production workflow run
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          START_MS="$(date +%s%3N)"
          for i in $(seq 1 30); do
            curl --fail-with-body -sS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/workflows/autobot-parallel-specialists.yml/runs?event=workflow_dispatch&branch=main&per_page=10" \
              > /tmp/production-runs.json
            RUN_ID="$(python - "$START_MS" <<'PY'
          import json,sys,datetime
          start=int(sys.argv[1])
          data=json.load(open('/tmp/production-runs.json'))
          for run in data.get('workflow_runs',[]):
              created=int(datetime.datetime.fromisoformat(run['created_at'].replace('Z','+00:00')).timestamp()*1000)
              if created >= start-15000:
                  print(run['id']); break
          PY
          )"
            if [ -n "$RUN_ID" ]; then
              echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              echo "Found production run $RUN_ID"
              exit 0
            fi
            sleep 5
          done
          echo "Production workflow did not appear after dispatch." >&2
          exit 1

      - name: Wait until all original production specialists have started
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.find.outputs.run_id }}
        run: |
          set -euo pipefail
          echo "Holding research until all 10 production specialist jobs are running or have already completed."
          for i in $(seq 1 60); do
            curl --fail-with-body -sS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
              > /tmp/production-jobs.json

            python - <<'PY'
          import json
          expected={
              "experimental-director","experimental-timeline","experimental-music",
              "experimental-scene","experimental-rhythm","experimental-render",
              "experimental-media-intelligence","experimental-caption",
              "experimental-intent","experimental-continuity"
          }
          jobs=json.load(open('/tmp/production-jobs.json')).get('jobs',[])
          found={j.get('name'):j for j in jobs if j.get('name') in expected}
          started={name for name,j in found.items() if j.get('status') in {'in_progress','completed'}}
          queued=expected-started
          print(f"Production start gate: {len(started)}/10 started; queued={sorted(queued)}")
          if len(started)==10:
              raise SystemExit(0)
          raise SystemExit(10)
          PY
            rc=$?
            [ "$rc" -eq 0 ] && exit 0
            sleep 10
          done
          echo "Production start gate timed out before all 10 specialists started." >&2
          exit 1

  production-gate:
    name: 🏁 Original 10 production result
    needs: production-dispatch
    if: ${{ always() && needs.production-dispatch.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ needs.production-dispatch.outputs.run_id }}
    steps:
      - name: Wait for original production workflow to finish
        run: |
          set -euo pipefail
          while true; do
            curl --fail-with-body -sS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID" \
              > /tmp/production-run.json
            python - <<'PY'
          import json
          run=json.load(open('/tmp/production-run.json'))
          print(f"Production workflow: status={run.get('status')} conclusion={run.get('conclusion')}")
          if run.get('status')=='completed':
              raise SystemExit(0)
          raise SystemExit(10)
          PY
            rc=$?
            [ "$rc" -eq 0 ] && break
            sleep 30
          done

      - name: Validate all ten specialists completed successfully
        run: |
          set -euo pipefail
          curl --fail-with-body -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            > /tmp/production-jobs.json
          python - <<'PY'
          import json
          expected={
              "experimental-director","experimental-timeline","experimental-music",
              "experimental-scene","experimental-rhythm","experimental-render",
              "experimental-media-intelligence","experimental-caption",
              "experimental-intent","experimental-continuity"
          }
          jobs=json.load(open('/tmp/production-jobs.json')).get('jobs',[])
          found={j.get('name'):j for j in jobs if j.get('name') in expected}
          missing=expected-set(found)
          failed={name:j.get('conclusion') for name,j in found.items() if j.get('conclusion')!='success'}
          if missing:
              print(f"Missing production specialists: {sorted(missing)}")
              raise SystemExit(1)
          if failed:
              print(f"Production specialist failures: {failed}")
              raise SystemExit(1)
          print("All ten original production specialist jobs completed successfully.")
          PY

  research:
    name: 🔬 Research — ${{ matrix.strategy }}
    needs: production-dispatch
    strategy:
      fail-fast: false
      matrix:
        strategy:
          - aider-direct
          - aider-diff
          - aider-udiff
          - aider-whole
          - aider-scoped
          - aider-architect
          - failure-replay
          - performance-lab
          - shadow-architecture
          - adversarial
          - fast-deep
          - challenger
          - dependency-plan
          - direct-ollama-json
          - openhands-sdk
          - deterministic-control
          - evolution-selected
    uses: ./.github/workflows/autobot-research-swarm.yml
    with:
      local_model: ${{ inputs.local_model }}
      strategy: ${{ matrix.strategy }}
