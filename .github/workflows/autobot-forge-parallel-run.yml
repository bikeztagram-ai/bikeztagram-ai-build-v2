name: 🚀 AutoBot Production + Forge Research Run

on:
  workflow_dispatch:
    inputs:
      duration:
        description: Production AutoBot duration
        required: true
        default: 5h30
        type: choice
        options: ['15m','30m','1h','4h','5h','5h30']
      local_model:
        description: Local model for both production and research
        required: false
        default: qwen2.5-coder:7b
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: autobot-production-research-launcher
  cancel-in-progress: false

jobs:
  production-dispatch:
    name: 🏭 Dispatch original 10 production workflow
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
      research_deadline_ms: ${{ steps.find.outputs.research_deadline_ms }}
    steps:
      - name: Dispatch original ten production specialists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DURATION: ${{ inputs.duration }}
          MODEL: ${{ inputs.local_model }}
        run: |
          set -euo pipefail
          LAUNCH_START_MS="$(date +%s%3N)"
          echo "LAUNCH_START_MS=$LAUNCH_START_MS" >> "$GITHUB_ENV"
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/autobot-parallel-specialists.yml/dispatches" \
            -d "$(python - <<'PY'
          import json, os
          print(json.dumps({"ref":"main","inputs":{"duration":os.environ["DURATION"],"local_model":os.environ["MODEL"]}}))
          PY
          )"
          echo "Production workflow dispatch accepted."

      - name: Find real production workflow run
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DURATION: ${{ inputs.duration }}
        run: |
          set -euo pipefail
          START_MS="${LAUNCH_START_MS:-$(date +%s%3N)}"
          for i in $(seq 1 30); do
            curl --fail-with-body -sS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/workflows/autobot-parallel-specialists.yml/runs?event=workflow_dispatch&branch=main&per_page=10" \
              > /tmp/production-runs.json
            RUN_ID="$(python - "$START_MS" <<'PY'
          import json,sys,datetime
          start=int(sys.argv[1])
          data=json.load(open('/tmp/production-runs.json'))
          for run in data.get('workflow_runs',[]):
              created=int(datetime.datetime.fromisoformat(run['created_at'].replace('Z','+00:00')).timestamp()*1000)
              if created >= start-15000:
                  print(run['id']); break
          PY
          )"
            if [ -n "$RUN_ID" ]; then
              DEADLINE_MS="$(python - "$START_MS" "$DURATION" <<'PY'
          import sys
          start=int(sys.argv[1]); raw=sys.argv[2].strip().lower()
          if "h" in raw:
              h,m=raw.split("h",1); duration=int(h)*3600000 + (int(m) if m else 0)*60000
          elif raw.endswith("m"):
              duration=int(raw[:-1])*60000
          else:
              raise SystemExit(f"Unsupported duration: {raw}")
          print(start+duration)
          PY
          )"
              echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              echo "research_deadline_ms=$DEADLINE_MS" >> "$GITHUB_OUTPUT"
              echo "Found production run $RUN_ID"
              exit 0
            fi
            sleep 5
          done
          echo "Production workflow did not appear after dispatch." >&2
          exit 1

  production-start-gate:
    name: 🚦 Wait for all 10 proven production specialists to start
    needs: production-dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ needs.production-dispatch.outputs.run_id }}
    steps:
      - name: Wait until all ten original production lanes are running
        run: |
          set -euo pipefail
          expected="experimental-director experimental-timeline experimental-music experimental-scene experimental-rhythm experimental-render experimental-media-intelligence experimental-caption experimental-intent experimental-continuity"
          for attempt in $(seq 1 60); do
            curl --fail-with-body -sS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
              > /tmp/production-jobs.json
            set +e
          python - "$expected" <<'PY'
          import json,sys
          expected=sys.argv[1].split()
          jobs=json.load(open('/tmp/production-jobs.json')).get('jobs',[])
          by_name={j.get('name'):j for j in jobs}
          missing=[name for name in expected if name not in by_name]
          not_started=[name for name in expected if name in by_name and by_name[name].get('status') not in ('in_progress','completed')]
          print(json.dumps({
            "found":len(expected)-len(missing),
            "missing":missing,
            "notStarted":not_started,
            "states":{name:by_name[name].get('status') for name in expected if name in by_name}
          },indent=2))
          if missing or not_started:
              raise SystemExit(10)
          PY
            rc=$?
          set -e
            if [ "$rc" -eq 0 ]; then
              echo "All ten proven production specialists have claimed runners; releasing the research swarm."
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for all ten proven production specialists to start." >&2
          exit 1

  # IMPORTANT: this gate is deliberately short-lived. Once the ten proven
  # production jobs have started, this launcher releases its runner so the
  # research swarm can consume only the remaining runner capacity.
  # Rolling research queue: 30 disposable workers are queued behind the
  # 10 active research slots. As a worker finishes or fails, GitHub starts
  # the next queued worker on the freed runner. Production stays protected.
  # Research Director creates a large disposable queue from the experiment catalog.
  # Only ten workers run at once; when one ends, the next queued task claims the runner.
  # Production remains isolated and protected.
  research-plan:
    name: 🧠 Forge Research Director
    needs: production-start-gate
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      window_minutes: ${{ steps.window.outputs.window_minutes }}
    steps:
      - name: Calculate persistent research window
        id: window
        env:
          DURATION: ${{ inputs.duration }}
        run: |
          set -euo pipefail
          WINDOW_MINUTES="$(python - "$DURATION" <<'PY'
          import sys,re
          raw=sys.argv[1].strip().lower()
          m=re.fullmatch(r'(\\d+)h(?:(\\d+)m)?',raw)
          if m:
              print(int(m.group(1))*60 + int(m.group(2) or 0))
          elif raw.endswith('m'):
              print(int(raw[:-1]))
          else:
              raise SystemExit(f"Unsupported duration: {raw}")
          PY
          )"
          echo "window_minutes=$WINDOW_MINUTES" >> "$GITHUB_OUTPUT"
          echo "Persistent research window: $WINDOW_MINUTES minutes."

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Load latest successful Forge research evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p builder/working/prior-research
          curl --fail-with-body -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/autobot-forge-parallel-run.yml/runs?status=success&per_page=10" \
            > /tmp/forge-successful-runs.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/forge-successful-runs.json'))
          print(d.get('workflow_runs',[{}])[0].get('id',''))
          PY
          RUN_ID="$(python - <<'PY'
          import json
          d=json.load(open('/tmp/forge-successful-runs.json'))
          print(d.get('workflow_runs',[{}])[0].get('id',''))
          PY
          )"
          if [ -z "$RUN_ID" ]; then
            echo "No previous successful Forge run found; starting with catalog evidence."
            exit 0
          fi
          curl --fail-with-body -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
            > /tmp/forge-artifacts.json
          ART_ID="$(python - <<'PY'
          import json
          d=json.load(open('/tmp/forge-artifacts.json'))
          xs=[x for x in d.get('artifacts',[]) if x.get('name','').startswith('autobot-research-harvest-') and not x.get('expired')]
          print(xs[0]['id'] if xs else '')
          PY
          )"
          if [ -z "$ART_ID" ]; then
            echo "No research harvest artifact found in previous successful Forge run."
            exit 0
          fi
          curl --fail-with-body -L -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/artifacts/$ART_ID/zip" \
            -o /tmp/prior-research.zip
          unzip -o /tmp/prior-research.zip -d builder/working/prior-research >/dev/null
          echo "Loaded prior Forge research harvest from run $RUN_ID."
      - name: Generate research experiment queue
        id: plan
        env:
          AUTOBOT_PRIOR_RESEARCH: builder/working/prior-research/autobot-research-next-cycle.json
        run: node scripts/autobot/plan-research-swarm.mjs
      - name: Upload research queue manifest
        uses: actions/upload-artifact@v7
        with:
          name: autobot-research-queue-${{ github.run_id }}
          path: builder/working/research-matrix.json
          if-no-files-found: error

  research:
    name: 🔬 Research — ${{ matrix.slot }} / ${{ matrix.domain }} / ${{ matrix.strategy }}
    needs: [production-start-gate, research-plan]
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix: ${{ fromJSON(needs.research-plan.outputs.matrix) }}
    uses: ./.github/workflows/autobot-research-swarm.yml
    with:
      local_model: ${{ inputs.local_model }}
      lane: ${{ matrix.domain }}
      strategy: ${{ matrix.strategy }}
      experiment_id: ${{ matrix.experiment_id }}
      research_question: ${{ matrix.research_question }}
      variant: ${{ matrix.variant }}
      queue_slot: ${{ matrix.slot }}
      window_minutes: ${{ needs.research-plan.outputs.window_minutes }}
  research-harvest:
    name: 📚 Harvest research evidence
    needs: research
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Download all research evidence
        uses: actions/download-artifact@v7
        with:
          pattern: autobot-research-*
          path: builder/working/research-harvest/raw
          merge-multiple: false
      - name: Aggregate research results and next-cycle lessons
        run: node scripts/autobot/harvest-research-swarm.mjs
      - name: Upload research harvest
        uses: actions/upload-artifact@v7
        with:
          name: autobot-research-harvest-${{ github.run_id }}
          path: |
            builder/working/research-harvest/autobot-research-harvest.json
            builder/working/research-harvest/autobot-research-next-cycle.json
          if-no-files-found: error


  trial-builder:
    name: 🧪 Forge Trial Builder — evolve the experimental builder
    needs: [research-harvest]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout workflow/main toolchain
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Checkout persistent isolated trial-builder branch
        uses: actions/checkout@v7
        with:
          ref: autobot/trial-builder
          path: trial-branch
          fetch-depth: 0

      - name: Download current research evidence
        uses: actions/download-artifact@v7
        with:
          pattern: autobot-research-*-${{ github.run_id }}
          path: trial-branch/builder/working/trial-research
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Start isolated local model
        timeout-minutes: 20
        run: bash scripts/autobot/install-local-brain.sh
        env:
          LOCAL_AI_MODEL: ${{ inputs.local_model }}
          AUTOBOT_DISCOVERY_MODEL: qwen2.5-coder:3b
          LOCAL_AI_PROXY_NUM_CTX: 12288
          LOCAL_AI_PROXY_NUM_PREDICT: 2200
          OLLAMA_CONTEXT_LENGTH: 12288
          OLLAMA_NUM_PARALLEL: 1
          OLLAMA_MAX_QUEUE: 2
          OLLAMA_LOAD_TIMEOUT: 20m
          OLLAMA_KEEP_ALIVE: 30m

      - name: Run one bounded self-improvement experiment
        id: trial
        continue-on-error: true
        env:
          LOCAL_AI_MODEL: ${{ inputs.local_model }}
          LOCAL_AI_READY: '1'
          TRIAL_RESEARCH_DIR: trial-branch/builder/working/trial-research
          TRIAL_MODEL_TIMEOUT_MS: '180000'
        run: |
          set +e
          node trial-branch/builder/trial-builder/engine.mjs
          RC=$?
          echo "trial_exit=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify trial branch scope and persist experiment
        env:
          TRIAL_EXIT: ${{ steps.trial.outputs.trial_exit }}
        run: |
          set -euo pipefail
          git -C trial-branch config user.name "Bikeztagram AutoBot Trial"
          git -C trial-branch config user.email "autobot-trial@users.noreply.github.com"
          mapfile -t changed < <(git -C trial-branch status --short | awk '{print $2}' | sed '/^$/d')
          for path in "${changed[@]}"; do
            case "$path" in
              builder/trial-builder/*) ;;
              *) echo "Trial builder attempted an out-of-scope change: $path" >&2; git -C trial-branch reset --hard HEAD; git -C trial-branch clean -fd; exit 1 ;;
            esac
          done
          node trial-branch/builder/trial-builder/engine.mjs --self-test
          git -C trial-branch diff --check
          if git -C trial-branch diff --quiet -- builder/trial-builder && git -C trial-branch diff --cached --quiet -- builder/trial-builder; then
            echo "No trial state/code change was produced; refusing to advance the persistent trial."
            exit 1
          fi
          git -C trial-branch add builder/trial-builder
          git -C trial-branch commit -m "trial: persist forge builder experiment"
          git -C trial-branch push origin HEAD:autobot/trial-builder
          echo "Persisted trial experiment (engine exit $TRIAL_EXIT)."

  production-finalize:
    name: 🧾 Finalize production evidence
    needs: [production-dispatch, trial-builder]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ needs.production-dispatch.outputs.run_id }}
    steps:
      - name: Wait for the real production workflow to finish
        id: wait
        run: |
          set -euo pipefail
          if [ -z "$RUN_ID" ]; then
            echo 'run_id=' >> "$GITHUB_OUTPUT"
            echo 'conclusion=dispatch-failed' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for attempt in $(seq 1 1360); do
            curl --fail-with-body -sS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID" \
              > /tmp/production-run.json
            python - <<'PY' > /tmp/production-state.txt
          import json
          d=json.load(open('/tmp/production-run.json'))
          print(d.get('status',''))
          print(d.get('conclusion') or '')
          PY
            STATUS="$(sed -n '1p' /tmp/production-state.txt)"
            CONCLUSION="$(sed -n '2p' /tmp/production-state.txt)"
            echo "production run $RUN_ID: status=$STATUS conclusion=$CONCLUSION"
            if [ "$STATUS" = "completed" ]; then
              echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              echo "conclusion=$CONCLUSION" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "Production workflow did not finish before the 350-minute evidence window." >&2
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "conclusion=timeout" >> "$GITHUB_OUTPUT"

      - name: Download canonical production fan-in evidence
        if: steps.wait.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: autobot-persistent-experimental-fan-in-${{ steps.wait.outputs.run_id }}
          path: builder/working/production-evidence/fan-in
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.wait.outputs.run_id }}

      - name: Preserve production run metadata and evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p builder/working/production-evidence
          python - <<'PY'
          import json,os
          run_id=os.environ.get('RUN_ID','')
          source='/tmp/production-run.json'
          data=json.load(open(source)) if os.path.exists(source) else {}
          meta={
            'schemaVersion':'autobot-production-run-handoff-v1',
            'launcherRunId':os.environ.get('GITHUB_RUN_ID'),
            'productionRunId':run_id or None,
            'status':data.get('status'),
            'conclusion':data.get('conclusion'),
            'headSha':data.get('head_sha'),
            'workflowName':data.get('name')
          }
          with open('builder/working/production-evidence/production-run.json','w') as f:
            json.dump(meta,f,indent=2)
            f.write('\\n')
          PY
          if ! find builder/working/production-evidence/fan-in -type f \\( -name 'autobot-fan-in-ledger.json' -o -name 'autobot-candidate-review-ledger.json' \\) -print -quit 2>/dev/null | grep -q .; then
            mkdir -p builder/working/production-evidence/fan-in
            cat > builder/working/production-evidence/fan-in/autobot-fan-in-ledger.json <<'EOF'
          {
            "schemaVersion": "autobot-fan-in-ledger-v1",
            "status": "missing-production-evidence",
            "note": "The production child workflow completed without a downloadable canonical fan-in artifact."
          }
          EOF
          fi

      - name: Upload production evidence for Evolution Engineer
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autobot-persistent-experimental-fan-in-${{ github.run_id }}
          path: builder/working/production-evidence
          if-no-files-found: error

      - name: Fail the combined run when production did not succeed
        if: always()
        run: |
          if [ "${{ steps.wait.outputs.conclusion }}" != "success" ]; then
            echo "The real ten-specialist production workflow concluded: ${{ steps.wait.outputs.conclusion }}"
            exit 1
          fi
          echo "The real ten-specialist production workflow completed successfully."

