name: 🚀 AutoBot Production + Forge Research Run

on:
  workflow_dispatch:
    inputs:
      duration:
        description: Production AutoBot duration
        required: true
        default: 5h30
        type: choice
        options: ['15m','30m','1h','4h','5h','5h30']
      local_model:
        description: Local model for both production and research
        required: false
        default: qwen2.5-coder:7b
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: autobot-production-research-launcher
  cancel-in-progress: false

jobs:
  production-dispatch:
    name: 🏭 Dispatch original 10 production workflow
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - name: Dispatch original ten production specialists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DURATION: ${{ inputs.duration }}
          MODEL: ${{ inputs.local_model }}
        run: |
          set -euo pipefail
          START_MS="$(date +%s%3N)"
          echo "START_MS=$START_MS" >> "$GITHUB_ENV"
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/autobot-parallel-specialists.yml/dispatches" \
            -d "$(python - <<'PY'
          import json, os
          print(json.dumps({"ref":"main","inputs":{"duration":os.environ["DURATION"],"local_model":os.environ["MODEL"]}}))
          PY
          )"
          echo "Production workflow dispatch accepted."

      - name: Find real production workflow run
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          START_MS="$(date +%s%3N)"
          for i in $(seq 1 30); do
            curl --fail-with-body -sS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/workflows/autobot-parallel-specialists.yml/runs?event=workflow_dispatch&branch=main&per_page=10" \
              > /tmp/production-runs.json
            RUN_ID="$(python - "$START_MS" <<'PY'
          import json,sys,datetime
          start=int(sys.argv[1])
          data=json.load(open('/tmp/production-runs.json'))
          for run in data.get('workflow_runs',[]):
              created=int(datetime.datetime.fromisoformat(run['created_at'].replace('Z','+00:00')).timestamp()*1000)
              if created >= start-15000:
                  print(run['id']); break
          PY
          )"
            if [ -n "$RUN_ID" ]; then
              echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              echo "Found production run $RUN_ID"
              exit 0
            fi
            sleep 5
          done
          echo "Production workflow did not appear after dispatch." >&2
          exit 1

  production-start-gate:
    name: 🚦 Wait for all 10 proven production specialists to start
    needs: production-dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ needs.production-dispatch.outputs.run_id }}
    steps:
      - name: Wait until all ten original production lanes are running
        run: |
          set -euo pipefail
          expected="experimental-director experimental-timeline experimental-music experimental-scene experimental-rhythm experimental-render experimental-media-intelligence experimental-caption experimental-intent experimental-continuity"
          for attempt in $(seq 1 60); do
            curl --fail-with-body -sS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
              > /tmp/production-jobs.json
            python - "$expected" <<'PY'
          import json,sys
          expected=sys.argv[1].split()
          jobs=json.load(open('/tmp/production-jobs.json')).get('jobs',[])
          by_name={j.get('name'):j for j in jobs}
          missing=[name for name in expected if name not in by_name]
          not_started=[name for name in expected if name in by_name and by_name[name].get('status') not in ('in_progress','completed')]
          print(json.dumps({
            "found":len(expected)-len(missing),
            "missing":missing,
            "notStarted":not_started,
            "states":{name:by_name[name].get('status') for name in expected if name in by_name}
          },indent=2))
          if missing or not_started:
              raise SystemExit(10)
          PY
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "All ten proven production specialists have claimed runners; releasing the research swarm."
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for all ten proven production specialists to start." >&2
          exit 1

  # IMPORTANT: this gate is deliberately short-lived. Once the ten proven
  # production jobs have started, this launcher releases its runner so the
  # research swarm can consume only the remaining runner capacity.
  research:
    name: 🔬 Research — ${{ matrix.strategy }}
    strategy:
      fail-fast: false
      matrix:
        strategy:
          - aider-direct
          - aider-diff
          - aider-udiff
          - aider-whole
          - aider-scoped
          - aider-architect
          - failure-replay
          - performance-lab
          - shadow-architecture
          - adversarial
          - fast-deep
          - challenger
          - dependency-plan
          - direct-ollama-json
          - openhands-sdk
          - deterministic-control
          - evolution-selected
    uses: ./.github/workflows/autobot-research-swarm.yml
    with:
      local_model: ${{ inputs.local_model }}
      strategy: ${{ matrix.strategy }}
  research:
    name: 🔬 Research — ${{ matrix.lane }}
    needs: production-start-gate
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        lane:
          - agent-materialisation
          - edit-protocols
          - recovery-engineering
          - performance-runtime
          - adversarial-quality
          - architecture-controller
          - model-adapters
          - evolution-discovery
          - borg-orchestration
          - regression-replay
    uses: ./.github/workflows/autobot-research-swarm.yml
    with:
      local_model: ${{ inputs.local_model }}
      lane: ${{ matrix.lane }}

  research-harvest:
    name: 📚 Harvest research evidence
    needs: research
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Download all research evidence
        uses: actions/download-artifact@v7
        with:
          pattern: autobot-research-*
          path: builder/working/research-harvest/raw
          merge-multiple: false
      - name: Aggregate research results and next-cycle lessons
        run: node scripts/autobot/harvest-research-swarm.mjs
      - name: Upload research harvest
        uses: actions/upload-artifact@v7
        with:
          name: autobot-research-harvest-${{ github.run_id }}
          path: |
            builder/working/research-harvest/autobot-research-harvest.json
            builder/working/research-harvest/autobot-research-next-cycle.json
          if-no-files-found: error
\n