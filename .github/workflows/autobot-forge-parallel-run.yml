name: 🚀 AutoBot Production + Forge Research Run

on:
  workflow_dispatch:
    inputs:
      duration:
        description: Production AutoBot duration
        required: true
        default: 5h30
        type: choice
        options: ['15m','30m','1h','4h','5h','5h30']
      local_model:
        description: Local model for both production and research
        required: false
        default: qwen2.5-coder:7b
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: autobot-production-research-launcher
  cancel-in-progress: false

jobs:
  production-dispatch:
    name: 🏭 Dispatch original 10 production workflow
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - name: Dispatch original ten production specialists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DURATION: ${{ inputs.duration }}
          MODEL: ${{ inputs.local_model }}
        run: |
          set -euo pipefail
          START_MS="$(date +%s%3N)"
          echo "START_MS=$START_MS" >> "$GITHUB_ENV"
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/autobot-parallel-specialists.yml/dispatches" \
            -d "$(python - <<'PY'
          import json, os
          print(json.dumps({"ref":"main","inputs":{"duration":os.environ["DURATION"],"local_model":os.environ["MODEL"]}}))
          PY
          )"
          echo "Production workflow dispatch accepted."

      - name: Find real production workflow run
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          START_MS="$(date +%s%3N)"
          for i in $(seq 1 30); do
            curl --fail-with-body -sS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/workflows/autobot-parallel-specialists.yml/runs?event=workflow_dispatch&branch=main&per_page=10" \
              > /tmp/production-runs.json
            RUN_ID="$(python - "$START_MS" <<'PY'
          import json,sys,datetime
          start=int(sys.argv[1])
          data=json.load(open('/tmp/production-runs.json'))
          for run in data.get('workflow_runs',[]):
              created=int(datetime.datetime.fromisoformat(run['created_at'].replace('Z','+00:00')).timestamp()*1000)
              if created >= start-15000:
                  print(run['id']); break
          PY
          )"
            if [ -n "$RUN_ID" ]; then
              echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              echo "Found production run $RUN_ID"
              exit 0
            fi
            sleep 5
          done
          echo "Production workflow did not appear after dispatch." >&2
          exit 1

  production-specialists:
    name: 🏭 ${{ matrix.label }}
    needs: production-dispatch
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: experimental-director
            label: Director
          - id: experimental-timeline
            label: Timeline
          - id: experimental-music
            label: Music
          - id: experimental-scene
            label: Scene
          - id: experimental-rhythm
            label: Rhythm
          - id: experimental-render
            label: Render
          - id: experimental-media-intelligence
            label: Media Intelligence
          - id: experimental-caption
            label: Caption
          - id: experimental-intent
            label: Intent
          - id: experimental-continuity
            label: Continuity
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ needs.production-dispatch.outputs.run_id }}
      JOB_ID: ${{ matrix.id }}
    steps:
      - name: Track actual specialist job
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            curl --fail-with-body -sS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
              > /tmp/production-jobs.json
            ACTUAL_JOB="$(python - "$JOB_ID" <<'PY'
          import json,sys
          wanted=sys.argv[1]
          data=json.load(open('/tmp/production-jobs.json'))
          for job in data.get('jobs',[]):
              if job.get('name')==wanted:
                  print(job['id']); break
          PY
          )"
            if [ -n "$ACTUAL_JOB" ]; then
              echo "Tracking actual production specialist job $ACTUAL_JOB ($JOB_ID)"
              while true; do
                curl --fail-with-body -sS \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/$REPO/actions/jobs/$ACTUAL_JOB" \
                  > /tmp/production-job.json
                set +e
                python - <<'PY'
          import json
          job=json.load(open('/tmp/production-job.json'))
          status=job.get('status'); conclusion=job.get('conclusion')
          print(f"{job.get('name')}: status={status} conclusion={conclusion}")
          if status!='completed': raise SystemExit(10)
          if conclusion!='success': raise SystemExit(2)
          raise SystemExit(0)
          PY
                rc=$?
                set -e
                [ "$rc" -eq 0 ] && exit 0
                [ "$rc" -eq 2 ] && exit 2
                sleep 15
              done
            fi
            sleep 5
          done
          echo "Could not find actual specialist job $JOB_ID." >&2
          exit 1

  production-gate:
    name: 🏁 Original 10 production result
    needs: production-specialists
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Validate all ten specialists completed successfully
        run: |
          if [ "${{ needs.production-specialists.result }}" != "success" ]; then
            echo "At least one of the original ten production specialists failed."
            exit 1
          fi
          echo "All ten original production specialist jobs completed successfully."

  research:
    name: 🔬 Research — ${{ matrix.strategy }}
    strategy:
      fail-fast: false
      matrix:
        strategy:
          - aider-direct
          - aider-diff
          - aider-udiff
          - aider-whole
          - aider-scoped
          - aider-architect
          - failure-replay
          - performance-lab
          - shadow-architecture
          - adversarial
          - fast-deep
          - challenger
          - dependency-plan
          - direct-ollama-json
          - openhands-sdk
          - deterministic-control
          - evolution-selected
    uses: ./.github/workflows/autobot-research-swarm.yml
    with:
      local_model: ${{ inputs.local_model }}
      strategy: ${{ matrix.strategy }}
