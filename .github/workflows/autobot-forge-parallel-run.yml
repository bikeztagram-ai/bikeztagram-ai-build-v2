name: 🚀 AutoBot Production + Forge Research Run

on:
  workflow_dispatch:
    inputs:
      duration:
        description: Production AutoBot duration
        required: true
        default: 5h30
        type: choice
        options: ['15m','30m','1h','4h','5h','5h30']
      local_model:
        description: Local model for both production and research
        required: false
        default: qwen2.5-coder:7b
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: autobot-production-research-launcher
  cancel-in-progress: false

jobs:
  production-dispatch:
    name: 🏭 Dispatch original 10 production workflow
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
      research_deadline_ms: ${{ steps.find.outputs.research_deadline_ms }}
    steps:
      - name: Dispatch original ten production specialists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DURATION: ${{ inputs.duration }}
          MODEL: ${{ inputs.local_model }}
        run: |
          set -euo pipefail
          LAUNCH_START_MS="$(date +%s%3N)"
          echo "LAUNCH_START_MS=$LAUNCH_START_MS" >> "$GITHUB_ENV"
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/autobot-parallel-specialists.yml/dispatches" \
            -d "$(python - <<'PY'
          import json, os
          print(json.dumps({"ref":"main","inputs":{"duration":os.environ["DURATION"],"local_model":os.environ["MODEL"]}}))
          PY
          )"
          echo "Production workflow dispatch accepted."

      - name: Find real production workflow run
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DURATION: ${{ inputs.duration }}
        run: |
          set -euo pipefail
          START_MS="${LAUNCH_START_MS:-$(date +%s%3N)}"
          for i in $(seq 1 30); do
            curl --fail-with-body -sS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/workflows/autobot-parallel-specialists.yml/runs?event=workflow_dispatch&branch=main&per_page=10" \
              > /tmp/production-runs.json
            RUN_ID="$(python - "$START_MS" <<'PY'
          import json,sys,datetime
          start=int(sys.argv[1])
          data=json.load(open('/tmp/production-runs.json'))
          for run in data.get('workflow_runs',[]):
              created=int(datetime.datetime.fromisoformat(run['created_at'].replace('Z','+00:00')).timestamp()*1000)
              if created >= start-15000:
                  print(run['id']); break
          PY
          )"
            if [ -n "$RUN_ID" ]; then
              DEADLINE_MS="$(python - "$START_MS" "$DURATION" <<'PY'
          import sys
          start=int(sys.argv[1]); raw=sys.argv[2].strip().lower()
          if "h" in raw:
              h,m=raw.split("h",1); duration=int(h)*3600000 + (int(m) if m else 0)*60000
          elif raw.endswith("m"):
              duration=int(raw[:-1])*60000
          else:
              raise SystemExit(f"Unsupported duration: {raw}")
          print(start+duration)
          PY
          )"
              echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              echo "research_deadline_ms=$DEADLINE_MS" >> "$GITHUB_OUTPUT"
              echo "Found production run $RUN_ID"
              exit 0
            fi
            sleep 5
          done
          echo "Production workflow did not appear after dispatch." >&2
          exit 1

  production-start-gate:
    name: 🚦 Wait for all 10 proven production specialists to start
    needs: production-dispatch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ needs.production-dispatch.outputs.run_id }}
    steps:
      - name: Wait until all ten original production lanes are running
        run: |
          set -euo pipefail
          expected="experimental-director experimental-timeline experimental-music experimental-scene experimental-rhythm experimental-render experimental-media-intelligence experimental-caption experimental-intent experimental-continuity"
          for attempt in $(seq 1 60); do
            curl --fail-with-body -sS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
              > /tmp/production-jobs.json
            set +e
          python - "$expected" <<'PY'
          import json,sys
          expected=sys.argv[1].split()
          jobs=json.load(open('/tmp/production-jobs.json')).get('jobs',[])
          by_name={j.get('name'):j for j in jobs}
          missing=[name for name in expected if name not in by_name]
          not_started=[name for name in expected if name in by_name and by_name[name].get('status') not in ('in_progress','completed')]
          print(json.dumps({
            "found":len(expected)-len(missing),
            "missing":missing,
            "notStarted":not_started,
            "states":{name:by_name[name].get('status') for name in expected if name in by_name}
          },indent=2))
          if missing or not_started:
              raise SystemExit(10)
          PY
            rc=$?
          set -e
            if [ "$rc" -eq 0 ]; then
              echo "All ten proven production specialists have claimed runners; releasing the research swarm."
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for all ten proven production specialists to start." >&2
          exit 1

  # IMPORTANT: this gate is deliberately short-lived. Once the ten proven
  # production jobs have started, this launcher releases its runner so the
  # research swarm can consume only the remaining runner capacity.
  # Runner budget: 10 production specialists + 9 research lanes + 1 trial builder.
  # The trial builder is the former forge-orchestration research slot. It starts
  # only after the nine research lanes have harvested, so it can consume their
  # evidence without creating an eleventh research runner.
  research-plan:
    name: 🧠 Forge Research Director
    needs: production-start-gate
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      window_minutes: ${{ steps.window.outputs.window_minutes }}
    steps:
      - name: Calculate persistent research window
        id: window
        env:
          DURATION: ${{ inputs.duration }}
        run: |
          set -euo pipefail
          WINDOW_MINUTES="$(python - "$DURATION" <<'PY'
          import sys,re
          raw=sys.argv[1].strip().lower()
          m=re.fullmatch(r'(\d+)h(?:(\d+)m)?',raw)
          if m:
              print(int(m.group(1))*60 + int(m.group(2) or 0))
          elif raw.endswith('m'):
              print(int(raw[:-1]))
          else:
              raise SystemExit(f"Unsupported duration: {raw}")
          PY
          )"
          echo "window_minutes=$WINDOW_MINUTES" >> "$GITHUB_OUTPUT"
          echo "Persistent research window: $WINDOW_MINUTES minutes."

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Load latest successful Forge research evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p builder/working/prior-research
          curl --fail-with-body -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/autobot-forge-parallel-run.yml/runs?status=success&per_page=10" \
            > /tmp/forge-successful-runs.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/forge-successful-runs.json'))
          print(d.get('workflow_runs',[{}])[0].get('id',''))
          PY
          RUN_ID="$(python - <<'PY'
          import json
          d=json.load(open('/tmp/forge-successful-runs.json'))
          print(d.get('workflow_runs',[{}])[0].get('id',''))
          PY
          )"
          if [ -z "$RUN_ID" ]; then
            echo "No previous successful Forge run found; starting with catalog evidence."
            exit 0
          fi
          curl --fail-with-body -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
            > /tmp/forge-artifacts.json
          ART_ID="$(python - <<'PY'
          import json
          d=json.load(open('/tmp/forge-artifacts.json'))
          xs=[x for x in d.get('artifacts',[]) if x.get('name','').startswith('autobot-research-harvest-') and not x.get('expired')]
          print(xs[0]['id'] if xs else '')
          PY
          )"
          if [ -z "$ART_ID" ]; then
            echo "No research harvest artifact found in previous successful Forge run."
            exit 0
          fi
          curl --fail-with-body -L -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/artifacts/$ART_ID/zip" \
            -o /tmp/prior-research.zip
          unzip -o /tmp/prior-research.zip -d builder/working/prior-research >/dev/null
          echo "Loaded prior Forge research harvest from run $RUN_ID."
      - name: Validate shared research trial runner
        run: node --check builder/runner/autobot-research-trial.mjs
      - name: Generate research experiment queue
        id: plan
        env:
          AUTOBOT_PRIOR_RESEARCH: builder/working/prior-research/autobot-research-next-cycle.json
        run: node scripts/autobot/plan-research-swarm.mjs
      - name: Upload research queue manifest
        uses: actions/upload-artifact@v7
        with:
          name: autobot-research-queue-${{ github.run_id }}
          path: builder/working/research-matrix.json
          if-no-files-found: error

  research:
    name: 🔬 Research — ${{ matrix.slot }} / ${{ matrix.domain }} / ${{ matrix.strategy }}
    needs: [production-start-gate, research-plan]
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.research-plan.outputs.matrix) }}
    uses: ./.github/workflows/autobot-research-swarm.yml
    with:
      local_model: ${{ inputs.local_model }}
      lane: ${{ matrix.domain }}
      strategy: ${{ matrix.strategy }}
      experiment_id: ${{ matrix.experiment_id }}
      research_question: ${{ matrix.research_question }}
      variant: ${{ matrix.variant }}
      queue_slot: ${{ matrix.slot }}
      window_minutes: ${{ needs.research-plan.outputs.window_minutes }}
  research-harvest:
    name: 📚 Harvest research evidence
    needs: research
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Download all research evidence
        uses: actions/download-artifact@v7
        with:
          pattern: autobot-research-*
          path: builder/working/research-harvest/raw
          merge-multiple: false
      - name: Aggregate research results and next-cycle lessons
        run: node scripts/autobot/harvest-research-swarm.mjs
      - name: Guarantee a research harvest artifact
        if: always()
        run: |
          set -euo pipefail
          mkdir -p builder/working/research-harvest
          if [ ! -f builder/working/research-harvest/autobot-research-harvest.json ]; then
            cat > builder/working/research-harvest/autobot-research-harvest.json <<'EOF'
          {"schemaVersion":"autobot-research-harvest-v1","generatedAt":"","purpose":"Fallback evidence record because aggregation failed.","sources":[],"totals":{"lanes":0,"experiments":0,"successful":0,"failed":0,"materialised":0,"retainedExperiments":0,"truncated":false,"uniqueSignalSignatures":0,"duplicateExperiments":0,"reproducedSuccessfulSignals":0},"byLane":{},"byStrategy":{},"byFailureClass":{"harvest-failure":1},"topSignals":[],"promising":[],"experiments":[]}
          EOF
          fi
          if [ ! -f builder/working/research-harvest/autobot-research-next-cycle.json ]; then
            cat > builder/working/research-harvest/autobot-research-next-cycle.json <<'EOF'
          {"schemaVersion":"autobot-research-next-cycle-v2","generatedAt":"","observedFailureClasses":{"harvest-failure":1},"topSignals":[],"candidateWorkerIdeas":[],"retestTargets":[],"productionHandoff":{"purpose":"Fallback advisory handoff after research harvest failure.","promising":[],"topSignals":[],"candidateWorkerIdeas":[],"retestTargets":[],"failureClasses":{"harvest-failure":1}}}
          EOF
          fi

      - name: Upload research harvest
        uses: actions/upload-artifact@v7
        with:
          name: autobot-research-harvest-${{ github.run_id }}
          path: |
            builder/working/research-harvest/autobot-research-harvest.json
            builder/working/research-harvest/autobot-research-next-cycle.json
          if-no-files-found: error

      - name: Persist next-cycle Forge research handoff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "Bikeztagram Forge Research"
          git config user.email "autobot-research@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin autobot/research-handoff >/dev/null 2>&1; then
            git fetch origin +refs/heads/autobot/research-handoff:refs/remotes/origin/autobot/research-handoff
            git switch -C autobot/research-handoff refs/remotes/origin/autobot/research-handoff
          else
            git switch -c autobot/research-handoff
          fi
          mkdir -p builder/brain
          cp builder/working/research-harvest/autobot-research-next-cycle.json builder/brain/autobot-forge-next-cycle.json
          BYTES=$(wc -c < builder/brain/autobot-forge-next-cycle.json)
          test "$BYTES" -lt 5000000
          echo "Next-cycle handoff size: ${BYTES} bytes"
          git add builder/brain/autobot-forge-next-cycle.json
          if git diff --cached --quiet; then
            echo "Research handoff unchanged; nothing to commit."
          else
            git commit -m "research: persist next-cycle Forge handoff"
            git push origin HEAD:autobot/research-handoff
          fi
  lab-trials:
    name: 🧪 Builder Lab — ${{ matrix.slot }} / ${{ matrix.role }}
    needs: [research-harvest]
    if: needs.research-harvest.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - slot: lab-trial-1
            branch: autobot/lab-trial-1
            role: evolution-architect
          - slot: lab-trial-2
            branch: autobot/lab-trial-2
            role: free-agent-stack
          - slot: lab-trial-3
            branch: autobot/lab-trial-3
            role: product-breakthrough
          - slot: lab-trial-4
            branch: autobot/lab-trial-4
            role: speed-recovery
          - slot: lab-trial-5
            branch: autobot/lab-trial-5
            role: champion-synthesizer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout workflow/main toolchain
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Checkout persistent isolated trial branch
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
          path: trial-branch
          fetch-depth: 0

      - name: Download harvested research evidence
        uses: actions/download-artifact@v7
        with:
          name: autobot-research-harvest-${{ github.run_id }}
          path: /tmp/trial-research
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Start isolated local model
        timeout-minutes: 20
        run: bash scripts/autobot/install-local-brain.sh
        env:
          LOCAL_AI_MODEL: ${{ inputs.local_model }}
          AUTOBOT_DISCOVERY_MODEL: qwen2.5-coder:3b
          LOCAL_AI_PROXY_NUM_CTX: 12288
          LOCAL_AI_PROXY_NUM_PREDICT: 2200
          OLLAMA_CONTEXT_LENGTH: 12288
          OLLAMA_NUM_PARALLEL: 1
          OLLAMA_MAX_QUEUE: 2
          OLLAMA_LOAD_TIMEOUT: 20m
          OLLAMA_KEEP_ALIVE: 30m

      - name: Run competing trial builder
        id: trial
        continue-on-error: true
        env:
          LOCAL_AI_MODEL: ${{ inputs.local_model }}
          LOCAL_AI_READY: '1'
          TRIAL_ROLE: ${{ matrix.role }}
          TRIAL_BRANCH: ${{ matrix.branch }}
          TRIAL_PEER_BRANCHES: autobot/lab-trial-1,autobot/lab-trial-2,autobot/lab-trial-3,autobot/lab-trial-4,autobot/lab-trial-5
          TRIAL_RESEARCH_DIR: /tmp/trial-research
          TRIAL_MODEL_TIMEOUT_MS: '120000'
          TRIAL_MAX_EXPERIMENTS: '6'
          TRIAL_WINDOW_MS: '1200000'
        run: |
          set +e
          cd trial-branch && node builder/trial-builder/engine.mjs
          RC=$?
          echo "trial_exit=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify trial branch scope and persist experiment
        env:
          TRIAL_EXIT: ${{ steps.trial.outputs.trial_exit }}
        run: |
          set -euo pipefail
          git -C trial-branch config user.name "Bikeztagram Builder Lab"
          git -C trial-branch config user.email "autobot-lab@users.noreply.github.com"
          mapfile -t changed < <(git -C trial-branch status --short | awk '{print $2}' | sed '/^$/d')
          for path in "${changed[@]}"; do
            case "$path" in
              builder/trial-builder/*) ;;
              *) echo "Trial builder attempted an out-of-scope change: $path" >&2; git -C trial-branch reset --hard HEAD; git -C trial-branch clean -fd; exit 1 ;;
            esac
          done
          node trial-branch/builder/trial-builder/engine.mjs --self-test
          git -C trial-branch diff --check
          git -C trial-branch add builder/trial-builder
          if git -C trial-branch diff --cached --quiet; then
            echo "No trial state/code change was produced; preserving prior trial branch state."
            exit 0
          fi
          git -C trial-branch commit -m "trial: persist ${{ matrix.role }} experiment"
          git -C trial-branch push origin HEAD:${{ matrix.branch }}
          echo "Persisted ${{ matrix.role }} trial experiment (engine exit $TRIAL_EXIT)."

      - name: Upload trial evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autobot-builder-lab-${{ matrix.slot }}-${{ github.run_id }}
          path: |
            trial-branch/builder/trial-builder/state.json
            trial-branch/builder/trial-builder/CONTRACT.md
          if-no-files-found: warn

  lab-trial-harvest:
    name: 📚 Harvest five builder-lab trials
    needs: [lab-trials]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Download builder-lab trial evidence
        uses: actions/download-artifact@v7
        with:
          pattern: autobot-builder-lab-*
          path: builder/working/lab-trial-harvest/raw
          merge-multiple: false
      - name: Build lab benchmark summary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, datetime
          root=pathlib.Path('builder/working/lab-trial-harvest/raw')
          trials=[]
          for p in root.rglob('state.json'):
              try:
                  d=json.loads(p.read_text())
                  trials.append({
                    'source':str(p.relative_to(root)),
                    'trialRole':d.get('trialRole'),
                    'experiment':d.get('experiment',0),
                    'nextHypothesis':d.get('nextHypothesis'),
                    'historyTail':d.get('history',[])[-3:]
                  })
              except Exception:
                  pass
          out={
            'schemaVersion':'autobot-builder-lab-harvest-v1',
            'generatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'trialCount':len(trials),
            'trials':trials,
            'purpose':'Evidence for selecting and evolving the strongest free general-purpose AutoBot.'
          }
          pathlib.Path('builder/working/lab-trial-harvest/autobot-builder-lab-next-cycle.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps({'trialCount':len(trials)},indent=2))
          PY
      - name: Upload builder-lab benchmark
        uses: actions/upload-artifact@v7
        with:
          name: autobot-builder-lab-harvest-${{ github.run_id }}
          path: builder/working/lab-trial-harvest/autobot-builder-lab-next-cycle.json
          if-no-files-found: error
