name: Bikeztagram Generation Job Adapter V1
on:
  push:
    branches: [parallel/batch-34-generation-job-adapters]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/verify-generation-job-adapter-v1.mjs
