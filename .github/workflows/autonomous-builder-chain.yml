name: Autonomous Builder Queue Chain

# Intentionally disabled while AutoBot V2 gains explicit runtime controls.
# Each run is started manually so the user chooses 15m–6h and can observe it.
# The long-run executor checkpoints after verified units, so a later run can resume.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual maintenance trigger only'
        required: false
        default: 'disabled'
        type: string

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Automatic queue chaining is disabled. Start Autonomous Builder Batch manually and choose its runtime.'
