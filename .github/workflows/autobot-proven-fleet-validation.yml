name: 🧪 AutoBot Proven Fleet Validation

on:
  pull_request:
    paths:
      - '.github/workflows/autobot-parallel-proven.yml'
      - 'builder/runner/proven-fleet-worker.mjs'
      - 'builder/runner/proven-builder-recovery.mjs'
      - 'scripts/autobot/create-parallel-proven-packages.mjs'
      - 'scripts/autobot/write-proven-worker-outcome.mjs'
      - 'scripts/autobot/publish-proven-worker-candidate.mjs'
      - 'scripts/autobot/verify-autobot-parallel-proven.mjs'
      - 'builder/runner/autobot-completed-work.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: ''
      - run: npm install --no-audit --no-fund --no-package-lock
      - name: Syntax-check new fleet code
        run: |
          set -euo pipefail
          node --check builder/runner/proven-fleet-worker.mjs
          node --check builder/runner/proven-builder-recovery.mjs
          node --check scripts/autobot/create-parallel-proven-packages.mjs
          node --check scripts/autobot/write-proven-worker-outcome.mjs
          node --check scripts/autobot/publish-proven-worker-candidate.mjs
          node --check scripts/autobot/verify-autobot-parallel-proven.mjs
      - name: Verify fleet contract
        run: node scripts/autobot/verify-autobot-parallel-proven.mjs
      - name: Verify existing recovery contracts
        run: |
          npm run verify:autobot-fleet-recovery
          npm run verify:autobot-production-gate
      - name: Build product
        run: npm run build
