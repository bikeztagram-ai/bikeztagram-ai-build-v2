name: 🧪 AutoBot Proven Fleet Validation
on:
  pull_request:
    paths:
      - '.github/workflows/autobot-parallel-specialists.yml'
      - '.github/workflows/autobot-proven-fleet-validation.yml'
      - 'builder/runner/**'
      - 'scripts/autobot/**'
      - 'builder/brain/**'
      - 'builder/quality/**'
      - 'package.json'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: node scripts/autobot/verify-autobot-parallel-proven.mjs
      - run: node scripts/autobot/verify-autobot-fleet-foundation.mjs
      - run: npm run verify:autobot-production-gate
      - run: npm run build
