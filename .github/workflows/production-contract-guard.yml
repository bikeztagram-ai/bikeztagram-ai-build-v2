name: Production Contract Guard

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  production-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect protected production changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          protected='^(vercel\.json|api/blob-presign\.js|api/upload\.js|api/analyse-library\.js|api/render\.js|\.env\.example|docs/PRODUCTION-CONTRACT\.md|\.github/workflows/production-contract-guard\.yml)$'
          if echo "$changed" | grep -Eq "$protected"; then
            if git log --format=%s "$BASE_SHA..$HEAD_SHA" | grep -Fq "[production-contract-approved]"; then
              echo "Protected change explicitly approved by a reviewed commit marker in this PR."
              exit 0
            fi
            echo "Protected production contract files changed."
            echo "Explicit production-contract approval is required."
            echo "A deliberately reviewed contract change must carry [production-contract-approved] in a commit in this PR."
            exit 1
          fi
          echo "No protected production contract files changed."
