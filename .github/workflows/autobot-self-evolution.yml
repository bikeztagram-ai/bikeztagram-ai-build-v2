name: 🧠 AutoBot Self-Evolution ONLY (LOCKED)

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Self-evolution work time budget'
        required: false
        default: '30m'
        type: choice
        options: ['15m','30m','1h','2h','3h','4h','5h','6h']

concurrency:
  group: autobot-self-evolution-only
  cancel-in-progress: false

permissions:
  contents: read

env:
  REQUESTED_DURATION: ${{ inputs.duration }}
  LOCAL_AI_MODEL: qwen2.5-coder:7b
  AUTOBOT_AIDER_MODEL: ollama_chat/qwen2.5-coder:7b
  AUTOBOT_FEATURE_ENGINE: aider
  AUTOBOT_FEATURE_FOCUS: self-improvement-only
  BUILDER_BASE_BRANCH: main
  AUTOBOT_SELF_EVOLUTION_REF: fix/autobot-product-review-self-improvement-v2
  AUTOBOT_MIN_SELF_EVOLUTION_SHA: 2af5489d6026e2cd89c9b7df1cbeef2b002c1669
  AUTOBOT_AIDER_CALL_TIMEOUT_MS: 900000
  AUTOBOT_VERIFICATION_RESERVE_MS: 90000

jobs:
  self-evolution:
    name: Self-evolution (product work locked)
    runs-on: ubuntu-latest
    timeout-minutes: 370
    steps:
      - name: Checkout locked AutoBot self-evolution ref
        uses: actions/checkout@v5
        with:
          ref: fix/autobot-product-review-self-improvement-v2
          fetch-depth: 0

      - name: Prove this is the current locked self-evolution runner
        run: |
          set -euo pipefail
          test "$AUTOBOT_FEATURE_FOCUS" = 'self-improvement-only'
          test "$AUTOBOT_FEATURE_ENGINE" = 'aider'
          test "$AUTOBOT_SELF_EVOLUTION_REF" = 'fix/autobot-product-review-self-improvement-v2'
          test "$(git branch --show-current)" = 'fix/autobot-product-review-self-improvement-v2'
          git merge-base --is-ancestor "$AUTOBOT_MIN_SELF_EVOLUTION_SHA" HEAD
          test "$LOCAL_AI_MODEL" = 'qwen2.5-coder:7b'
          test "$AUTOBOT_AIDER_MODEL" = 'ollama_chat/qwen2.5-coder:7b'
          echo "[autobot] EXECUTION REF: $(git branch --show-current)"
          echo "[autobot] EXECUTION SHA: $(git rev-parse HEAD)"
          echo "[autobot] REQUIRED FIX BASE: $AUTOBOT_MIN_SELF_EVOLUTION_SHA"
          echo "[autobot] PRIMARY SELF-EVOLUTION MODEL: $LOCAL_AI_MODEL"
          grep -q "aider-repo-map-v7-bounded-learning" builder/runner/aider-feature-brain.mjs
          grep -q "selfImprovementOnly?featureCycles<maxFeatureCycles" builder/runner/long-run-executor.mjs
          grep -q '"mode": "self-evolution-only"' builder/runner/autobot-evolution-policy.json
          grep -q '"productWorkLocked": true' builder/runner/autobot-evolution-policy.json
          grep -q '"kind": "self-improvement"' builder/brain/feature-objectives.json
          echo '[autobot] LOCK VERIFIED: SELF-EVOLUTION ONLY'
          echo '[autobot] PRODUCT/DETERMINISTIC WORK: LOCKED'

      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Install Aider engine
        run: python -m pip install --disable-pip-version-check --no-input aider-chat

      - name: Cache local AI model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: bikeztagram-local-ai-${{ runner.os }}-qwen2.5-coder-7b

      - name: Start local AI brain
        env:
          LOCAL_AI_MODEL: qwen2.5-coder:7b
        run: bash scripts/autobot/install-local-brain.sh

      - name: Start performance proxy
        run: |
          set -euo pipefail
          nohup node builder/runner/ollama-performance-proxy.mjs >/tmp/bikeztagram-ollama-proxy.log 2>&1 &
          proxy_ready=false
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11435/health >/dev/null 2>&1; then
              proxy_ready=true
              break
            fi
            sleep 1
          done
          if [ "$proxy_ready" != true ]; then
            echo '[autobot] Performance proxy failed to start.'
            cat /tmp/bikeztagram-ollama-proxy.log || true
            exit 1
          fi
          echo 'OLLAMA_HOST=http://127.0.0.1:11435' >> "$GITHUB_ENV"
          echo 'LOCAL_AI_FEATURE_TIMEOUT_SECONDS=120' >> "$GITHUB_ENV"
          echo 'AUTOBOT_FEATURE_MAX_ATTEMPTS=2' >> "$GITHUB_ENV"
          echo 'AUTOBOT_FEATURE_MAX_EDITS=2' >> "$GITHUB_ENV"
          echo 'AUTOBOT_FEATURE_PASSES_PER_SLICE=3' >> "$GITHUB_ENV"
          echo 'AUTOBOT_FEATURE_ENGINE=aider' >> "$GITHUB_ENV"
          echo 'AUTOBOT_FEATURE_FOCUS=self-improvement-only' >> "$GITHUB_ENV"
          echo 'LOCAL_AI_PROXY_NUM_CTX=8192' >> "$GITHUB_ENV"
          echo 'LOCAL_AI_PROXY_NUM_PREDICT=1500' >> "$GITHUB_ENV"
          echo '[autobot] PERFORMANCE PROXY READY'

      - name: Resolve self-evolution duration
        run: |
          set -euo pipefail
          case "$REQUESTED_DURATION" in
            15m) minutes=15;;
            30m) minutes=30;;
            1h) minutes=60;;
            2h) minutes=120;;
            3h) minutes=180;;
            4h) minutes=240;;
            5h) minutes=300;;
            6h) minutes=360;;
            *) echo "Unsupported duration: $REQUESTED_DURATION"; exit 1;;
          esac
          echo "BUILDER_MAX_MINUTES=$minutes" >> "$GITHUB_ENV"
          echo 'BUILDER_MAX_UNITS=0' >> "$GITHUB_ENV"
          echo 'AUTOBOT_MAX_FEATURE_CYCLES=24' >> "$GITHUB_ENV"
          echo 'AUTOBOT_FEATURE_SLICE_MINUTES=15' >> "$GITHUB_ENV"
          echo '[autobot] SELF-EVOLUTION ONLY: product/deterministic work is locked'
          echo "[autobot] TIME BUDGET: ${minutes}m"

      - name: Validate self-evolution controls
        run: |
          set -euo pipefail
          node --check builder/runner/aider-feature-brain.mjs
          node --check builder/runner/self-improvement-planner.mjs
          node --check builder/runner/long-run-executor.mjs
          node --check builder/runner/ollama-performance-proxy.mjs
          npm run verify:autobot-objective-paths
          node scripts/autobot/verify-self-evolution-runtime.mjs
          node scripts/autobot/verify-self-improvement-boundary.mjs
          node scripts/autobot/verify-autobot-safety-contract-v2.mjs
          npm run build

      - name: Run locked self-evolution loop
        run: node builder/runner/long-run-executor.mjs

      - name: Verify final audit integrity
        if: always()
        run: node builder/quality/audit-log.mjs

      - name: Capture self-evolution evidence
        if: always()
        run: |
          mkdir -p autobot-self-evolution-evidence
          git status --short > autobot-self-evolution-evidence/git-status.txt || true
          git diff --binary > autobot-self-evolution-evidence/self-evolution.patch || true
          git rev-parse HEAD > autobot-self-evolution-evidence/execution-sha.txt || true
          printf 'required_fix_base=%s\n' "$AUTOBOT_MIN_SELF_EVOLUTION_SHA" > autobot-self-evolution-evidence/execution-contract.txt
          printf 'primary_model=%s\n' "$LOCAL_AI_MODEL" >> autobot-self-evolution-evidence/execution-contract.txt
          printf 'aider_model=%s\n' "$AUTOBOT_AIDER_MODEL" >> autobot-self-evolution-evidence/execution-contract.txt
          cp builder/working/aider-feature-brain-learning.json autobot-self-evolution-evidence/learning.json 2>/dev/null || true
          cp builder/working/aider-feature-brain-state.json autobot-self-evolution-evidence/state.json 2>/dev/null || true
          cp builder/working/long-run-state.json autobot-self-evolution-evidence/long-run-state.json 2>/dev/null || true
          cp builder/working/autobot-audit.jsonl autobot-self-evolution-evidence/autobot-audit.jsonl 2>/dev/null || true
          cp /tmp/bikeztagram-ollama-proxy.log autobot-self-evolution-evidence/ollama-proxy.log 2>/dev/null || true

      - name: Upload self-evolution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autobot-self-evolution-${{ github.run_id }}
          path: autobot-self-evolution-evidence/
          if-no-files-found: ignore
          retention-days: 14
