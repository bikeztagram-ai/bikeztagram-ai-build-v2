name: 🧠 AutoBot Self-Evolution ONLY (LOCKED)

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Self-evolution work time budget'
        required: false
        default: '15m'
        type: choice
        options: ['15m','30m','1h','2h','3h','4h','5h','6h']
      local_model:
        description: 'Open-source local coding model'
        required: false
        default: 'qwen2.5-coder:7b'
        type: string

concurrency:
  group: autobot-self-evolution-only
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  REQUESTED_DURATION: ${{ inputs.duration }}
  LOCAL_AI_MODEL: ${{ inputs.local_model }}
  AUTOBOT_AIDER_MODEL: ollama_chat/${{ inputs.local_model }}
  AUTOBOT_FEATURE_ENGINE: aider
  AUTOBOT_FEATURE_FOCUS: self-improvement-only
  BUILDER_BASE_BRANCH: main
  AUTOBOT_SELF_EVOLUTION_REF: fix/autobot-product-review-self-improvement-v2

jobs:
  self-evolution:
    name: Self-evolution (product work locked)
    runs-on: ubuntu-latest
    timeout-minutes: 370
    steps:
      - name: Checkout locked AutoBot self-evolution ref
        uses: actions/checkout@v5
        with:
          ref: fix/autobot-product-review-self-improvement-v2
          fetch-depth: 0

      - name: Prove this is the locked self-evolution runner
        run: |
          set -euo pipefail
          test "$AUTOBOT_FEATURE_FOCUS" = 'self-improvement-only'
          test "$AUTOBOT_FEATURE_ENGINE" = 'aider'
          test "$AUTOBOT_SELF_EVOLUTION_REF" = 'fix/autobot-product-review-self-improvement-v2'
          test "$(git branch --show-current)" = 'fix/autobot-product-review-self-improvement-v2'
          grep -q "const selfImprovementOnly=process.env.AUTOBOT_FEATURE_FOCUS==='self-improvement-only'" builder/runner/long-run-executor.mjs
          grep -q "selfImprovementOnly?featureCycles<maxFeatureCycles" builder/runner/long-run-executor.mjs
          grep -q '"mode": "self-evolution-only"' builder/runner/autobot-evolution-policy.json
          grep -q '"productWorkLocked": true' builder/runner/autobot-evolution-policy.json
          grep -q '"kind": "self-improvement"' builder/brain/feature-objectives.json
          echo '[autobot] LOCK VERIFIED: SELF-EVOLUTION ONLY'
          echo '[autobot] PRODUCT/DETERMINISTIC WORK: LOCKED'

      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Install Aider engine
        run: python -m pip install --disable-pip-version-check --no-input aider-chat

      - name: Cache local AI model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: bikeztagram-local-ai-${{ runner.os }}-${{ inputs.local_model }}

      - name: Start local AI brain
        env:
          LOCAL_AI_MODEL: ${{ inputs.local_model }}
        run: bash scripts/autobot/install-local-brain.sh

      - name: Resolve self-evolution duration
        run: |
          set -euo pipefail
          case "$REQUESTED_DURATION" in
            15m) minutes=15;;
            30m) minutes=30;;
            1h) minutes=60;;
            2h) minutes=120;;
            3h) minutes=180;;
            4h) minutes=240;;
            5h) minutes=300;;
            6h) minutes=360;;
            *) echo "Unsupported duration: $REQUESTED_DURATION"; exit 1;;
          esac
          echo "BUILDER_MAX_MINUTES=$minutes" >> "$GITHUB_ENV"
          echo 'BUILDER_MAX_UNITS=0' >> "$GITHUB_ENV"
          echo 'AUTOBOT_FEATURE_PASSES_PER_SLICE=2' >> "$GITHUB_ENV"
          echo 'AUTOBOT_MAX_FEATURE_CYCLES=24' >> "$GITHUB_ENV"
          echo 'AUTOBOT_FEATURE_SLICE_MINUTES=15' >> "$GITHUB_ENV"
          echo '[autobot] SELF-EVOLUTION ONLY: product/deterministic work is locked'

      - name: Validate self-evolution controls
        run: |
          set -euo pipefail
          node --check builder/runner/aider-feature-brain.mjs
          node --check builder/runner/self-improvement-planner.mjs
          node --check builder/runner/long-run-executor.mjs
          node scripts/autobot/verify-self-improvement-boundary.mjs
          node scripts/autobot/verify-aider-feature-engine.mjs
          node scripts/autobot/verify-autobot-safety-contract-v2.mjs
          npm run build

      - name: Run locked self-evolution loop
        run: node builder/runner/long-run-executor.mjs

      - name: Verify final audit integrity
        if: always()
        run: node builder/quality/audit-log.mjs

      - name: Capture self-evolution evidence
        if: always()
        run: |
          mkdir -p autobot-self-evolution-evidence
          git status --short > autobot-self-evolution-evidence/git-status.txt || true
          git diff --binary > autobot-self-evolution-evidence/self-evolution.patch || true
          cp builder/working/aider-feature-brain-learning.json autobot-self-evolution-evidence/learning.json 2>/dev/null || true
          cp builder/working/aider-feature-brain-state.json autobot-self-evolution-evidence/state.json 2>/dev/null || true
          cp builder/working/long-run-state.json autobot-self-evolution-evidence/long-run-state.json 2>/dev/null || true
          cp builder/working/autobot-audit.jsonl autobot-self-evolution-evidence/autobot-audit.jsonl 2>/dev/null || true

      - name: Upload self-evolution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autobot-self-evolution-${{ github.run_id }}
          path: autobot-self-evolution-evidence/
          if-no-files-found: ignore
