name: 🧩 AutoBot Isolated Specialist Swarm

on:
  workflow_dispatch:
    inputs:
      duration:
        description: Per-specialist execution budget
        required: true
        default: 15m
        type: choice
        options: ['15m','30m','1h','4h','5h','5h30']
      local_model:
        description: Aider/local coding model
        required: false
        default: qwen2.5-coder:7b
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: autobot-isolated-specialist-swarm
  cancel-in-progress: false

env:
  LOCAL_AI_MODEL: ${{ inputs.local_model }}
  AUTOBOT_DISCOVERY_MODEL: qwen2.5-coder:3b
  AUTOBOT_SPECIALIST_FALLBACK_MODEL: qwen2.5-coder:3b
  AUTOBOT_SPECIALIST_FALLBACK_MINUTES: '4'
  AUTOBOT_SPECIALIST_PRODUCT_QUALITY_CHECK: npm run verify:autobot-product-change-quality
  AUTOBOT_COORDINATION_ID: isolated-swarm-${{ github.run_id }}

jobs:
  isolated-specialists:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - bot: director-builder
            name: 🎬 Director AutoBot
            strategy: diff-root-single
            objective: |
              Production Director lane: make exactly one minimal cinematic story-intelligence behaviour improvement in src/director.js.
              Preserve existing APIs and contracts.
              Acceptance:
              - improve prompt-sensitive director decisions or shot/story selection
              - only src/director.js may be a product-file change
              - syntax, build and product-quality verification pass
              - leave a verified candidate handoff when valid
          - bot: timeline-builder
            name: ⏱️ Timeline AutoBot
            strategy: whole-root-single
            objective: |
              Production Timeline lane: make exactly one minimal executable-timeline behaviour improvement in src/executableTimeline.js.
              Preserve existing APIs and contracts.
              Acceptance:
              - improve source-aware timing, motion, transition or executable cut continuity
              - only src/executableTimeline.js may be a product-file change
              - do not modify editorialRhythm.js or renderer.js from this specialist
              - syntax, build and product-quality verification pass
              - leave a verified candidate handoff when valid
          - bot: music-builder
            name: 🎵 Music AutoBot
            strategy: udiff-root-single
            objective: |
              Production Music lane: make exactly one minimal prompt-responsive music-energy behaviour improvement in src/musicDirector.js.
              Preserve existing APIs and contracts.
              Acceptance:
              - energy responds to driving, fast or action creative intent
              - only src/musicDirector.js may be a product-file change
              - syntax, build and product-quality verification pass
              - leave a verified candidate handoff when valid
          - bot: scene-builder
            name: 🎥 Scene AutoBot
            strategy: diff-src-single
            objective: |
              Production Scene lane: make exactly one minimal duration-bounded scene-shot continuity behaviour improvement in src/universalCreativeSceneEngine.js.
              Preserve existing APIs and contracts.
              Acceptance:
              - scene shot count remains bounded and scales with duration
              - only src/universalCreativeSceneEngine.js may be a product-file change
              - syntax, build and product-quality verification pass
              - leave a verified candidate handoff when valid

          - bot: rhythm-builder
            name: 🥁 Rhythm AutoBot
            strategy: whole-src-single
            objective: |
              Production Rhythm lane: make exactly one minimal beat-aware editorial pacing behaviour improvement in src/editorialRhythm.js.
              Preserve existing APIs and contracts.
              Acceptance:
              - improve duration distribution or creative-intent pacing without exceeding the requested target budget
              - only src/editorialRhythm.js may be a product-file change
              - syntax, build and product-quality verification pass
              - leave a verified candidate handoff when valid
          - bot: media-intelligence-builder
            name: 🧠 Media Intelligence AutoBot
            strategy: udiff-nomap
            objective: |
              Production Media Intelligence lane: make exactly one minimal media-analysis behaviour improvement in src/aiEditPlanner.js.
              Preserve existing APIs and contracts.
              Acceptance:
              - improve local media interpretation or source-aware planning behaviour
              - only src/aiEditPlanner.js may be a product-file change
              - syntax, build and product-quality verification pass
              - leave a verified candidate handoff when valid

          - bot: caption-builder
            name: 📝 Caption AutoBot
            strategy: adaptive-single
            objective: |
              Production Caption lane: make exactly one minimal caption-planning behaviour improvement in src/captionPlanner.js.
              Preserve existing APIs and contracts.
              Acceptance:
              - improve context-aware caption selection or generation behaviour
              - only src/captionPlanner.js may be a product-file change
              - syntax, build and product-quality verification pass
              - leave a verified candidate handoff when valid

          - bot: render-builder
            name: 🎞️ Render AutoBot
            strategy: udiff-src-single
            objective: |
              Production Render lane: make exactly one minimal visible cinematic-rendering behaviour improvement in src/cinematicRendererV3.js.
              Preserve existing APIs and contracts.
              Acceptance:
              - improve transition, motion or visual finishing quality while preserving source decoding and recording reliability
              - only src/cinematicRendererV3.js may be a product-file change
              - syntax, build and product-quality verification pass
              - leave a verified candidate handoff when valid

    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install specialist dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Validate isolated fleet contract
        run: npm run verify:autobot-fleet-foundation
      - name: Install specialist Aider
        run: python -m pip install --disable-pip-version-check --no-input aider-chat
      - name: Start isolated specialist AI brain
        run: bash scripts/autobot/install-local-brain.sh
        env:
          LOCAL_AI_MODEL: ${{ env.LOCAL_AI_MODEL }}
          AUTOBOT_DISCOVERY_MODEL: ${{ env.AUTOBOT_DISCOVERY_MODEL }}
          AUTOBOT_SPECIALIST_FALLBACK_MODEL: ${{ env.AUTOBOT_SPECIALIST_FALLBACK_MODEL }}
          LOCAL_AI_PROXY_NUM_CTX: 4096
          LOCAL_AI_PROXY_NUM_PREDICT: 900
          OLLAMA_CONTEXT_LENGTH: 4096
          OLLAMA_NUM_PARALLEL: 1
          OLLAMA_MAX_QUEUE: 4
          OLLAMA_LOAD_TIMEOUT: 20m
          OLLAMA_KEEP_ALIVE: 90m
      - name: Start specialist performance proxy
        run: |
          nohup node builder/runner/ollama-performance-proxy.mjs >/tmp/bikeztagram-ollama-proxy.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11435/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:11435/health >/dev/null
          echo 'OLLAMA_HOST=http://127.0.0.1:11435' >> "$GITHUB_ENV"
      - name: Run isolated specialist
        id: execute
        env:
          AUTOBOT_SPECIALIST_BOT_ID: ${{ matrix.bot }}
          AUTOBOT_SPECIALIST_EDIT_STRATEGY: ${{ matrix.strategy }}
          AUTOBOT_SPECIALIST_OBJECTIVE: ${{ matrix.objective }}
          AUTOBOT_SPECIALIST_BUILDER_ENABLED: 'true'
          AUTOBOT_EXPERIMENTAL_WORKER: 'false'
          AUTOBOT_BASE_REF: ${{ github.sha }}
          AUTOBOT_AIDER_MODEL: ${{ env.LOCAL_AI_MODEL }}
          AUTOBOT_SPECIALIST_PRODUCT_QUALITY_CHECK: ${{ env.AUTOBOT_SPECIALIST_PRODUCT_QUALITY_CHECK }}
          AUTOBOT_SPECIALIST_FALLBACK_MODEL: ${{ env.AUTOBOT_SPECIALIST_FALLBACK_MODEL }}
          AUTOBOT_SPECIALIST_FALLBACK_MINUTES: ${{ env.AUTOBOT_SPECIALIST_FALLBACK_MINUTES }}
          AUTOBOT_FINISH_GRACE_MINUTES: '0'
          AUTOBOT_SKIP_NPM_INSTALL: 'true'
          AUTOBOT_COORDINATION_ID: ${{ env.AUTOBOT_COORDINATION_ID }}
          BUILDER_MAX_MINUTES: ${{ inputs.duration == '15m' && '15' || inputs.duration == '30m' && '30' || inputs.duration == '1h' && '60' || inputs.duration == '4h' && '60' || '60' }}
        run: node builder/runner/autobot-specialist-builder.mjs
      - name: Publish isolated candidate branch
        if: steps.execute.outcome == 'success'
        run: |
          b="$(node -e "console.log(require('./builder/working/autobot-specialist-handoff.json').branch)")"
          git push --set-upstream origin "$b"
      - name: Upload specialist evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autobot-isolated-specialist-${{ matrix.bot }}-${{ github.run_id }}
          path: |
            builder/working/autobot-specialist-handoff.json
            builder/working/autobot-specialist-outcome.json
            builder/working/autobot-specialist-failure.patch
          if-no-files-found: ignore
      - name: Capture specialist runtime diagnostics
        if: always()
        run: |
          echo '--- specialist outcome ---'
          cat builder/working/autobot-specialist-outcome.json 2>/dev/null || true
          echo '--- specialist handoff ---'
          cat builder/working/autobot-specialist-handoff.json 2>/dev/null || true
          echo '--- Ollama processes ---'
          OLLAMA_HOST=127.0.0.1:11434 ollama ps || true
          echo '--- performance proxy ---'
          tail -n 120 /tmp/bikeztagram-ollama-proxy.log || true

  isolated-fan-in:
    name: 🧩 Isolated Specialist Fan-In
    needs: [isolated-specialists]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Download Director evidence
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: autobot-isolated-specialist-director-builder-${{ github.run_id }}
          path: builder/working/isolated/director
      - name: Download Timeline evidence
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: autobot-isolated-specialist-timeline-builder-${{ github.run_id }}
          path: builder/working/isolated/timeline
      - name: Download Music evidence
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: autobot-isolated-specialist-music-builder-${{ github.run_id }}
          path: builder/working/isolated/music
      - name: Download Scene evidence
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: autobot-isolated-specialist-scene-builder-${{ github.run_id }}
          path: builder/working/isolated/scene

      - name: Download Rhythm evidence
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: autobot-isolated-specialist-rhythm-builder-${{ github.run_id }}
          path: builder/working/isolated/rhythm

      - name: Download Render evidence
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: autobot-isolated-specialist-render-builder-${{ github.run_id }}
          path: builder/working/isolated/render
      - name: Build canonical six-bot fan-in ledger
        env:
          COORDINATION_ID: isolated-swarm-${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p builder/working/fan-in
          for bot in director timeline music scene rhythm render; do
            dir="builder/working/isolated/$bot"
            mkdir -p "$dir"
            handoff="$(find "$dir" -name autobot-specialist-handoff.json -print -quit 2>/dev/null || true)"
            outcome="$(find "$dir" -name autobot-specialist-outcome.json -print -quit 2>/dev/null || true)"
            if [ -z "$handoff" ] && [ -z "$outcome" ]; then
              cat > "$dir/autobot-specialist-outcome.json" <<EOF
          {
            "botId": "$bot-builder",
            "status": "failure",
            "category": "workflow-failure",
            "repairable": true,
            "coordinationId": "$COORDINATION_ID",
            "error": "No worker evidence artifact was produced."
          }
          EOF
              outcome="$dir/autobot-specialist-outcome.json"
            fi
            if [ -n "$handoff" ]; then
              node builder/runner/autobot-independent-fan-in.mjs --coordination-id "$COORDINATION_ID" --handoff "$handoff" --outcome "$outcome" --ledger builder/working/fan-in/autobot-fan-in-ledger.json
            else
              node builder/runner/autobot-independent-fan-in.mjs --coordination-id "$COORDINATION_ID" --outcome "$outcome" --ledger builder/working/fan-in/autobot-fan-in-ledger.json
            fi
          done
          cat builder/working/fan-in/autobot-fan-in-ledger.json
      - name: Upload unified fan-in evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autobot-isolated-specialist-fan-in-${{ github.run_id }}
          path: builder/working/fan-in/autobot-fan-in-ledger.json
          if-no-files-found: ignore
