name: 🏍️ AutoBot Parallel Proven

on:
  workflow_dispatch:
    inputs:
      duration:
        description: Shared proven-worker budget
        required: true
        default: 15m
        type: choice
        options: ['15m','30m','1h','2h','3h','4h','5h','6h']
      local_model:
        description: Proven local coding model
        required: false
        default: qwen2.5-coder:7b
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: autobot-parallel-proven
  cancel-in-progress: false

env:
  LOCAL_AI_MODEL: ${{ inputs.local_model }}
  AUTOBOT_AIDER_MODEL: ollama_chat/${{ inputs.local_model }}
  AUTOBOT_FEATURE_ENGINE: aider
  AUTOBOT_FEATURE_PROTOCOL: aider-repo-map-v4
  AUTOBOT_WORKER_CONFIG_VERSION: proven-builder-fleet-v1
  AUTOBOT_FINISH_GRACE_MINUTES: 5
  BUILDER_BASE_BRANCH: main

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Verify proven builder contracts
        run: |
          set -euo pipefail
          node scripts/autobot/verify-autobot-safety-contract.mjs
          node scripts/autobot/verify-autobot-safety-contract-v2.mjs
          node scripts/autobot/verify-autobot-safety-contract-v3.mjs
          node scripts/autobot/verify-autobot-continuous-loop.mjs
          node scripts/autobot/verify-aider-feature-engine.mjs
          node scripts/autobot/verify-aider-state-recovery.mjs
          node scripts/autobot/verify-autobot-time-budget-policy.mjs
          node builder/quality/autobot-ready.mjs
      - name: Create two independent work packages
        run: node scripts/autobot/create-parallel-proven-packages.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: autobot-proven-packages-${{ github.run_id }}
          path: builder/working/autobot-proven-package-*.json

  proven-workers:
    needs: plan
    if: needs.plan.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        worker: [proven-a, proven-b]
    runs-on: ubuntu-latest
    timeout-minutes: 370
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: autobot-proven-packages-${{ github.run_id }}
          path: builder/working
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Install proven Aider engine
        run: python -m pip install --disable-pip-version-check --no-input aider-chat
      - name: Start proven local AI brain
        run: bash scripts/autobot/install-local-brain.sh
        env:
          LOCAL_AI_MODEL: ${{ inputs.local_model }}
          LOCAL_AI_PROXY_NUM_CTX: 8192
          LOCAL_AI_PROXY_NUM_PREDICT: 2200
          OLLAMA_CONTEXT_LENGTH: 8192
          OLLAMA_NUM_PARALLEL: 1
          OLLAMA_MAX_QUEUE: 8
          OLLAMA_LOAD_TIMEOUT: 20m
          OLLAMA_KEEP_ALIVE: 30m
      - name: Start performance proxy
        run: |
          set -euo pipefail
          nohup node builder/runner/ollama-performance-proxy.mjs >/tmp/bikeztagram-ollama-proxy.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11435/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:11435/health >/dev/null
          echo 'OLLAMA_HOST=http://127.0.0.1:11435' >> "$GITHUB_ENV"
          echo 'LOCAL_AI_FEATURE_TIMEOUT_SECONDS=120' >> "$GITHUB_ENV"
          echo 'AUTOBOT_FEATURE_MAX_ATTEMPTS=2' >> "$GITHUB_ENV"
          echo 'AUTOBOT_FEATURE_MAX_EDITS=2' >> "$GITHUB_ENV"
          echo 'LOCAL_AI_PROXY_NUM_CTX=8192' >> "$GITHUB_ENV"
          echo 'LOCAL_AI_PROXY_NUM_PREDICT=2200' >> "$GITHUB_ENV"
      - name: Select isolated package
        env:
          WORKER: ${{ matrix.worker }}
        run: |
          set -euo pipefail
          case "$WORKER" in
            proven-a) cp builder/working/autobot-proven-package-a.json builder/working/autobot-proven-package.json;;
            proven-b) cp builder/working/autobot-proven-package-b.json builder/working/autobot-proven-package.json;;
            *) exit 1;;
          esac
          cat builder/working/autobot-proven-package.json
      - name: Resolve duration
        run: |
          set -euo pipefail
          case "${{ inputs.duration }}" in
            15m) minutes=15;; 30m) minutes=30;; 1h) minutes=60;; 2h) minutes=120;; 3h) minutes=180;; 4h) minutes=240;; 5h) minutes=300;; 6h) minutes=360;;
            *) echo 'Unsupported duration'; exit 1;;
          esac
          echo "BUILDER_MAX_MINUTES=$minutes" >> "$GITHUB_ENV"
          echo 'BUILDER_MAX_UNITS=1000' >> "$GITHUB_ENV"
      - name: Run proven AutoBot worker
        env:
          AUTOBOT_WORK_PACKAGE_PATH: builder/working/autobot-proven-package.json
          AUTOBOT_PROVEN_WORKER_ID: ${{ matrix.worker }}
        run: node builder/runner/long-run-executor.mjs
      - name: Production verification
        if: success()
        run: |
          npm run verify:autobot-production-gate
          npm run verify:project-memory
          npm run verify:autobot-continuous-loop
          npm run verify:autobot-dependencies
          npm run verify:director-selection-quality
      - name: Capture candidate for downstream Repair Bot
        if: always()
        run: |
          set -euo pipefail
          git diff --binary HEAD -- src package.json public index.html vite.config.js > builder/working/autobot-proven-worker.patch || true
          git rev-parse HEAD > builder/working/autobot-proven-worker-base-sha.txt
          git status --short -- src package.json public index.html > builder/working/autobot-proven-worker-status.txt || true
          node scripts/autobot/write-proven-worker-outcome.mjs || true
      - name: Upload worker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autobot-proven-worker-${{ matrix.worker }}-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            builder/working/deterministic-autobot.json
            builder/working/deterministic-autobot-evidence.json
            builder/working/long-run-state.json
            builder/working/autobot-proven-worker.patch
            builder/working/autobot-proven-worker-base-sha.txt
            builder/working/autobot-proven-worker-status.txt
            builder/working/autobot-proven-worker-outcome.json
            builder/quality/audit-log.jsonl
            /tmp/bikeztagram-ollama-proxy.log
            /tmp/bikeztagram-ollama.log

  recovery:
    needs: [plan, proven-workers]
    if: always() && needs.plan.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        worker: [proven-a, proven-b]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: autobot-proven-worker-${{ matrix.worker }}-${{ github.run_id }}
          path: builder/working/worker-result
      - name: Route only real product failures
        id: route
        run: |
          set -euo pipefail
          repairable=false
          if [ -f builder/working/worker-result/autobot-proven-worker-outcome.json ]; then
            repairable="$(node -e "const x=require('./builder/working/worker-result/autobot-proven-worker-outcome.json'); console.log(x.status==='failure' && x.repairable===true ? 'true':'false')")"
          fi
          echo "repairable=$repairable" >> "$GITHUB_OUTPUT"
      - name: Install recovery dependencies
        if: steps.route.outputs.repairable == 'true'
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Run existing Repair → QA → Reviewer chain
        if: steps.route.outputs.repairable == 'true'
        env:
          AUTOBOT_SPECIALIST_RECOVERY: proven-builder
          AUTOBOT_PROVEN_WORKER_ID: ${{ matrix.worker }}
        run: node builder/runner/proven-builder-recovery.mjs builder/working/worker-result
      - name: Record clean worker handoff
        if: steps.route.outputs.repairable != 'true'
        run: |
          mkdir -p builder/working
          node scripts/autobot/write-proven-worker-handoff.mjs builder/working/worker-result || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autobot-proven-recovery-${{ matrix.worker }}-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            builder/working/autobot-verified-candidate.json
            builder/working/autobot-fleet-recovery.json
            builder/working/autobot-review.json
            builder/working/autobot-repair-candidate.patch
            builder/working/autobot-repair-base-commit.txt
            builder/working/autobot-repair-commit.txt
            builder/working/autobot-proven-handoff.json

  completed-work:
    needs: [plan, proven-workers, recovery]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: autobot-proven-worker-proven-a-${{ github.run_id }}
          path: builder/working/proven-results/proven-a
      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: autobot-proven-worker-proven-b-${{ github.run_id }}
          path: builder/working/proven-results/proven-b
      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: autobot-proven-recovery-proven-a-${{ github.run_id }}
          path: builder/working/proven-results/proven-a/recovery
      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: autobot-proven-recovery-proven-b-${{ github.run_id }}
          path: builder/working/proven-results/proven-b/recovery
      - name: Build completed-work inbox
        run: node builder/runner/autobot-completed-work.mjs builder/working/proven-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autobot-completed-work-${{ github.run_id }}
          if-no-files-found: ignore
          path: builder/working/autobot-completed-work.json
