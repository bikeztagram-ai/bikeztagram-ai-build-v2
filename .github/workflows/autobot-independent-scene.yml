name: 🎬 AutoBot — independent Scene Specialist
on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Immutable base ref for this worker
        required: true
        default: main
        type: string
      coordination_id:
        description: Fan-out/fan-in coordination identifier
        required: true
        type: string
      objective:
        description: Planner objective for the Scene specialist
        required: true
        type: string
      duration:
        description: Worker budget
        required: true
        default: 30m
        type: choice
        options: ['15m','30m','1h']
      local_model:
        description: Local coding model
        required: false
        default: qwen2.5-coder:7b
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: autobot-independent-scene-${{ inputs.coordination_id }}
  cancel-in-progress: false
jobs:
  scene-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.base_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Install Aider
        run: python -m pip install --disable-pip-version-check --no-input aider-chat
      - name: Start isolated local AI brain
        run: bash scripts/autobot/install-local-brain.sh
        env:
          LOCAL_AI_MODEL: ${{ inputs.local_model }}
          AUTOBOT_DISCOVERY_MODEL: qwen2.5-coder:3b
          AUTOBOT_SPECIALIST_FALLBACK_MODEL: qwen2.5-coder:3b
          LOCAL_AI_PROXY_NUM_CTX: 4096
          LOCAL_AI_PROXY_NUM_PREDICT: 900
          OLLAMA_CONTEXT_LENGTH: 4096
          OLLAMA_NUM_PARALLEL: 1
          OLLAMA_MAX_QUEUE: 4
          OLLAMA_LOAD_TIMEOUT: 20m
          OLLAMA_KEEP_ALIVE: 90m
      - name: Run independent Scene specialist
        env:
          AUTOBOT_SPECIALIST_BOT_ID: scene-builder
          AUTOBOT_SPECIALIST_OBJECTIVE: ${{ inputs.objective }}
          AUTOBOT_SPECIALIST_BUILDER_ENABLED: 'true'
          AUTOBOT_EXPERIMENTAL_WORKER: 'true'
          AUTOBOT_BASE_REF: ${{ inputs.base_ref }}
          AUTOBOT_AIDER_MODEL: ${{ inputs.local_model }}
          AUTOBOT_FEATURE_PROTOCOL: aider-diff-v5
          AUTOBOT_SPECIALIST_AIDER_EDIT_FORMAT: diff
          AUTOBOT_SPECIALIST_PRODUCT_QUALITY_CHECK: npm run verify:autobot-product-change-quality
          AUTOBOT_SPECIALIST_FALLBACK_MODEL: qwen2.5-coder:3b
          AUTOBOT_SPECIALIST_FALLBACK_MINUTES: '4'
          AUTOBOT_FINISH_GRACE_MINUTES: '0'
          AUTOBOT_SKIP_NPM_INSTALL: 'true'
          BUILDER_MAX_MINUTES: ${{ inputs.duration == '15m' && '15' || inputs.duration == '30m' && '30' || '60' }}
          AUTOBOT_COORDINATION_ID: ${{ inputs.coordination_id }}
        run: node builder/runner/autobot-specialist-builder.mjs
      - name: Publish candidate branch
        if: success()
        run: |
          b="$(node -e "console.log(require('./builder/working/autobot-specialist-handoff.json').branch)")
          git push --set-upstream origin "$b"
      - name: Upload canonical worker evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autobot-independent-scene-${{ github.run_id }}
          path: |
            builder/working/autobot-specialist-handoff.json
            builder/working/autobot-specialist-outcome.json
            builder/working/autobot-specialist-failure.patch
          if-no-files-found: ignore
