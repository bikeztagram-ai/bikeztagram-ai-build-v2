name: Whole Pipeline Audit

on:
  push:
    branches:
      - parallel/real-pipeline-repair-v1
  pull_request:
    branches:
      - main

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/verify-whole-pipeline-audit.mjs
      - run: npm run build
