name: 🛡️ BIKEZTAGRAM AUTOBOT — CONTROLLED RECOVERY

on:
  workflow_dispatch:
    inputs:
      builder_run_id:
        description: 'Builder workflow run ID whose failure artifact should be recovered'
        required: true
        type: string
      failure_id:
        description: 'Optional Failure Queue id; otherwise the first open failure is used'
        required: false
        default: ''
        type: string
  workflow_run:
    workflows:
      - '🏍️ BIKEZTAGRAM AUTOBOT — PROVEN'
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: autobot-fleet-controlled-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout protected recovery code
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Resolve Builder run id
        env:
          DISPATCH_RUN_ID: ${{ inputs.builder_run_id }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            run_id="$EVENT_RUN_ID"
          else
            run_id="$DISPATCH_RUN_ID"
          fi
          case "$run_id" in
            ''|*[!0-9]*) echo 'Builder run id must be numeric.'; exit 1;;
          esac
          echo "BUILDER_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "[autobot] recovery evidence source run: $run_id"

      - name: Download all Builder failure artifacts
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BUILDER_RUN_ID }}
          path: .autobot-builder-artifacts

      - name: Restore Builder candidate for Repair Bot
        id: candidate
        run: |
          set -euo pipefail
          patch="$(find .autobot-builder-artifacts -type f -name autobot-builder-candidate.patch -print -quit)"
          base="$(find .autobot-builder-artifacts -type f -name autobot-builder-candidate-base-sha.txt -print -quit)"
          queue="$(find .autobot-builder-artifacts -type f -name autobot-failure-queue.jsonl -print -quit)"
          state="$(find .autobot-builder-artifacts -type f -name deterministic-autobot.json -print -quit)"
          evidence="$(find .autobot-builder-artifacts -type f -name deterministic-autobot-evidence.json -print -quit)"
          test -n "$patch" || { echo 'No Builder candidate patch was captured; refusing to repair main without the actual candidate.'; exit 1; }
          test -n "$base" || { echo 'No Builder candidate base SHA was captured.'; exit 1; }
          cp "$patch" builder/working/autobot-builder-candidate.patch
          cp "$base" builder/working/autobot-builder-candidate-base-sha.txt
          [ -n "$queue" ] && cp "$queue" builder/working/autobot-failure-queue.jsonl || true
          [ -n "$state" ] && cp "$state" builder/working/deterministic-autobot.json || true
          [ -n "$evidence" ] && cp "$evidence" builder/working/deterministic-autobot-evidence.json || true
          candidate_base="$(cat builder/working/autobot-builder-candidate-base-sha.txt)"
          git rev-parse --verify "$candidate_base^{commit}" >/dev/null
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$candidate_base")"
          git apply --check builder/working/autobot-builder-candidate.patch
          git apply --whitespace=nowarn builder/working/autobot-builder-candidate.patch
          git diff --check
          if [ -z "$(git diff --name-only)" ]; then
            echo 'Builder candidate patch produced no changes.'
            exit 1
          fi
          git config user.name 'Bikeztagram AutoBot Recovery'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ':!builder/working'
          git commit -m "chore(autobot): restore Builder candidate for repair"
          candidate_commit="$(git rev-parse HEAD)"
          echo "AUTOBOT_REPAIR_BASE_COMMIT=$candidate_commit" >> "$GITHUB_ENV"
          echo "Builder candidate restored at local commit $candidate_commit"

      - name: Validate recovery activation gate
        id: gate
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const registry=JSON.parse(fs.readFileSync('builder/brain/autobot-fleet.json','utf8'));
          const active=registry.enabled===true && registry.coordination?.mode==='active';
          console.log(JSON.stringify({enabled:registry.enabled,mode:registry.coordination?.mode,active}));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`active=${active}\n`);
          if(!active) console.log('[autobot] controlled recovery is installed but remains BLOCKED by the explicit fleet activation gate.');
          NODE

      - name: Verify fleet recovery contract
        if: steps.gate.outputs.active == 'true'
        run: npm run verify:autobot-fleet-recovery

      - name: Run controlled fleet recovery
        if: steps.gate.outputs.active == 'true'
        env:
          FAILURE_ID: ${{ inputs.failure_id }}
          AUTOBOT_REPAIR_BASE_COMMIT: ${{ env.AUTOBOT_REPAIR_BASE_COMMIT }}
        run: |
          set -euo pipefail
          if [ -n "$FAILURE_ID" ]; then
            node builder/runner/autobot-fleet-recovery.mjs recover "$FAILURE_ID"
          else
            node builder/runner/autobot-fleet-recovery.mjs recover
          fi

      - name: Materialise repair patch for integration handoff
        if: steps.gate.outputs.active == 'true'
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const {execFileSync}=require('node:child_process');
          const state=JSON.parse(fs.readFileSync('builder/working/autobot-fleet-recovery.json','utf8'));
          if(state.status!=='verified-candidate') throw new Error(`Cannot materialise an unverified candidate: ${state.status||'missing'}`);
          const base=state.qa?.baseCommit;
          const repair=state.qa?.repairCommit;
          if(!/^[0-9a-f]{40}$/i.test(base)||!/^[0-9a-f]{40}$/i.test(repair)) throw new Error('Verified candidate is missing exact QA commit pair.');
          const patch=execFileSync('git',['diff','--binary',`${base}..${repair}`],{encoding:'utf8'});
          if(!patch.trim()) throw new Error('Verified Repair Bot commit contains no patch.');
          fs.writeFileSync('builder/working/autobot-repair-candidate.patch',patch);
          fs.writeFileSync('builder/working/autobot-repair-base-commit.txt',`${base}\n`);
          fs.writeFileSync('builder/working/autobot-repair-commit.txt',`${repair}\n`);
          NODE

      - name: Create verified-candidate handoff
        if: steps.gate.outputs.active == 'true'
        run: node builder/runner/autobot-verified-candidate-handoff.mjs

      - name: Upload recovery evidence and verified handoff
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autobot-fleet-recovery-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            builder/working/autobot-fleet-recovery.json
            builder/working/autobot-failure-queue.jsonl
            builder/working/autobot-review.json
            builder/working/autobot-verified-candidate.json
            builder/working/autobot-builder-candidate.patch
            builder/working/autobot-builder-candidate-base-sha.txt
            builder/working/autobot-repair-candidate.patch
            builder/working/autobot-repair-base-commit.txt
            builder/working/autobot-repair-commit.txt
