name: 🧪 AutoBot Runtime Smoke

on:
  pull_request:
    paths:
      - 'builder/runner/aider-feature-brain.mjs'
      - 'builder/runner/autobot-specialist-builder.mjs'
      - 'scripts/autobot/verify-local-brain-runtime.sh'
      - '.github/workflows/autobot-runtime-smoke.yml'
  workflow_dispatch:
    inputs:
      local_model:
        description: Local coding model to exercise
        required: false
        default: qwen2.5-coder:7b
        type: string

permissions:
  contents: read

concurrency:
  group: autobot-runtime-smoke
  cancel-in-progress: true

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOCAL_AI_MODEL: ${{ inputs.local_model }}
      AUTOBOT_DISCOVERY_MODEL: qwen2.5-coder:3b
      LOCAL_AI_PROXY_NUM_CTX: 2048
      LOCAL_AI_PROXY_NUM_PREDICT: 128
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Aider engine
        run: python -m pip install --disable-pip-version-check --no-input aider-chat

      - name: Run deterministic local-brain lifecycle smoke test
        run: bash scripts/autobot/verify-local-brain-runtime.sh

      - name: Capture runtime diagnostics
        if: always()
        run: |
          echo '--- Ollama processes ---'
          pgrep -a ollama || true
          echo '--- Ollama listeners ---'
          ss -ltnp | grep -E ':11434|:11435' || true
          echo '--- Ollama server log ---'
          tail -n 160 /tmp/bikeztagram-ollama.log || true
          echo '--- runtime proxy log ---'
          tail -n 160 /tmp/bikeztagram-runtime-smoke-proxy.log || true
          echo '--- Aider runtime log ---'
          tail -n 160 /tmp/bikeztagram-aider-runtime-smoke.log || true

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autobot-runtime-smoke-${{ github.run_id }}
          path: |
            /tmp/bikeztagram-ollama.log
            /tmp/bikeztagram-runtime-smoke-proxy.log
            /tmp/bikeztagram-aider-runtime-smoke.log
          if-no-files-found: ignore
