name: Bikeztagram Autonomous Test

on:
  push:
    branches:
      - ai-director-two-stage
  workflow_dispatch:

permissions:
  contents: write
  deployments: read
  actions: write

jobs:
  deployed-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Download deterministic CC0 test video
        run: |
          mkdir -p tests/fixtures
          curl -L --fail --retry 3 --retry-delay 2 \
            -o tests/fixtures/sample-5mb.mp4 \
            https://cdn.truefilesize.com/mp4/sample-5mb.mp4
          file tests/fixtures/sample-5mb.mp4
          ls -lh tests/fixtures/sample-5mb.mp4

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for Vercel deployment and discover URL
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Waiting for Vercel/GitHub deployment for $SHA"
          for attempt in $(seq 1 60); do
            deployments=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments?sha=${SHA}&per_page=20")
            deployment_id=$(echo "$deployments" | jq -r 'map(select(.environment != null and (.environment | test("preview|Preview")))) | sort_by(.created_at) | last | .id // empty')
            if [ -n "$deployment_id" ]; then
              statuses=$(curl -fsSL \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses")
              state=$(echo "$statuses" | jq -r '.[0].state // empty')
              url=$(echo "$statuses" | jq -r '.[0].environment_url // empty')
              echo "Deployment $deployment_id state=$state url=$url"
              if [ "$state" = "success" ] && [ -n "$url" ]; then
                echo "test_url=$url" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
                echo "Vercel deployment failed."
                exit 1
              fi
            fi
            sleep 10
          done
          echo "Timed out waiting for a successful Vercel deployment status."
          exit 1

      - name: Run deployed end-to-end browser test
        id: smoke
        continue-on-error: true
        env:
          TEST_URL: ${{ steps.deployment.outputs.test_url }}
          TEST_VIDEO: tests/fixtures/sample-5mb.mp4
          TEST_TIMEOUT_MS: 900000
        run: node tests/autonomous-smoke.mjs

      - name: Upload autonomous test failure screenshot
        if: steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: bikeztagram-autotest-failure
          path: autotest-failure.png
          if-no-files-found: ignore

      - name: Run guarded autonomous improvement
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          MAX_AUTO_ITERATIONS: 3
        run: node scripts/autonomous-improver.mjs

      - name: Report test result when no autonomous change was made
        if: steps.smoke.outcome == 'failure' && !cancelled()
        run: |
          if git log -1 --pretty=%s | grep -qi '\[auto-improve '; then
            echo "The autonomous agent made a guarded change; the next workflow cycle will retest it."
          elif [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "Autonomous agent made no new change; leaving this failure for the next review."
          else
            echo "GEMINI_API_KEY is not configured, so autonomous repair is paused."
            exit 1
          fi
