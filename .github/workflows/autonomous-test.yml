name: Bikeztagram Autonomous Test

on:
  push:
    branches:
      - ai-director-two-stage
  workflow_dispatch:
    inputs:
      actions:
        description: 'Number of autonomous improvement actions to run'
        required: false
        default: '10'
        type: string

concurrency:
  group: bikeztagram-autonomous
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  deployments: read

jobs:
  deployed-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine autonomous action budget
        id: budget
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ACTIONS: ${{ inputs.actions }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            remaining="${INPUT_ACTIONS:-10}"
          else
            remaining=$(printf '%s\n' "$COMMIT_MESSAGE" | sed -n 's/.*\[auto-improve remaining=\([0-9][0-9]*\)\].*/\1/p' | head -n1)
            remaining="${remaining:-10}"
          fi
          if ! [[ "$remaining" =~ ^[0-9]+$ ]]; then
            echo "Invalid autonomous action budget: $remaining"
            exit 1
          fi
          echo "remaining=$remaining" >> "$GITHUB_OUTPUT"
          echo "Autonomous actions remaining in this batch: $remaining"

      - name: Set up Node
        if: steps.budget.outputs.remaining != '0'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.budget.outputs.remaining != '0'
        run: npm install

      - name: Download deterministic CC0 test video
        if: steps.budget.outputs.remaining != '0'
        run: |
          mkdir -p tests/fixtures
          curl -L --fail --retry 3 --retry-delay 2 \
            -o tests/fixtures/sample-5mb.mp4 \
            https://cdn.truefilesize.com/mp4/sample-5mb.mp4
          file tests/fixtures/sample-5mb.mp4
          ls -lh tests/fixtures/sample-5mb.mp4

      - name: Install Playwright Chromium
        if: steps.budget.outputs.remaining != '0'
        run: npx playwright install --with-deps chromium

      - name: Wait for Vercel deployment and discover URL
        if: steps.budget.outputs.remaining != '0'
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Waiting for Vercel/GitHub deployment for $SHA"
          for attempt in $(seq 1 60); do
            deployments=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments?sha=${SHA}&per_page=20")
            deployment_id=$(echo "$deployments" | jq -r 'map(select(.environment != null and (.environment | test("preview|Preview")))) | sort_by(.created_at) | last | .id // empty')
            if [ -n "$deployment_id" ]; then
              statuses=$(curl -fsSL \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses")
              state=$(echo "$statuses" | jq -r '.[0].state // empty')
              url=$(echo "$statuses" | jq -r '.[0].environment_url // empty')
              echo "Deployment $deployment_id state=$state url=$url"
              if [ "$state" = "success" ] && [ -n "$url" ]; then
                echo "test_url=$url" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
                echo "Vercel deployment failed."
                exit 1
              fi
            fi
            sleep 10
          done
          echo "Timed out waiting for a successful Vercel deployment status."
          exit 1

      - name: Run deployed end-to-end browser test
        if: steps.budget.outputs.remaining != '0'
        id: smoke
        continue-on-error: true
        env:
          TEST_URL: ${{ steps.deployment.outputs.test_url }}
          TEST_VIDEO: tests/fixtures/sample-5mb.mp4
          TEST_TIMEOUT_MS: 900000
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node tests/autonomous-smoke.mjs

      - name: Upload autonomous test failure screenshot
        if: steps.budget.outputs.remaining != '0' && steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: bikeztagram-autotest-failure
          path: autotest-failure.png
          if-no-files-found: ignore

      - name: Run one guarded autonomous improvement
        if: steps.budget.outputs.remaining != '0' && steps.deployment.outcome == 'success'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          MAX_AUTO_ITERATIONS: 1
          AUTO_ITERATION: 0
          AUTO_REMAINING_ACTIONS: ${{ steps.budget.outputs.remaining }}
        run: node scripts/autonomous-improver.mjs

      - name: Report batch status
        if: always() && steps.budget.outputs.remaining != '0'
        run: |
          remaining="${{ steps.budget.outputs.remaining }}"
          if git log -1 --pretty=%s | grep -q '\[auto-improve remaining='; then
            echo "One autonomous action completed. The improver has dispatched the next run when budget remains."
          elif [ "$remaining" -eq 1 ]; then
            echo "Autonomous batch is complete. Use Continue (workflow_dispatch) for another batch of up to 10 actions."
          else
            echo "No autonomous change was committed. The batch is paused so we do not blindly burn actions."
          fi
