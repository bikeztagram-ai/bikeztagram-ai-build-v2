name: Bikeztagram Model Selection Matrix V1
on:
  push:
    branches: [parallel/batch-35-model-selection-matrix]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/verify-model-selection-matrix-v1.mjs
