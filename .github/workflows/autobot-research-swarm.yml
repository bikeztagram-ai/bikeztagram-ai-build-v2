name: 🔬 AutoBot Research Swarm

on:
  workflow_run:
    workflows: ["🧬 AutoBot Evolution Engineer"]
    types: [completed]
  workflow_dispatch:
    inputs:
      local_model:
        description: Model used by research adapters
        required: false
        default: qwen2.5-coder:7b
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: autobot-research-swarm
  cancel-in-progress: false

jobs:
  research:
    strategy:
      fail-fast: false
      matrix:
        strategy:
          - aider-direct
          - aider-diff
          - aider-udiff
          - aider-whole
          - aider-scoped
          - aider-architect
          - direct-ollama-json
          - openhands-sdk
          - deterministic-control
          - evolution-selected
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LOCAL_AI_MODEL: ${{ inputs.local_model || 'qwen2.5-coder:7b' }}
      AUTOBOT_RESEARCH_STRATEGY: ${{ matrix.strategy }}
      AUTOBOT_EVOLUTION_TRIAL_PLAN: ${{ github.event.workflow_run.id || 'manual' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Install Aider adapter
        if: startsWith(matrix.strategy, 'aider-') || matrix.strategy == 'evolution-selected'
        run: python -m pip install --disable-pip-version-check --no-input aider-chat
      - name: Install OpenHands adapter
        if: matrix.strategy == 'openhands-sdk'
        run: python -m pip install --disable-pip-version-check --no-input openhands-sdk
      - name: Start isolated local model
        if: matrix.strategy != 'deterministic-control'
        run: bash scripts/autobot/install-local-brain.sh
        env:
          LOCAL_AI_MODEL: ${{ env.LOCAL_AI_MODEL }}
          AUTOBOT_DISCOVERY_MODEL: qwen2.5-coder:3b
          LOCAL_AI_PROXY_NUM_CTX: 4096
          LOCAL_AI_PROXY_NUM_PREDICT: 900
          OLLAMA_CONTEXT_LENGTH: 4096
          OLLAMA_NUM_PARALLEL: 1
          OLLAMA_MAX_QUEUE: 2
          OLLAMA_LOAD_TIMEOUT: 20m
          OLLAMA_KEEP_ALIVE: 30m
      - name: Run research trial
        run: node builder/runner/autobot-research-trial.mjs
      - name: Upload isolated research evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autobot-research-${{ matrix.strategy }}-${{ github.run_id }}
          path: autobot-research-result.json
          if-no-files-found: ignore
