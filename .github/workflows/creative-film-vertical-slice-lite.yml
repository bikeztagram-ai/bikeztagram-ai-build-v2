name: Bikeztagram Creative Film Vertical Slice Lite
on:
  push:
    branches:
      - development/from-e2e-working-baseline
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - run: npm run build
      - run: node scripts/verify-creative-film-vertical-slice-v1-lite.mjs
